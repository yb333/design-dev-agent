whitelist:
  sql_files:
    pattern: "**/*.sql"
    reason: "SQL ETL脚本需要业务逻辑注释，符合DWS编码规范"
    auto_approve: true
    comment_types:
      - "业务逻辑说明"
      - "字段注释"
      - "JOIN策略说明"
      - "性能优化说明"
      - "来源表信息"
  
  docs_files:
    pattern: "**/docs/**/*.md"
    reason: "文档文件需要详细说明"
    auto_approve: true
  
  config_files:
    pattern: "**/*.{yaml,yml,json,toml}"
    reason: "配置文件注释是必要的"
    auto_approve: true
  
  shell_scripts:
    pattern: "**/*.sh"
    reason: "Shell脚本需要模块说明和复杂逻辑注释"
    auto_approve: true
  
  python_scripts:
    pattern: "**/*.py"
    reason: "Python脚本需要API文档和复杂算法注释"
    auto_approve: true

rules:
  - if_match: whitelist
    then: skip_review
  - else: require_review

explanations:
  "SQL文件": "DWS编码规范要求所有字段必须有中文注释，业务逻辑需要说明"
  "文档文件": "Markdown文档需要详细说明，这是文档的本质"
  "配置文件": "YAML/JSON/TOML配置需要注释说明配置项含义"
  "Shell脚本": "运维脚本需要模块划分和复杂逻辑说明"
  "Python脚本": "工具类需要API文档，复杂算法需要解释"
