# ============================================================================
# design_decisions.yaml - 设计决策（合同pu分析表 dwl_con_pu_any_f）
# ----------------------------------------------------------------------------
# 只含"设计判断"，不含字段类型/来源等确定性数据。
# 字段详情（类型/注释/来源字段）由 assemble_ts.py 从 rs_input.json 自动搬移。
# 对齐同表现有 ts.json 约定（docs/output/dwl_con_pu_any_f/02_design/ts.json）。
#
# 产出规则：
# 1. field_targets 覆盖 rs_input 全部 16 个 target_column，不漏不重。
# 2. field_logics 只写【加工类业务字段】的自然语言口径；直取字段脚本自动填；
#    审计字段（del_flag/crt_cycle_id/last_upd_cycle_id/dw_last_update_date）脚本自动处理。
# 3. I视图由脚本从 F表名自动派生（_f -> _i），无需独立规则。
# ============================================================================

# === 规则拆分（核心判断）===
# 一个规则 = 一条 INSERT = 产出一个表。本表为单规则F表写入。
rules:
  - rule_code: R0001
    rule_name: "合同pu分析表写入"
    scenario: "默认场景"
    exec_sequence: 1
    target_table: "fin_dwl_cnb.dwl_con_pu_any_f"
    is_view_step: false
    design_intent: >-
      主查询：将主表 rpt_code 指标行转列收敛为4个金额列，LEFT JOIN 合同分析表取项目key、
      收敛后的发票指标表（排除非洲发票）取发票总额、pu维表（取最新有效行）取pu_key，
      按合同+pu粒度写入分析宽表。

    # 该规则产出全部目标字段（脚本据此从 rs_input 搬字段详情）
    field_targets:
      # --- 主表直取维度 ---
      - contract_no
      - contract_id
      - pu_id
      - tc_code
      # --- 主表行转列金额（条件聚合 rpt_code）---
      - equip_org_amt_usd
      - equip_org_amt_rmb
      - equip_cfm_amt_rmb
      - equip_cfm_amt_usd
      # --- 合同分析表直取 ---
      - proj_key
      # --- 发票指标表收敛 ---
      - inv_tol_amt_usd
      - inv_tol_amt_rmb
      # --- pu维表直取 ---
      - pu_key
      # --- 审计字段（rs_input 已提供，必须包含；逻辑脚本自动处理）---
      - del_flag
      - crt_cycle_id
      - last_upd_cycle_id
      - dw_last_update_date

    # 仅加工类业务字段写 design_logic（自然语言口径，不含 SQL）。
    # 直取字段不写（脚本自动填 "直取 {alias}.{column}"）；审计字段不写（脚本自动处理）。
    field_logics:
      equip_org_amt_usd: "行转列：rpt_code='fbt_0001' 对应设备订货，取报表值USD，按合同+pu汇总"
      equip_org_amt_rmb: "行转列：rpt_code='fbt_0001' 对应设备订货，取报表值RMB，按合同+pu汇总"
      equip_cfm_amt_rmb: "行转列：rpt_code='fbt_0002' 对应设备收入，取报表值RMB，按合同+pu汇总"
      equip_cfm_amt_usd: "行转列：rpt_code='fbt_0002' 对应设备收入，取报表值USD，按合同+pu汇总"
      inv_tol_amt_usd: "对发票指标表发票瞬时金额USD求和，排除非洲发票，按合同+pu收敛后关联"
      inv_tol_amt_rmb: "对发票指标表发票瞬时金额RMB求和，排除非洲发票，按合同+pu收敛后关联"

    # 该规则关联的源表（填别名，脚本从 rs_input 补 schema/table）
    source_aliases: ["t", "f", "inv_mtr", "pu"]

    # CTE（内联临时表）
    ctes:
      - name: "inv_agg"
        purpose: >-
          对发票指标表按 contract_id+pu_id 收敛求和（排除非洲发票），
          产出合同+pu粒度的发票总额，避免 JOIN 发散。
        source_tables: ["fin_dwl_cnb.dwl_inv_mtr_i"]

    # 粒度变化（输入→输出）
    grain:
      input: "(contract_id, pu_id, rpt_code) — 主表每个合同+pu含多行 rpt_code 指标"
      output: "(contract_id, pu_id) — rpt_code 行转列后收敛为单行"
      change: "行转列（SUM + CASE WHEN rpt_code）"

    # 关联策略
    joins:
      - alias: "t"
        type: "main"
        condition: "主表（粒度锚点：合同+pu）"
        filter: ""
      - alias: "f"
        type: "LEFT JOIN"
        condition: "t.contract_key = f.contract_key"
        filter: ""
      - alias: "inv_agg"
        type: "LEFT JOIN"
        condition: "t.contract_id = inv_agg.contract_id AND t.pu_id = inv_agg.pu_id"
        filter: "来源发票排除非洲发票"
      - alias: "pu"
        type: "LEFT JOIN"
        condition: "t.pu_id = pu.pu_id"
        filter: "取最新有效行"

    # 关联安全分析（JOIN键唯一性 → 对齐策略）
    join_safety:
      - table: "dwl_con_any_f"
        join_key_unique: true
        strategy: "直接关联"
        reason: "合同分析表按合同粒度，与主表合同键一对一"
      - table: "dwl_inv_mtr_i"
        join_key_unique: false
        strategy: "GROUP BY收敛"
        reason: "发票指标表含发票维度，按合同+pu不唯一，需先按合同+pu SUM收敛后再关联（同时排除非洲发票）"
      - table: "dwr_dim_pu_d"
        join_key_unique: false
        strategy: "取最新有效行"
        reason: "维度表含历史版本，取最新有效行保证唯一"

# === 复杂度分析与分段决策 ===
complexity_analysis:
  join_count: 3                         # 关联表数量（f / inv_agg / pu，主表不计）
  has_grain_change: true                # 有粒度变化（行转列收敛）
  grain_change_detail: "行转列：主表（合同,pu,rpt_code）→ 目标表（合同,pu），rpt_code维度展开为4个金额列"
  multi_step_fields: 6                  # 行转列4（equip_org/cfm_amt_usd/rmb）+ 收敛2（inv_tol_amt_usd/rmb）
  aggregation_after_join: false         # 聚合发生在 CTE/主查询内，非 JOIN 后聚合
  segmentation_decision: "不分段"
  segmentation_reason: "JOIN≤12（3）、聚合后关联=否、复杂关联链≤2；行转列与发票收敛均为单步加工，满足CTE内联条件，不建物理中间表"

# === 分布键（参考 design-guide.md §2.1：高基数 JOIN 字段）===
distribution_key: ["contract_id", "pu_id"]

# === 业务主键（业务唯一字段组合，供 UT 主键唯一检查）===
# 注意：≠ 分布键。此处与分布键同列，因合同+pu 即业务唯一粒度。
business_key: ["contract_id", "pu_id"]

# === 调度细化（rs_input.schedule 为空，由 designer 细化）===
schedule:
  task_name: "task_dwl_con_pu_any_f"
  cron: "0 0 1 * * ?"                    # 每日01:00（T+1）
  task_group: "GROUP_SPRD"
  project: "SRP_DAILY"
  upstream_added: []                    # 无中间表，未引入新上游

# === 数据流（规则间关系）===
data_flow:
  dependencies: []                      # 单规则，无规则间依赖
  schedule_groups:
    - sequence: 1
      rules: ["R0001"]

# === DQ（本表无 DQ 要求）===
dq_rules: []
