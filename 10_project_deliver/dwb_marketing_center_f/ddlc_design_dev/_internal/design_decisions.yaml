# ============================================================================
# design_decisions.yaml - 营销中心宽表 (slmar.dwb_marketing_center_f)
# ----------------------------------------------------------------------------
# 设计判断：单规则（不分段），订单指标经 CTE order_agg 预聚合后关联。
# 字段类型/来源/注释由 assemble_ts.py 从 rs_input.json 自动搬移，本文件只含设计判断。
# ============================================================================

# === 规则拆分 ===
# 一个规则 = 一条 INSERT = 产出目标 F 表。I 视图由 coder 从 meta.target.i_view 镜像生成。
rules:
  - rule_code: R0001
    rule_name: "营销中心宽表写入"
    scenario: "default"
    exec_sequence: 1
    target_table: "slmar.dwb_marketing_center_f"
    is_view_step: false
    design_intent: >-
      主查询：以活动事实表(dwd_activity_f)为粒度锚点，LEFT JOIN 活动类型维度表取类型说明、
      LEFT JOIN 优惠券维度表取券信息，并 LEFT JOIN 订单指标 CTE(order_agg，由 dwd_order_f 按
      activity_id 预聚合得到订单数/GMV/参与人数/优惠金额/新客订单数)取活动级订单指标，
      最后在主查询层计算派生比率(优惠券使用率/人均消费/新客占比/活动ROI)，按活动粒度全量覆盖写入宽表。
      订单明细经 CTE 收敛后再关联，避免活动行发散。
    load_mode: "truncate_table"

    # 该规则产出全部 29 个目标字段（25 业务 + 4 审计）
    field_targets:
      # --- 活动基础信息（主表 dwd_activity_f）---
      - activity_id
      - activity_name
      - activity_type_name
      - activity_type_desc
      - activity_status_name
      - start_time
      - end_time
      - activity_days
      - create_time
      - min_amount
      - discount_rate
      - max_discount
      # --- 优惠券信息（dim_coupon_f）---
      - coupon_id
      - coupon_name
      - coupon_type_name
      - coupon_total_qty
      - coupon_used_qty
      - coupon_use_rate
      # --- 订单指标（CTE order_agg，源自 dwd_order_f）---
      - order_cnt
      - gmv_amount
      - participant_cnt
      - total_discount_amount
      - new_user_rate
      # --- 派生指标（主查询层计算）---
      - avg_order_amount
      - activity_roi
      # --- 审计字段 ---
      - del_flag
      - crt_cycle_id
      - last_upd_cycle_id
      - dw_last_update_date

    # ★ 仅加工类字段写 design_logic（自然语言口径，不含 SQL）。
    # 直取字段（transform_rule=直接复制）不写，脚本自动填；审计字段脚本自动处理。
    field_logics:
      activity_type_name: >-
        活动类型编码转中文：SECKILL→秒杀、GROUPBUY→团购、PRESALE→预售、FULL_REDUCE→满减、
        FULL_GIFT→满赠，其余→其他。
      activity_status_name: >-
        活动状态编码转中文：DRAFT→草稿、PENDING→待开始、RUNNING→进行中、ENDED→已结束，
        其余→其他。
      activity_days: "活动天数 = 结束时间与开始时间的天数差。"
      coupon_type_name: >-
        优惠券类型编码转中文：FULL_REDUCE→满减券、DISCOUNT→折扣券、CASH→现金券，其余→其他。
      coupon_use_rate: "优惠券使用率 = 已使用量 / 发放总量 × 100，发放总量为 0 时返回 NULL 避免除零。"
      order_cnt: >-
        活动订单数 = 按 activity_id 关联 dwd_order_f 后 COUNT(*) 统计订单行数；先在 CTE order_agg
        中收敛到活动粒度，再 LEFT JOIN 关联主表。
      gmv_amount: >-
        活动 GMV = 按 activity_id 关联 dwd_order_f 后 SUM(pay_amount) 汇总支付金额；先在 CTE
        order_agg 中收敛到活动粒度，再关联主表。
      participant_cnt: >-
        参与人数 = 按 activity_id 关联 dwd_order_f 后 COUNT(DISTINCT user_id) 去重统计下单用户数；
        先在 CTE order_agg 中收敛到活动粒度，再关联主表。
      total_discount_amount: >-
        活动优惠金额 = 按 activity_id 关联 dwd_order_f 后 SUM(discount_amount) 汇总优惠金额；
        先在 CTE order_agg 中收敛到活动粒度，再关联主表。
      new_user_rate: >-
        新客占比 = 活动期间新客订单数 / 总订单数 × 100；在 CTE order_agg 中同时统计新客订单数与
        总订单数。⚠ 新客判定标准待确认（需用户首次下单时间或新客标记字段），RS 未提供明确口径。
      avg_order_amount: "人均消费 = 活动 GMV / 参与人数，参与人数为 0 时返回 NULL 避免除零。"
      activity_roi: >-
        活动 ROI = (活动 GMV − 活动成本) / 活动成本 × 100；活动成本 = 优惠金额 + 满减金额 + 运营成本。
        ⚠ 满减金额与运营成本来源待确认（RS 未提供明确字段；源表 dwd_coupon_use_f 已列入但无字段映射，
        疑为优惠券成本来源，需人工确认口径）。

    # 该规则关联的源表别名（脚本据此从 rs_input 补 schema/table）
    source_aliases:
      - daf
      - dat
      - dcf
      - dof

    # CTE（内联临时表）
    ctes:
      - name: "order_agg"
        purpose: >-
          对订单明细事实表(dwd_order_f)按 activity_id 收敛，预聚合活动级订单指标：订单数、GMV、
          参与人数、优惠金额、新客订单数。避免直接 JOIN 订单明细导致活动行发散（一对多 fan-out）。
        source_tables: ["dwd_order_f"]

    # 粒度变化（输入→输出）
    grain:
      input: "一行=一个活动（主表 dwd_activity_f），左连活动类型/优惠券维度，订单指标经 CTE 预聚合后关联"
      output: "一行=一个营销记录（活动粒度）"
      change: "主表活动粒度不变；订单明细→活动级的聚合收敛在 CTE order_agg 内完成"

    # 关联策略
    joins:
      - alias: "daf"
        type: "main"
        condition: "主表（粒度锚点：每行一个活动，activity_id 唯一）"
        filter: ""
      - alias: "dat"
        type: "LEFT JOIN"
        condition: "daf.activity_type = dat.type_code"
        filter: ""
      - alias: "dcf"
        type: "LEFT JOIN"
        condition: "daf.activity_id = dcf.activity_id"
        filter: ""
      - alias: "order_agg"
        type: "LEFT JOIN"
        condition: "daf.activity_id = order_agg.activity_id"
        filter: ""

    # 关联安全分析（JOIN键唯一性 → 对齐策略）
    join_safety:
      - table: "dim_activity_type_f"
        join_key_unique: true
        strategy: "直接关联"
        reason: "活动类型维度表按 type_code 唯一（类型字典：SECKILL/GROUPBUY 等），与主表一对一。"
      - table: "dim_coupon_f"
        join_key_unique: false
        strategy: "需确认收敛策略（假设每活动一券；若一对多需取主券或聚合）"
        reason: >-
          按 activity_id 关联优惠券维度；目标表券字段(coupon_id/coupon_name)为标量，隐含每活动一券
          假设。若数据存在一活动多券将导致活动行发散，需补充收敛策略（取最新/主券/聚合）。⚠ 待人工确认。
      - table: "dwd_order_f"
        join_key_unique: false
        strategy: "CTE 预聚合收敛（按 activity_id GROUP BY 后关联）"
        reason: "订单明细为一对多（一活动多订单），直接 JOIN 会发散；经 CTE order_agg 收敛到活动粒度后保证唯一。"

# === 复杂度分析与分段决策 ===
complexity_analysis:
  join_count: 3                         # LEFT JOIN 操作数（dat/dcf/order_agg，不含主表）
  has_grain_change: true                # 源→目标存在粒度变化（订单明细→活动）
  grain_change_detail: "订单明细(dwd_order_f，订单粒度)→活动粒度，经 CTE order_agg 预聚合收敛后关联；主表活动粒度不变。"
  multi_step_fields: 6                  # order_cnt/gmv_amount/participant_cnt/total_discount_amount/new_user_rate/activity_roi
  aggregation_after_join: false         # 聚合在 CTE 内（JOIN 前）完成，非 JOIN 后聚合
  segmentation_decision: "不分段"
  segmentation_reason: >-
    JOIN≤12（3）、订单指标经 CTE order_agg 预聚合后关联（聚合后关联=否）；多步骤加工字段虽达 6 个，
    但均源自同一订单聚合 CTE（单步收敛即可完成），满足 CTE 内联条件，不建物理中间表。

# === 分布键 ===
# activity_id：高基数业务主键，且为全表 JOIN 键，多表关联时分布一致保证本地关联。
distribution_key:
  - activity_id

# === 业务主键 ===
business_key:
  - activity_id

business_key_design:
  input_key:
    - activity_id                       # RS 备注"主键"
  adjusted: false
  reason: "活动 ID 在活动粒度下唯一，直接作为业务主键。（前提：dim_coupon_f 一对一假设成立，见 join_safety）"

# === 调度细化 ===
schedule:
  task_name: "task_dwb_marketing_center_f"
  cron: "0 30 3 * * ?"                  # 每日 03:30（T+1，一天一调，SLA 3:30）
  task_group: "GROUP_SLMAR"
  project: "SLMAR_DAILY"
  # 设计新增的上游依赖（RS 未列；中间表/CTE 引入的订单明细为关键路径上游）
  upstream_added:
    - table: "sdmar.dwd_activity_f"
      task: "task_dwd_activity_f"
    - table: "sdord.dwd_order_f"
      task: "task_dwd_order_f"
    - table: "dim.dim_activity_type_f"
      task: "task_dim_activity_type_f"
    - table: "dim.dim_coupon_f"
      task: "task_dim_coupon_f"

# === 数据流（规则间关系）===
data_flow:
  dependencies: []                      # 单规则，无规则间依赖；F→I 视图由 coder 自动镜像
  schedule_groups:
    - sequence: 1
      rules:
        - R0001

# === DQ（可选）===
dq_rules: []
