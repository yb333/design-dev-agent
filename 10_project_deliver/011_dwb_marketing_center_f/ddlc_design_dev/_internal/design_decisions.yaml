# ============================================================================
# design_decisions.yaml - 营销中心宽表 (slmar.dwb_marketing_center_f) 设计决策
# ----------------------------------------------------------------------------
# 只含设计判断，不含字段类型/来源等确定性数据（由 assemble_ts.py 从 rs_input.json 搬）。
#
# 字段分配总览（29 个 target_column，无遗漏无重复）：
#   R0001 活动订单指标中间表 : 5 字段  (订单明细按 activity_id 聚合)
#   R0002 目标F表组装        : 24 字段 (daf直取8 + daf加工3 + dat直取1 + dcf直取4
#                                       + dcf加工2 + tmp1派生2 + 审计4)
# ----------------------------------------------------------------------------

# === 规则拆分（核心判断）===
rules:
  # --------------------------------------------------------------------------
  # R0001 活动订单指标中间表
  # 把 dwd_order_f（订单明细粒度，同一活动多笔订单）按 activity_id 聚合收口到
  # 活动粒度，产出订单域核心指标（订单数/GMV/参与人数/优惠金额/新客占比）。
  # 物理中间表理由：5 个订单指标内聚且可独立校验，为最终宽表提供订单指标输入。
  # --------------------------------------------------------------------------
  - rule_code: R0001
    rule_name: "活动订单指标中间表"
    scenario: "default"
    exec_sequence: 1
    target_table: "dwb_marketing_order_tmp"
    is_view_step: false
    design_intent: "将订单明细事实表按活动ID聚合收口到活动粒度，产出订单域核心指标（订单数/GMV/参与人数/优惠金额/新客占比），为最终宽表提供订单指标输入"

    field_targets:
      - order_cnt
      - gmv_amount
      - participant_cnt
      - total_discount_amount
      - new_user_rate

    field_logics:
      order_cnt: "按 activity_id 分组统计关联订单数 COUNT(*)，仅计入未取消的有效订单"
      gmv_amount: "按 activity_id 分组对订单支付金额求和 SUM(pay_amount)，得到活动 GMV"
      participant_cnt: "按 activity_id 分组统计去重参与用户数 COUNT(DISTINCT user_id)"
      total_discount_amount: "按 activity_id 分组对订单优惠金额求和 SUM(discount_amount)"
      new_user_rate: "活动期间新用户订单数除以总订单数乘以100得到新客占比百分比。⚠️新用户识别需定义：假设以用户首次下单时间落在活动期间判定为新客，需在订单明细上按用户取首单日期比对活动起止时间（语义待人工确认）"

    source_aliases:
      - dof

    grain:
      input: "一行=一条订单明细（同一活动多笔订单）"
      output: "一行=一个活动"
      change: "多行聚合"

    joins:
      - alias: "dof"
        type: "main"
        condition: "单源表聚合，无关联"
        filter: "order_status NOT IN ('CANCELLED','DELETED')，仅计入有效订单"

    join_safety:
      - table: "dwd_order_f (dof)"
        join_key_unique: true
        strategy: "GROUP BY activity_id 收敛"
        reason: "订单明细按 activity_id 分组聚合后每活动一行，聚合结果天然唯一"

  # --------------------------------------------------------------------------
  # R0002 目标F表组装
  # 以 dwd_activity_f 为主表，关联活动类型维、优惠券维、优惠券使用成本 CTE、
  # 订单指标中间表，装配全部宽表字段：
  #   - 活动基础直取 + 字典翻译 + 日期差
  #   - 优惠券直取与派生
  #   - 订单派生指标（人均消费/ROI）
  #   - 审计字段
  # --------------------------------------------------------------------------
  - rule_code: R0002
    rule_name: "营销中心宽表组装"
    scenario: "default"
    exec_sequence: 2
    target_table: "dwb_marketing_center_f"
    is_view_step: false
    design_intent: "以活动事实表为主表，LEFT JOIN 活动类型维、优惠券维、优惠券使用成本CTE、订单指标中间表，装配全部宽表字段（活动直取+字典翻译+日期差+优惠券直取与派生+订单派生指标+ROI+审计）"

    field_targets:
      # --- daf 直取字段（8个，脚本自动填 design_logic，此处不写 field_logics）---
      - activity_id
      - activity_name
      - start_time
      - end_time
      - create_time
      - min_amount
      - discount_rate
      - max_discount
      # --- daf 单步加工字段（3个，字典翻译/日期差）---
      - activity_type_name
      - activity_status_name
      - activity_days
      # --- dat 直取字段（1个）---
      - activity_type_desc
      # --- dcf 直取字段（4个）---
      - coupon_id
      - coupon_name
      - coupon_total_qty
      - coupon_used_qty
      # --- dcf 单步加工字段（2个，字典翻译/比率）---
      - coupon_type_name
      - coupon_use_rate
      # --- tmp1 派生计算字段（2个，依赖订单指标中间表聚合结果的二阶加工）---
      - avg_order_amount
      - activity_roi
      # --- 审计字段（4个，assemble 自动处理，不写 field_logics）---
      - del_flag
      - crt_cycle_id
      - last_upd_cycle_id
      - dw_last_update_date

    field_logics:
      # daf 单步加工（字典翻译/日期差）
      activity_type_name: "活动类型编码字典翻译：SECKILL转秒杀、GROUPBUY转团购、PRESALE转预售、FULL_REDUCE转满减、FULL_GIFT转满赠，其余为其他"
      activity_status_name: "活动状态编码字典翻译：DRAFT转草稿、PENDING转待开始、RUNNING转进行中、ENDED转已结束，其余为其他"
      activity_days: "结束时间减开始时间的天数差"
      # dcf 单步加工（字典翻译/比率）
      coupon_type_name: "优惠券类型编码字典翻译：FULL_REDUCE转满减券、DISCOUNT转折扣券、CASH转现金券，其余为其他"
      coupon_use_rate: "优惠券已使用量除以发放总量乘以100得到使用率百分比（发放总量为0时返回空值避免除零）"
      # tmp1 派生计算（依赖订单指标中间表聚合结果）
      avg_order_amount: "活动GMV除以参与人数得到人均消费（参与人数为0时返回空值避免除零），取自订单指标中间表"
      activity_roi: "活动ROI=(GMV-活动成本)/活动成本×100。活动成本=优惠券抵扣金额(优惠券使用事实表按activity_id汇总)+满减优惠金额+运营成本。⚠️源表未提供运营成本字段，需人工补充数据源或暂置0；成本项口径待人工确认"

    source_aliases:
      - daf
      - dat
      - dcf
      - dcu

    ctes:
      - name: "coupon_cost_agg"
        purpose: "按 activity_id 汇总优惠券使用事实表的抵扣金额，将一个活动的多笔优惠券使用收敛为一行，供活动ROI成本计算"
        source_tables:
          - "sdmar.dwd_coupon_use_f (dcu)"

    grain:
      input: "一行=一个活动（各源已收口到活动粒度）"
      output: "一行=一个活动"
      change: "无变化"

    joins:
      - alias: "daf"
        type: "main"
        condition: "活动事实表主表"
        filter: ""
      - alias: "dat"
        type: "LEFT JOIN"
        condition: "daf.activity_type = dat.type_code"
        filter: ""
      - alias: "dcf"
        type: "LEFT JOIN"
        condition: "daf.activity_id = dcf.activity_id"
        filter: ""
      - alias: "coupon_cost_agg"
        type: "LEFT JOIN"
        condition: "daf.activity_id = coupon_cost_agg.activity_id"
        filter: ""
      - alias: "dwb_marketing_order_tmp"
        type: "LEFT JOIN"
        condition: "daf.activity_id = dwb_marketing_order_tmp.activity_id"
        filter: ""

    join_safety:
      - table: "dwd_activity_f (daf)"
        join_key_unique: true
        strategy: "无需对齐"
        reason: "活动事实表主表，activity_id 为业务主键天然唯一，作为关联基表"
      - table: "dim_activity_type_f (dat)"
        join_key_unique: true
        strategy: "无需对齐"
        reason: "活动类型维度表按 type_code 关联，编码唯一（RS未标拉链，假设当前快照）"
      - table: "dim_coupon_f (dcf)"
        join_key_unique: false
        strategy: "假设一活动一主券或取首条/需人工确认"
        reason: "优惠券维度按 activity_id 关联，若一活动多券则非唯一；RS按直接复制处理假设一活动一券，需人工确认"
      - table: "coupon_cost_agg (CTE)"
        join_key_unique: true
        strategy: "已 GROUP BY 收敛"
        reason: "CTE 内已按 activity_id 分组聚合，每活动一行"
      - table: "dwb_marketing_order_tmp"
        join_key_unique: true
        strategy: "已 GROUP BY 收敛"
        reason: "R0001 产出，已按 activity_id 聚合，每活动一行"

# === 复杂度分析与分段决策 ===
complexity_analysis:
  join_count: 4
  has_grain_change: true
  grain_change_detail: "订单明细（同一活动多笔订单）与优惠券使用（同一活动多笔使用）均为明细粒度，需先按 activity_id 聚合收口到活动粒度后再关联到活动主表（聚合后关联）"
  multi_step_fields: 6
  aggregation_after_join: true
  segmentation_decision: "分段"
  segmentation_reason: "多项复杂度指标触发分段：(1) 多步骤加工字段 6 个（达到阈值 5）：含 5 订单聚合指标（order_cnt/gmv_amount/participant_cnt/total_discount_amount/new_user_rate）+ 1 ROI 跨源派生；(2) 存在粒度变化：订单明细（多行/活动）需聚合收口到活动粒度；(3) 存在聚合后关联：订单与优惠券使用均需先 GROUP BY activity_id 再 JOIN 到活动主表。采用分段策略：将 5 个订单域聚合指标收口为物理中间表 dwb_marketing_order_tmp（5 字段内聚且可独立校验，被宽表人均消费/ROI 复用）；优惠券使用成本仅用于 ROI 单点计算（用一次），用 CTE coupon_cost_agg 内联即可，无需建物理表。JOIN 表数 4 张（dat/dcf/dcu-CTE/dof→tmp1）虽未超阈值，但多步骤字段与粒度变化已充分支持分段决策。"

# === 分布键 ===
# activity_id 为业务主键、最高基数、各表 JOIN 键一致 → 本地关联最优，避免数据重分布
distribution_key:
  - activity_id

# === 业务主键（UT 唯一性检查用）===
business_key:
  - activity_id

# === 调度细化 ===
schedule:
  task_name: "dwb_marketing_center_f"
  cron: "0 30 3 * * ?"
  task_group: "dwb_marketing_center"
  project: "slmar"
  upstream_added: []

# === 数据流（规则间关系）===
data_flow:
  dependencies:
    - from: "R0001"
      to: "R0002"
      type: "data_flow"
      intermediate_table: "dwb_marketing_order_tmp"
  schedule_groups:
    - sequence: 1
      rules: ["R0001"]
    - sequence: 2
      rules: ["R0002"]

# === DQ（rs_input 无 DQ 需求）===
dq_rules: []
