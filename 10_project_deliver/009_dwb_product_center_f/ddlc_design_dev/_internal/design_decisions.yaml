# ============================================================================
# design_decisions.yaml - 设计决策（dwb_product_center_f 商品中心宽表）
# ----------------------------------------------------------------------------
# 只含"设计判断"，字段类型/来源/注释由 assemble_ts.py 从 rs_input.json 自动搬移。
#
# 复杂度判断摘要：
#   - 7 张源表关联；订单明细、评价表为"多行/商品"，必须先按 product_id 聚合
#     再 JOIN 主表，否则商品行发散（聚合后关联）。
#   - 多步骤聚合字段 = 7（≥5 阈值）→ 命中分段。
#   - 拆分：销售汇总中间表(R0001) + 评价汇总中间表(R0002) + 目标宽表(R0003)。
# ============================================================================

# === 规则拆分（核心判断）===
rules:
  # --------------------------------------------------------------------------
  # R0001：销售汇总中间表
  # 从订单商品明细按 product_id 聚合到商品粒度，收口 4 个销量/买家指标。
  # --------------------------------------------------------------------------
  - rule_code: R0001
    rule_name: "商品销售汇总中间表"
    scenario: "default"
    exec_sequence: 1
    target_table: "dwb_product_sales_tmp1"
    is_view_step: false
    design_intent: "把订单明细(多行/商品)按 product_id 聚合到商品粒度，产出销量/销售额/买家数/近30天销量，供 R0003 关联，避免主表行数发散"

    field_targets:
      - total_sales_qty
      - total_sales_amount
      - buyer_cnt
      - sales_qty_30d

    field_logics:
      total_sales_qty: "按 product_id 汇总 dwd_order_detail_f 全量订单的 qty 求和，得到累计销量"
      total_sales_amount: "按 product_id 汇总 dwd_order_detail_f 全量订单的 real_price×qty 求和，得到累计销售额"
      buyer_cnt: "按 product_id 统计 dwd_order_detail_f 中去重 user_id 的数量，得到购买人数"
      sales_qty_30d: "按 product_id 汇总 dwd_order_detail_f 近30天(以订单时间过滤)的 qty 求和，得到近30天销量"

    source_aliases: ["dod"]

    grain:
      input: "一行=一条订单商品明细"
      output: "一行=一个商品"
      change: "多行聚合"

    joins:
      - alias: "dod"
        type: "main"
        condition: "从 sdord.dwd_order_detail_f 读取"
        filter: "排除作废/无效订单(若有状态字段，按业务口径过滤)"

    join_safety:
      - table: "dwd_order_detail_f"
        join_key_unique: true
        strategy: "GROUP BY product_id 收敛到商品粒度，聚合后 product_id 唯一"
        reason: "订单明细为多行/商品，聚合后才可安全关联主表"

  # --------------------------------------------------------------------------
  # R0002：评价汇总中间表
  # 从评价表按 product_id 聚合到商品粒度，收口 3 个评价指标。
  # --------------------------------------------------------------------------
  - rule_code: R0002
    rule_name: "商品评价汇总中间表"
    scenario: "default"
    exec_sequence: 1
    target_table: "dwb_product_review_tmp1"
    is_view_step: false
    design_intent: "把评价表(多行/商品)按 product_id 聚合到商品粒度，产出评价数/平均评分/好评率，供 R0003 关联，避免主表行数发散"

    field_targets:
      - review_cnt
      - avg_rating
      - good_review_rate

    field_logics:
      review_cnt: "按 product_id 统计 dwd_review_f 的评价总数 COUNT(*)"
      avg_rating: "按 product_id 计算 dwd_review_f 的评分均值 AVG(rating)，保留一位小数"
      good_review_rate: "按 product_id 统计 dwd_review_f 的好评数(评分达好评阈值)占比×100；好评率=好评数/评价总数×100"

    source_aliases: ["drf"]

    grain:
      input: "一行=一条评价"
      output: "一行=一个商品"
      change: "多行聚合"

    joins:
      - alias: "drf"
        type: "main"
        condition: "从 sdrev.dwd_review_f 读取"
        filter: "排除无效/屏蔽评价(若有状态字段，按业务口径过滤)"

    join_safety:
      - table: "dwd_review_f"
        join_key_unique: true
        strategy: "GROUP BY product_id 收敛到商品粒度，聚合后 product_id 唯一"
        reason: "评价为多行/商品，聚合后才可安全关联主表"

  # --------------------------------------------------------------------------
  # R0003：目标宽表 dwb_product_center_f
  # 以 dim_product_f 为主表，LEFT JOIN 分类/品牌/店铺/库存维度 + R0001/R0002 中间表，
  # 产出商品基础直取字段、价格/库存加工字段、审计字段。
  # --------------------------------------------------------------------------
  - rule_code: R0003
    rule_name: "商品中心宽表装配"
    scenario: "default"
    exec_sequence: 2
    target_table: "dwb_product_center_f"
    is_view_step: false
    design_intent: "以 dim_product_f 为主表，LEFT JOIN 分类/品牌/店铺维度、库存快照及销售/评价汇总中间表，装配出每行一个商品的宽表(含价格折扣、库存状态等加工字段)"

    field_targets:
      # 商品基础(直取 dpf)
      - product_id
      - product_name
      - product_code
      - create_time
      - on_shelf_time
      - cost_price
      - sale_price
      - market_price
      - weight
      - volume
      - product_tag
      # 分类(直取 dpc + dpf.category_id)
      - category_id
      - category_name
      - category_path
      # 品牌(直取 dbf + dpf.brand_id)
      - brand_id
      - brand_name
      - brand_origin
      # 店铺(直取 dsf + dpf.shop_id)
      - shop_id
      - shop_name
      # 库存(直取 dif)
      - stock_qty
      - locked_qty
      - warning_qty
      # 价格/库存加工字段(aggregate)
      - product_status_name
      - discount_rate
      - gross_profit
      - gross_profit_rate
      - available_qty
      - stock_status
      # 审计字段(rs_input 已提供，脚本自动处理，无需写 field_logics)
      - del_flag
      - crt_cycle_id
      - last_upd_cycle_id
      - dw_last_update_date

    field_logics:
      product_status_name: "将 dpf.product_status 枚举翻译为中文：ON_SHELF→上架、OFF_SHELF→下架、SOLD_OUT→售罄、其余→其他"
      discount_rate: "(market_price - sale_price) / market_price × 100，市场价相对销售价的折扣比率(%)"
      gross_profit: "sale_price - cost_price，单品毛利"
      gross_profit_rate: "(sale_price - cost_price) / sale_price × 100，毛利率(%)"
      available_qty: "stock_qty - locked_qty，可售数量"
      stock_status: "基于可售数量判定库存状态：available_qty≤0→缺货、available_qty≤warning_qty→低库存、否则→正常"

    source_aliases: ["dpf", "dpc", "dbf", "dsf", "dif"]

    grain:
      input: "一行=一个商品(主表) + 各维度/库存/聚合中间表"
      output: "一行=一个商品"
      change: "无变化"

    joins:
      - alias: "dpf"
        type: "main"
        condition: "dim.dim_product_f 为主表"
        filter: ""
      - alias: "dpc"
        type: "LEFT JOIN"
        condition: "dpf.category_id = dpc.category_id"
        filter: ""
      - alias: "dbf"
        type: "LEFT JOIN"
        condition: "dpf.brand_id = dbf.brand_id"
        filter: ""
      - alias: "dsf"
        type: "LEFT JOIN"
        condition: "dpf.shop_id = dsf.shop_id"
        filter: ""
      - alias: "dif"
        type: "LEFT JOIN"
        condition: "dpf.product_id = dif.product_id"
        filter: ""
      - alias: "sales_tmp"
        type: "LEFT JOIN"
        condition: "dpf.product_id = sales_tmp.product_id"
        filter: "sales_tmp = R0001 产出的 dwb_product_sales_tmp1"
      - alias: "review_tmp"
        type: "LEFT JOIN"
        condition: "dpf.product_id = review_tmp.product_id"
        filter: "review_tmp = R0002 产出的 dwb_product_review_tmp1"

    join_safety:
      - table: "dim_product_category_f"
        join_key_unique: true
        strategy: "category_id 维度表唯一"
        reason: "分类维度表按 category_id 唯一"
      - table: "dim_brand_f"
        join_key_unique: true
        strategy: "brand_id 维度表唯一"
        reason: "品牌维度表按 brand_id 唯一"
      - table: "dim_shop_f"
        join_key_unique: true
        strategy: "shop_id 维度表唯一"
        reason: "店铺维度表按 shop_id 唯一"
      - table: "dwd_inventory_f"
        join_key_unique: true
        strategy: "假定库存快照按 product_id 唯一(单仓/汇总)；若多仓多行需先按 product_id 聚合再关联"
        reason: "mapping 直接复制库存字段，依赖库存为商品粒度快照"
      - table: "dwb_product_sales_tmp1"
        join_key_unique: true
        strategy: "product_id 已在 R0001 GROUP BY 收敛唯一"
        reason: "中间表聚合后 product_id 唯一"
      - table: "dwb_product_review_tmp1"
        join_key_unique: true
        strategy: "product_id 已在 R0002 GROUP BY 收敛唯一"
        reason: "中间表聚合后 product_id 唯一"

# === 复杂度分析与分段决策 ===
complexity_analysis:
  join_count: 7
  has_grain_change: true
  grain_change_detail: "订单明细表、评价表为多行/商品，需先按 product_id 聚合到商品粒度再关联主表，否则商品行发散"
  multi_step_fields: 7
  aggregation_after_join: true
  segmentation_decision: "分段"
  segmentation_reason: "多步骤聚合字段=7(≥5 阈值)，且订单/评价表需先按 product_id 聚合后才能关联主表(聚合后关联)，单条 INSERT 难以保证正确与可校验；拆为销售汇总、评价汇总两个物理中间表收口，再由主规则 LEFT JOIN 装配目标宽表。中间表可独立校验且复用。"

# === 分布键 ===
# product_id 为高基数业务主键，且为全表 JOIN 字段，各表分布键一致利于本地关联。
distribution_key: ["product_id"]

# === 业务主键（UT 唯一性检查用，≠ 分布键）===
business_key: ["product_id"]

# === 调度细化 ===
schedule:
  task_name: "dwb_product_center_f"
  cron: "0 30 3 * * ?"
  task_group: "slprd_dwb_daily"
  project: "slprd"
  # 设计新增上游：中间表引入对订单/评价 DWD 表 ETL 的依赖(rs_input.upstream 为空)
  upstream_added:
    - table: "sdord.dwd_order_detail_f"
      task: "dwd_order_detail_f 产出任务"
    - table: "sdrev.dwd_review_f"
      task: "dwd_review_f 产出任务"

# === 数据流（规则间关系）===
data_flow:
  dependencies:
    - from: "R0001"
      to: "R0003"
      type: "data_flow"
      intermediate_table: "dwb_product_sales_tmp1"
    - from: "R0002"
      to: "R0003"
      type: "data_flow"
      intermediate_table: "dwb_product_review_tmp1"
  schedule_groups:
    - sequence: 1
      rules: ["R0001", "R0002"]   # 两个聚合中间表相互独立，可并行
    - sequence: 2
      rules: ["R0003"]            # 主规则依赖两个中间表

# === DQ ===
# rs_input.dq_requirements 为空，本表无 DQ 要求。
dq_rules: []
