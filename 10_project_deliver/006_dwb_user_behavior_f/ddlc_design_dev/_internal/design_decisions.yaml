# ============================================================================
# design_decisions.yaml - 设计决策（dws-designer agent 产出）
# ----------------------------------------------------------------------------
# 资产：slord.dwb_user_behavior_f（用户行为宽表）
# 特征：多场景 UNION ALL 宽表（电商交易 / 内容互动 / 社交关系 三场景合并）
# 设计要点：因 user_* 与通用行为字段在三场景物理上同属每一行（无法拆分到多个
#           场景规则），且 assemble_ts.py 禁止同一 target_column 出现在多个规则
#           的 field_targets → 必须用【单条 UNION-ALL 规则】承载所有字段。
# 字段详情（类型/注释/来源）由 assemble_ts.py 从 rs_input.json 自动搬移。
# ============================================================================

# === 规则拆分（核心判断）===
rules:
  - rule_code: R0001
    rule_name: "用户行为宽表三场景 UNION ALL 加工"
    scenario: "电商交易/内容互动/社交关系"   # 多场景合并标记（场景是规则属性）
    exec_sequence: 1
    target_table: "dwb_user_behavior_f"
    is_view_step: false
    design_intent: >
      将三类互斥的用户行为事件流（电商交易、内容互动、社交关系）按统一的
      用户+行为+领域扩展 字段模型 UNION ALL 合并到一张行为宽表。
      因 user_* 与通用行为字段在三场景物理上同属每一行，无法分配到多条场景规则，
      故用单条 INSERT 承载全部 184 个目标字段，三场景作为并联 JOIN 子图
      在同一规则的 SQL 内并行产出，最终 UNION ALL。

    # 该规则拥有 rs_input 去重后的全部 target_column（含 4 个审计字段）
    field_targets:
      # --- user_*（dim_user_base_d，三场景共用，30 个）---
      - user_user_id
      - user_user_name
      - user_user_phone
      - user_gender
      - user_age
      - user_birthday
      - user_province_name
      - user_city_name
      - user_user_level
      - user_user_level_name
      - user_vip_status
      - user_register_time
      - user_register_date
      - user_user_status
      - user_user_status_name
      - user_source_channel
      - user_source_type
      - user_first_active_time
      - user_last_active_time
      - user_active_days
      - user_total_score
      - user_credit_score
      - user_risk_level
      - user_device_type
      - user_os_type
      - user_app_version
      - user_ip_address
      - user_network_type
      - user_is_real_name
      - user_verify_status
      # --- 通用行为字段（三场景共用，10 个）---
      - behavior_id
      - behavior_time
      - behavior_date
      - behavior_hour
      - behavior_weekday
      - behavior_month
      - behavior_quarter
      - behavior_year
      - is_weekend
      - time_period
      # --- order_*（ods_order_main_f，场景1 独有，30 个）---
      - order_order_id
      - order_order_no
      - order_order_status
      - order_order_status_name
      - order_order_amount
      - order_discount_amount
      - order_actual_amount
      - order_payment_method
      - order_payment_time
      - order_shipping_fee
      - order_product_count
      - order_sku_count
      - order_is_first_order
      - order_coupon_id
      - order_coupon_name
      - order_points_used
      - order_points_earned
      - order_complete_time
      - order_cancel_time
      - order_cancel_reason
      - order_merchant_id
      - order_merchant_name
      - order_delivery_type
      - order_delivery_time
      - order_receive_time
      - order_receive_status
      - order_order_source
      - order_remark
      - order_invoice_type
      - order_invoice_title
      # --- prod_*（dim_product_d，场景1 独有，20 个）---
      - prod_product_id
      - prod_product_name
      - prod_product_code
      - prod_sku_id
      - prod_sku_name
      - prod_brand_id
      - prod_brand_name
      - prod_category_id
      - prod_category_name
      - prod_category_level1
      - prod_category_level2
      - prod_category_level3
      - prod_price
      - prod_cost_price
      - prod_profit_rate
      - prod_stock_status
      - prod_sale_status
      - prod_product_type
      - prod_is_virtual
      - prod_supplier_id
      # --- content_*（ods_content_interaction_f + dim_content_d，场景2 独有，50 个）---
      - content_interaction_id
      - content_content_id
      - content_interaction_type
      - content_interaction_type_name
      - content_duration_seconds
      - content_duration_minutes
      - content_comment_content
      - content_comment_word_count
      - content_share_platform
      - content_share_count
      - content_like_count
      - content_comment_count
      - content_collect_count
      - content_forward_count
      - content_is_original
      - content_source_type
      - content_browse_depth
      - content_scroll_percentage
      - content_click_count
      - content_stay_time
      - content_bounce_flag
      - content_exit_page
      - content_session_id
      - content_page_view_count
      - content_unique_visitor
      - content_referer_url
      - content_utm_source
      - content_utm_medium
      - content_utm_campaign
      - content_interaction_device
      - content_content_title
      - content_content_type
      - content_content_category
      - content_author_id
      - content_author_name
      - content_publish_time
      - content_publish_date
      - content_content_length
      - content_word_count
      - content_read_count
      - content_content_like_count
      - content_content_comment_count
      - content_content_share_count
      - content_content_collect_count
      - content_topic_id
      - content_topic_name
      - content_is_hot
      - content_is_recommend
      - content_content_status
      - content_content_score
      # --- social_*（ods_social_relation_f，场景3 独有，25 个）---
      - social_relation_id
      - social_target_user_id
      - social_relation_type
      - social_relation_type_name
      - social_is_mutual
      - social_interaction_count
      - social_last_interaction_time
      - social_relation_status
      - social_source
      - social_group_id
      - social_group_name
      - social_remark
      - social_intimacy_level
      - social_chat_count
      - social_call_count
      - social_video_call_count
      - social_gift_count
      - social_follow_days
      - social_interaction_frequency
      - social_common_friends
      - social_common_groups
      - social_social_distance
      - social_relationship_strength
      - social_trust_level
      - social_contact_importance
      # --- profile_*（dim_user_profile_d，场景3 独有，15 个）---
      - profile_avatar_url
      - profile_profession
      - profile_education
      - profile_interests
      - profile_active_level
      - profile_influence_score
      - profile_social_value
      - profile_user_tags
      - profile_fans_count
      - profile_follow_count
      - profile_friend_count
      - profile_social_activity_score
      - profile_content_creation_score
      - profile_engagement_score
      - profile_social_influence_rank
      # --- 审计字段（赋值，4 个）---
      - del_flag
      - crt_cycle_id
      - last_upd_cycle_id
      - dw_last_update_date

    # ★ 仅加工类字段写 design_logic（自然语言口径，不含 SQL）。
    # 直取字段不写（脚本自动填默认）；审计字段不写（脚本自动处理）。
    field_logics:
      # === user_* 加工类 ===
      user_user_phone: "手机号脱敏：保留前 3 位和后 4 位，中间用 **** 替换"
      user_gender: "性别映射：M→男，F→女，其他→未知"
      user_age: "年龄 = 当前日期的年份减去出生日期的年份"
      user_register_date: "注册日期 = 取注册时间的日期部分"
      user_user_status_name: "用户状态映射：ACTIVE→正常，INACTIVE→未激活，BANNED→封禁，其他→未知"

      # === 通用行为字段（共用，三场景来源列不同，单条 design_logic 说明差异）===
      behavior_time: "行为时间：场景1（电商交易）与场景3（社交关系）取主表 create_time，场景2（内容互动）取 interaction_time"
      behavior_date: "行为日期 = 行为时间的日期部分；场景1/3 由 create_time 取日期，场景2 由 interaction_time 取日期"
      behavior_hour: "行为小时 = 行为时间的小时部分；场景1/3 由 create_time 取小时，场景2 由 interaction_time 取小时"
      behavior_weekday: "行为星期几 = 由行为时间推算；场景1/3 用 create_time，场景2 用 interaction_time"
      behavior_month: "行为月份 = 行为时间的月份部分；场景1/3 由 create_time 取月份，场景2 由 interaction_time 取月份"
      behavior_quarter: "行为季度 = 行为时间的季度部分；场景1/3 由 create_time 取季度，场景2 由 interaction_time 取季度"
      behavior_year: "行为年份 = 行为时间的年份部分；场景1/3 由 create_time 取年份，场景2 由 interaction_time 取年份"
      is_weekend: "是否周末：行为时间的星期为 1（周日）或 7（周六）时取 1，否则取 0；场景1/3 用 create_time 判断，场景2 用 interaction_time 判断"
      time_period: "时间段映射：行为时间的小时 0-5 凌晨 / 6-11 上午 / 12-13 中午 / 14-17 下午 / 其他 晚上；场景1/3 用 create_time，场景2 用 interaction_time"

      # === order_* 加工类（场景1）===
      order_order_status_name: "订单状态映射：PENDING→待支付，PAID→已支付，SHIPPED→已发货，COMPLETED→已完成，CANCELLED→已取消，其他→未知"

      # === prod_* 加工类（场景1）===
      prod_profit_rate: "利润率：当价格大于 0 时为 (价格 - 成本价) / 价格 × 100，否则为 0"

      # === content_* 加工类（场景2）===
      content_interaction_type_name: "互动类型映射：VIEW→浏览，LIKE→点赞，COMMENT→评论，SHARE→分享，COLLECT→收藏，其他→其他"
      content_duration_minutes: "浏览时长（分）= 浏览时长（秒）除以 60"
      content_comment_word_count: "评论字数 = 评论内容的字符长度"
      content_publish_date: "发布日期 = 取发布时间的日期部分"

      # === social_* 加工类（场景3）===
      social_relation_type_name: "关系类型映射：FOLLOW→关注，FRIEND→好友，BLOCK→屏蔽，BLACKLIST→黑名单，其他→其他"

    # 该规则关联的全部源表别名
    source_aliases:
      - oom      # 场景1 主表 ods_order_main_f
      - dpd      # 场景1 维表 dim_product_d
      - dub      # 场景1 维表 dim_user_base_d
      - oci      # 场景2 主表 ods_content_interaction_f
      - dcd      # 场景2 维表 dim_content_d
      - dub7     # 场景2 维表 dim_user_base_d
      - osr      # 场景3 主表 ods_social_relation_f
      - dup      # 场景3 维表 dim_user_profile_d
      - dub10    # 场景3 维表 dim_user_base_d

    ctes: []

    # 粒度变化（输入→输出）
    grain:
      input: "每个 ODS 主表（oom/oci/osr）一行 = 一个用户行为事件"
      output: "每行 = 一个用户行为记录"
      change: "无变化（三场景 UNION ALL 合并，行级追加，无聚合无展开）"

    # 关联策略（3 组并联 JOIN 子图）
    joins:
      # 场景1-电商交易
      - alias: "oom"
        type: "main"
        condition: "场景1 主表 ods_order_main_f"
        filter: ""
      - alias: "dpd"
        type: "LEFT JOIN"
        condition: "oom.product_id = dpd.product_id"
        filter: ""
      - alias: "dub"
        type: "LEFT JOIN"
        condition: "oom.user_id = dub.user_id"
        filter: ""
      # 场景2-内容互动
      - alias: "oci"
        type: "main"
        condition: "场景2 主表 ods_content_interaction_f"
        filter: ""
      - alias: "dcd"
        type: "LEFT JOIN"
        condition: "oci.content_id = dcd.content_id"
        filter: ""
      - alias: "dub7"
        type: "LEFT JOIN"
        condition: "oci.user_id = dub7.user_id"
        filter: ""
      # 场景3-社交关系
      - alias: "osr"
        type: "main"
        condition: "场景3 主表 ods_social_relation_f"
        filter: ""
      - alias: "dup"
        type: "LEFT JOIN"
        condition: "osr.user_id = dup.user_id"
        filter: ""
      - alias: "dub10"
        type: "LEFT JOIN"
        condition: "osr.user_id = dub10.user_id"
        filter: ""

    # 关联安全分析（所有被关联表均为维度表，按主键关联默认唯一）
    join_safety:
      - table: "dim_user_base_d (dub / dub7 / dub10)"
        join_key_unique: true
        strategy: "维度表按 user_id 主键关联，默认唯一"
        reason: "用户基础维度表按 user_id 唯一；三个场景分别以 dub/dub7/dub10 关联，均安全"
      - table: "dim_product_d (dpd)"
        join_key_unique: true
        strategy: "维度表按 product_id 主键关联，默认唯一"
        reason: "商品维度表按 product_id 唯一"
      - table: "dim_content_d (dcd)"
        join_key_unique: true
        strategy: "维度表按 content_id 主键关联，默认唯一"
        reason: "内容维度表按 content_id 唯一"
      - table: "dim_user_profile_d (dup)"
        join_key_unique: true
        strategy: "维度表按 user_id 主键关联，默认唯一"
        reason: "用户画像维度表按 user_id 唯一"

# === 复杂度分析与分段决策 ===
complexity_analysis:
  join_count: 9                          # 三场景各 3 表（1 主表 + 2 维表）= 9
  has_grain_change: false                # 粒度不变，仅 UNION ALL 合并
  grain_change_detail: "三场景输入/输出均为'每行=一个用户行为记录'，UNION ALL 行级追加，无聚合无展开"
  multi_step_fields: 0                   # 加工字段均为单步加工，无多步依赖
  aggregation_after_join: false          # JOIN 后无聚合
  segmentation_decision: "不分段"
  segmentation_reason: "三场景分支结构清晰、无聚合无粒度变化、JOIN 数 9 < 阈值 12，单条 UNION ALL INSERT 即可完成，无需中间表"

# === 分布键（高基数 JOIN 字段，参考 design-guide.md §2.1）===
# behavior_id 为 bigint，三场景各自唯一、合并后全局唯一，是本表最高基数字段
distribution_key:
  - behavior_id

# === 业务主键（业务唯一字段组合，供 UT 主键唯一检查）===
business_key:
  - behavior_id

# === 调度细化 ===
schedule:
  task_name: "slord_dwb_user_behavior_f"
  cron: "0 30 3 * * ?"                   # SLA 3:30 → 凌晨 3:30 触发（T+1 全量调度）
  task_group: ""
  project: ""
  upstream_added: []                     # 无中间表，未新增上游依赖

# === 数据流（规则间关系）===
data_flow:
  dependencies: []                       # 单规则，无规则间依赖
  schedule_groups:
    - sequence: 1
      rules: ["R0001"]

# === DQ（rs_input.dq_requirements 为空，本表非必须）===
dq_rules: []
