# ============================================================================
# design_decisions.yaml - 设计决策（designer agent 产出）
# ----------------------------------------------------------------------------
# 资产：slscc.dwb_supply_chain_center_f（供应链中心宽表）
# 决策：不分段，单规则 R0001，内联 CTE 覆盖全部加工。
# ============================================================================

# === 规则拆分（核心判断）===
rules:
  - rule_code: R0001
    rule_name: "供应链中心宽表主加工"
    scenario: "default"
    exec_sequence: 1
    target_table: "dwb_supply_chain_center_f"
    is_view_step: false
    design_intent: "以采购事实表为主表，左关联供应商/商品/仓库维度及库存事实表，加工状态/等级/类型映射与金额/周转天数，产出供应链中心宽表 F 表"

    # 该规则覆盖 rs_input 全部 23 个 target_column（19 业务 + 4 审计）
    field_targets:
      - purchase_id
      - purchase_no
      - purchase_status_name
      - create_time
      - supplier_id
      - supplier_name
      - supplier_level_name
      - cooperation_years
      - product_id
      - product_name
      - purchase_qty
      - purchase_price
      - purchase_amount
      - warehouse_id
      - warehouse_name
      - warehouse_type_name
      - current_stock_qty
      - locked_qty
      - stock_days
      - del_flag
      - crt_cycle_id
      - last_upd_cycle_id
      - dw_last_update_date

    # 仅加工类业务字段写 design_logic（自然语言口径，不含 SQL）
    # 直取字段（直接复制）不写；审计字段不写（assemble 自动处理）
    field_logics:
      purchase_status_name: "采购状态码转中文：DRAFT→草稿、SUBMITTED→已提交、APPROVED→已审批、RECEIVED→已入库、CLOSED→已关闭，其余归'其他'（源字段 dpf.purchase_status）"
      supplier_level_name: "供应商等级码转中文：A→A级供应商、B→B级供应商、C→C级供应商，其余归'其他'（源字段 dsf.supplier_level）"
      purchase_amount: "采购金额 = 采购数量 × 采购单价（dpf.purchase_qty × dpf.purchase_price）"
      warehouse_type_name: "仓库类型码转中文：SELF→自营仓、THIRD_PARTY→第三方仓，其余归'其他'（源字段 dwf.warehouse_type）"
      stock_days: "【多步骤·待补源】第一步：统计商品近30天销量（需销量/销售事实表，当前 rs_input 未提供，列为上游缺口）；第二步：库存可售天数 = 当前库存 ÷ 近30天日均销量。⚠️ 该字段依赖的销量源表不在 source_tables 中，coder 编码前需补全上游销量表，否则该字段无法落地"

    # 该规则关联的源表（canonical 别名）
    source_aliases:
      - dpf
      - dsf
      - dpf4
      - dwf
      - dif

    # CTE（内联临时表）
    # stock_days 的"近30天销量聚合"逻辑上需 CTE，但因销量源缺失暂列为缺口，
    # coder 补全上游后应以内联 CTE（按 product_id 聚合近30天销量）实现，
    # 此处不固化 CTE 骨架，待上游确定后由 coder 在编码阶段补齐。
    ctes: []

    # 粒度变化（输入→输出）
    grain:
      input: "一行=一条采购记录(dwd_purchase_f 按 purchase_id)"
      output: "一行=一条供应链中心记录(按 purchase_id)"
      change: "无变化"

    # 关联策略（统一使用 canonical 别名）
    joins:
      - alias: "dpf"
        type: "main"
        condition: "主表（采购事实表）"
        filter: "全量无过滤"
      - alias: "dsf"
        type: "LEFT JOIN"
        condition: "dpf.supplier_id = dsf.supplier_id"
        filter: ""
      - alias: "dpf4"
        type: "LEFT JOIN"
        condition: "dpf.product_id = dpf4.product_id"
        filter: ""
      - alias: "dwf"
        type: "LEFT JOIN"
        condition: "dpf.warehouse_id = dwf.warehouse_id"
        filter: ""
      - alias: "dif"
        type: "LEFT JOIN"
        condition: "dpf.product_id = dif.product_id AND dpf.warehouse_id = dif.warehouse_id"
        filter: ""

    # 关联安全分析（JOIN键唯一性 → 对齐策略）
    join_safety:
      - table: "dpf"
        join_key_unique: true
        strategy: ""
        reason: "主表，JOIN键 purchase_id 为主键，唯一"
      - table: "dsf"
        join_key_unique: true
        strategy: ""
        reason: "维度表按 supplier_id 唯一（一供应商一行）"
      - table: "dpf4"
        join_key_unique: true
        strategy: ""
        reason: "维度表按 product_id 唯一（一商品一行）"
      - table: "dwf"
        join_key_unique: true
        strategy: ""
        reason: "维度表按 warehouse_id 唯一（一仓库一行）"
      - table: "dif"
        join_key_unique: false
        strategy: "GROUP BY (product_id, warehouse_id) 收敛，取当前有效库存行"
        reason: "库存事实表可能存在多条记录，需按 product_id+warehouse_id 收敛避免主表放大"

# === 复杂度分析与分段决策 ===
complexity_analysis:
  join_count: 4
  has_grain_change: false
  grain_change_detail: "无（输出粒度=采购记录，与主表一致）"
  multi_step_fields: 1
  aggregation_after_join: true
  segmentation_decision: "不分段"
  segmentation_reason: "JOIN 表数 4(<12)、多步骤加工字段 1(<5)、表级粒度无变化；单条 INSERT + 内联 CTE 即可覆盖，无需物理中间表"

# === 分布键（事实表业务主键，高基数，避免倾斜）===
distribution_key:
  - purchase_id

# === 业务主键（业务唯一字段）===
business_key:
  - purchase_id

# === 调度细化（RS给大框架 → designer细化）===
schedule:
  task_name: "dw_slscc_dwb_supply_chain_center_f"
  cron: "0 30 3 * * ?"
  task_group: ""
  project: ""
  # 设计新增的上游依赖（stock_days 缺口）
  upstream_added:
    - table: "<待补·商品销量事实表>"
      task: "待需求方提供近30天销量源"

# === 数据流（规则间关系）===
data_flow:
  dependencies: []
  schedule_groups:
    - sequence: 1
      rules: ["R0001"]

# === DQ（rs_input 未给 DQ 要求）===
dq_rules: []
