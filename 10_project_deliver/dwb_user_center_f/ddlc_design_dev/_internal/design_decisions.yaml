# ============================================================================
# design_decisions.yaml - dwb_user_center_f (用户中心宽表)
# ----------------------------------------------------------------------------
# 复杂度驱动分段：5 个事实表需先按 user_id 聚合后才能关联用户维度，
# 且 RFM 评分需在全量用户上做窗口函数 → 拆 3 个物理中间表 + 1 个装配规则。
#
# 字段分配总览（46 字段 = 42 业务 + 4 审计）：
#   R0001 tmp_base      20 字段（用户基础属性 + 维度关联）
#   R0002 tmp_order_agg  4 字段（订单聚合指标）
#   R0003 tmp_behavior   3 字段（行为聚合指标）
#   R0004 F 表最终装配  19 字段（衍生指标 + CTE 聚合 + 审计）
# ============================================================================

rules:
  # ==========================================================================
  # R0001 - 用户基础属性中间表
  # ==========================================================================
  - rule_code: R0001
    rule_name: "用户基础属性中间表"
    scenario: "default"
    exec_sequence: 1
    target_table: "dwb_user_center_tmp1"
    is_view_step: false
    design_intent: "以 dim_user_f 为主表，LEFT JOIN 等级/地区/来源维度，产出用户基础属性宽表，供最终装配规则引用。粒度不变（一行一用户）。"
    load_mode: "truncate_table"

    field_targets:
      - user_id
      - user_name
      - user_phone_masked
      - gender_name
      - birthday
      - age
      - register_time
      - register_days
      - last_login_time
      - level_id
      - level_name
      - level_min_points
      - province_code
      - province_name
      - city_code
      - city_name
      - source_name
      - member_points
      - member_balance
      - user_status_name

    field_logics:
      user_phone_masked: "手机号脱敏：取前3位拼接'****'再拼接后4位"
      gender_name: "性别代码转中文：M→男，F→女，其余→未知"
      age: "年龄：当前年份减去出生年份（YEAR(CURDATE()) - YEAR(birthday)）"
      register_days: "注册天数：当前日期减去注册日期的天数差"
      city_name: "通过 city_code 二次关联 dim_region_f 获取城市名称（省份已通过 province_code 关联，城市需用 city_code 再 JOIN 一次 dim_region_f）"
      user_status_name: "用户状态代码转中文：ACTIVE→正常，INACTIVE→未激活，FROZEN→冻结，其余→其他"

    source_aliases: ["duf", "dul", "drf", "dus"]

    ctes: []

    grain:
      input: "一行=一个用户（dim_user_f 主表）"
      output: "一行=一个用户"
      change: "无变化（维度 LEFT JOIN 不改变粒度）"

    joins:
      - alias: "duf"
        type: "main"
        condition: ""
        filter: ""
      - alias: "dul"
        type: "LEFT JOIN"
        condition: "duf.level_id = dul.level_id"
        filter: ""
      - alias: "drf"
        type: "LEFT JOIN"
        condition: "duf.province_code = drf.region_code"
        filter: ""
      - alias: "drf_city"
        type: "LEFT JOIN"
        condition: "duf.city_code = drf_city.region_code"
        filter: "第二次关联 dim_region_f（同表不同别名），用于取城市名称"
      - alias: "dus"
        type: "LEFT JOIN"
        condition: "duf.source_id = dus.source_id"
        filter: ""

    join_safety:
      - table: "dim_user_level_f"
        join_key_unique: true
        strategy: ""
        reason: "等级维度表 level_id 唯一，LEFT JOIN 不会发散"
      - table: "dim_region_f (province)"
        join_key_unique: true
        strategy: ""
        reason: "地区维度表 region_code 唯一，按 province_code 关联不会发散"
      - table: "dim_region_f (city)"
        join_key_unique: true
        strategy: ""
        reason: "地区维度表 region_code 唯一，按 city_code 关联不会发散"
      - table: "dim_user_source_f"
        join_key_unique: true
        strategy: ""
        reason: "来源维度表 source_id 唯一，LEFT JOIN 不会发散"

  # ==========================================================================
  # R0002 - 订单汇总中间表
  # ==========================================================================
  - rule_code: R0002
    rule_name: "订单汇总中间表"
    scenario: "default"
    exec_sequence: 1
    target_table: "dwb_user_center_tmp2"
    is_view_step: false
    design_intent: "对 dwd_order_f 排除作废/删除订单后按 user_id 聚合，产出用户级订单汇总指标，供最终装配规则引用。粒度从订单明细收敛到用户。"
    load_mode: "truncate_table"

    field_targets:
      - total_order_cnt
      - total_pay_amount
      - last_order_time
      - first_order_time

    field_logics:
      total_order_cnt: "排除 CANCELLED/DELETED 状态订单后，按 user_id 统计历史订单数 COUNT(*)"
      total_pay_amount: "排除 CANCELLED/DELETED 状态订单后，按 user_id 汇总支付金额 SUM(pay_amount)"
      last_order_time: "排除 CANCELLED/DELETED 状态订单后，按 user_id 取最大下单时间 MAX(create_time)"
      first_order_time: "排除 CANCELLED/DELETED 状态订单后，按 user_id 取最小下单时间 MIN(create_time)"

    source_aliases: ["dof"]

    ctes: []

    grain:
      input: "一行=一个订单（dwd_order_f，排除作废/删除）"
      output: "一行=一个用户"
      change: "多行聚合（GROUP BY user_id）"

    joins:
      - alias: "dof"
        type: "main"
        condition: ""
        filter: "order_status NOT IN ('CANCELLED','DELETED')"

    join_safety:
      - table: "dwd_order_f"
        join_key_unique: true
        strategy: "GROUP BY user_id 收敛"
        reason: "事实表多行明细，GROUP BY user_id 聚合后 user_id 唯一"

  # ==========================================================================
  # R0003 - 行为汇总中间表
  # ==========================================================================
  - rule_code: R0003
    rule_name: "行为汇总中间表"
    scenario: "default"
    exec_sequence: 1
    target_table: "dwb_user_center_tmp3"
    is_view_step: false
    design_intent: "对 dwd_user_behavior_f 按 user_id 聚合浏览/收藏/加购行为指标，供最终装配规则引用。粒度从行为明细收敛到用户。"
    load_mode: "truncate_table"

    field_targets:
      - total_pv_cnt
      - total_collect_cnt
      - total_cart_cnt

    field_logics:
      total_pv_cnt: "按 user_id 汇总浏览次数 SUM(pv_cnt)"
      total_collect_cnt: "按 user_id 汇总收藏次数 SUM(collect_cnt)"
      total_cart_cnt: "按 user_id 汇总加购行为次数 SUM(cart_cnt)"

    source_aliases: ["dub"]

    ctes: []

    grain:
      input: "一行=一条用户行为记录（dwd_user_behavior_f）"
      output: "一行=一个用户"
      change: "多行聚合（GROUP BY user_id）"

    joins:
      - alias: "dub"
        type: "main"
        condition: ""
        filter: ""

    join_safety:
      - table: "dwd_user_behavior_f"
        join_key_unique: true
        strategy: "GROUP BY user_id 收敛"
        reason: "行为事实表多行明细，GROUP BY user_id 聚合后 user_id 唯一"

  # ==========================================================================
  # R0004 - 最终目标 F 表装配
  # ==========================================================================
  - rule_code: R0004
    rule_name: "用户中心宽表最终装配"
    scenario: "default"
    exec_sequence: 2
    target_table: "dwb_user_center_f"
    is_view_step: false
    design_intent: "以 tmp1（用户基础）为主表，LEFT JOIN tmp2（订单）/tmp3（行为）中间表，并通过 CTE 内联聚合优惠券/退款/购物车事实表，计算 RFM 评分、转化率、价值分层等衍生字段，产出最终宽表。"
    load_mode: "truncate_table"

    field_targets:
      - avg_order_amount
      - rfm_r_score
      - rfm_f_score
      - rfm_m_score
      - rfm_segment
      - pv_to_order_rate
      - pv_to_cart_rate
      - coupon_used_cnt
      - coupon_total_amount
      - refund_cnt
      - refund_rate
      - cart_product_cnt
      - cart_total_amount
      - order_freq_label
      - consume_level_label
      - del_flag
      - crt_cycle_id
      - last_upd_cycle_id
      - dw_last_update_date

    field_logics:
      avg_order_amount: "平均客单价：历史消费金额 / 历史订单数，分母为 0 或 NULL 时返回 NULL（NULLIF 防除零）"
      coupon_used_cnt: "按 user_id 统计优惠券使用次数 COUNT(*)，来自 CTE 聚合 dwd_coupon_use_f"
      coupon_total_amount: "按 user_id 汇总优惠券使用金额 SUM(coupon_amount)，来自 CTE 聚合 dwd_coupon_use_f"
      refund_cnt: "按 user_id 统计退款次数 COUNT(*)，来自 CTE 聚合 dwd_refund_f"
      refund_rate: "退款率(%)：退款次数 / 历史订单数 * 100，分母为 0 或 NULL 时返回 NULL"
      cart_product_cnt: "有效购物车商品(del_flag='N')按 user_id 统计商品数 COUNT(*)，来自 CTE 聚合 dwd_cart_f"
      cart_total_amount: "有效购物车商品(del_flag='N')按 user_id 汇总金额 SUM(qty*price)，来自 CTE 聚合 dwd_cart_f"
      rfm_r_score: "R 值：计算最近下单距今天数 DATEDIFF(CURDATE(), last_order_time) 后，全量用户 NTILE(5) 窗口分组打分（天数越小分越高）。无订单用户 last_order_time 为 NULL，R 值记 NULL 或最低分"
      rfm_f_score: "F 值：基于历史订单数 total_order_cnt，全量用户 NTILE(5) 窗口分组打分（订单越多分越高）。无订单用户记最低分"
      rfm_m_score: "M 值：基于历史消费金额 total_pay_amount，全量用户 NTILE(5) 窗口分组打分（金额越高分越高）。无消费用户记最低分"
      rfm_segment: "用户价值分层：组合 R/F/M 三分值，按规则划分高价值/中价值/低价值/流失四档"
      pv_to_order_rate: "浏览-下单转化率(%)：历史订单数 / 浏览次数 * 100，分母为 0 或 NULL 时返回 NULL"
      pv_to_cart_rate: "浏览-加购转化率(%)：加购行为次数(来自行为表 total_cart_cnt) / 浏览次数 * 100，分母为 0 或 NULL 时返回 NULL"
      order_freq_label: "下单频率标签：total_order_cnt >= 10→高频用户，>= 3→中频用户，>= 1→低频用户，其余→未购买"
      consume_level_label: "消费能力标签：total_pay_amount >= 10000→高消费，>= 1000→中消费，>= 100→低消费，其余→无消费"

    source_aliases: ["dcu", "drf7", "dcf"]

    ctes:
      - name: "coupon_agg"
        purpose: "按 user_id 聚合优惠券使用次数和金额"
        source_tables: ["dwd_coupon_use_f"]
      - name: "refund_agg"
        purpose: "按 user_id 聚合退款次数"
        source_tables: ["dwd_refund_f"]
      - name: "cart_agg"
        purpose: "按 user_id 聚合有效购物车商品数和金额(del_flag='N')"
        source_tables: ["dwd_cart_f"]

    grain:
      input: "一行=一个用户（来自 tmp1 主表 + tmp2/tmp3/CTE 聚合结果 LEFT JOIN）"
      output: "一行=一个用户"
      change: "无变化（用户粒度对齐后 LEFT JOIN，各聚合结果 user_id 唯一）"

    joins:
      - alias: "tmp1"
        type: "main"
        condition: ""
        filter: ""
      - alias: "tmp2"
        type: "LEFT JOIN"
        condition: "tmp1.user_id = tmp2.user_id"
        filter: ""
      - alias: "tmp3"
        type: "LEFT JOIN"
        condition: "tmp1.user_id = tmp3.user_id"
        filter: ""
      - alias: "coupon_agg"
        type: "LEFT JOIN"
        condition: "tmp1.user_id = coupon_agg.user_id"
        filter: ""
      - alias: "refund_agg"
        type: "LEFT JOIN"
        condition: "tmp1.user_id = refund_agg.user_id"
        filter: ""
      - alias: "cart_agg"
        type: "LEFT JOIN"
        condition: "tmp1.user_id = cart_agg.user_id"
        filter: ""

    join_safety:
      - table: "tmp2 (订单汇总)"
        join_key_unique: true
        strategy: ""
        reason: "R0002 已 GROUP BY user_id 聚合，user_id 唯一"
      - table: "tmp3 (行为汇总)"
        join_key_unique: true
        strategy: ""
        reason: "R0003 已 GROUP BY user_id 聚合，user_id 唯一"
      - table: "coupon_agg (CTE)"
        join_key_unique: true
        strategy: ""
        reason: "CTE 内 GROUP BY user_id 聚合，user_id 唯一"
      - table: "refund_agg (CTE)"
        join_key_unique: true
        strategy: ""
        reason: "CTE 内 GROUP BY user_id 聚合，user_id 唯一"
      - table: "cart_agg (CTE)"
        join_key_unique: true
        strategy: ""
        reason: "CTE 内 GROUP BY user_id 聚合，user_id 唯一"

# === 复杂度分析与分段决策 ===
complexity_analysis:
  join_count: 6                         # R0004 最多：tmp1 主表 + 5 个 LEFT JOIN
  has_grain_change: true                # 5 个事实表从明细聚合到用户粒度
  grain_change_detail: "dwd_order_f / dwd_user_behavior_f / dwd_coupon_use_f / dwd_refund_f / dwd_cart_f 五个事实表从多行明细聚合到一行一用户粒度"
  multi_step_fields: 16                 # 需先聚合再关联的多步骤加工字段
  aggregation_after_join: true          # RFM NTILE(5) 窗口函数需在全量用户 JOIN 后执行
  segmentation_decision: "分段"
  segmentation_reason: "5 个事实表需先按 user_id GROUP BY 聚合后才能关联用户维度（直接 JOIN 会导致笛卡尔发散）；16 个多步骤加工字段远超阈值 5；RFM 评分需在全量用户上做 NTILE(5) 窗口函数。拆 3 个物理中间表（tmp1 基础属性 / tmp2 订单汇总 / tmp3 行为汇总）+ 1 个最终装配规则（优惠券/退款/购物车用 CTE 内联）。"

# === 分布键 ===
distribution_key: ["user_id"]

# === 业务主键 ===
business_key: ["user_id"]

business_key_design:
  input_key: ["user_id"]                # rs_input 备注"主键"
  adjusted: false                       # 用户粒度下 user_id 唯一，无需调整
  reason: ""

# === 调度细化 ===
schedule:
  task_name: "dw_slusr_dwb_user_center_f"
  cron: "0 0 2 * * ?"                   # 每天凌晨 2:00 执行，预留 1.5h 到 SLA 3:30
  task_group: "dw_slusr_user_center"
  project: "slusr"
  upstream_added: []                    # 中间表为内部依赖，不引入新外部上游

# === 数据流 ===
data_flow:
  dependencies:
    - from: "R0001"
      to: "R0004"
      type: "data_flow"
      intermediate_table: "dwb_user_center_tmp1"
    - from: "R0002"
      to: "R0004"
      type: "data_flow"
      intermediate_table: "dwb_user_center_tmp2"
    - from: "R0003"
      to: "R0004"
      type: "data_flow"
      intermediate_table: "dwb_user_center_tmp3"
  schedule_groups:
    - sequence: 1                       # 基础属性 + 订单聚合 + 行为聚合 可并行
      rules: ["R0001", "R0002", "R0003"]
    - sequence: 2                       # 最终装配依赖上述全部
      rules: ["R0004"]

# === DQ ===
dq_rules: []
