# ============================================================================
# design_decisions.yaml - dwb_order_center_f 订单中心宽表
# ----------------------------------------------------------------------------
# 复杂度：19张源表JOIN、17个多步骤聚合字段、跨3种粒度（用户/商品/店铺）
# 分段决策：分段。建2张物理中间表收口用户画像和商品画像聚合数据。
# ============================================================================

params: []

# === 规则拆分 ===
rules:
  # ------------------------------------------------------------------
  # R0001: 用户画像汇总中间表
  # 粒度变化：订单/支付/优惠券/退款记录 → 用户级（GROUP BY user_id）
  # 收口所有用户级聚合指标，避免主表装配时反复聚合导致粒度发散
  # ------------------------------------------------------------------
  - rule_code: R0001
    rule_name: "用户画像汇总"
    scenario: "default"
    exec_sequence: 1
    target_table: "slord.dwb_order_center_tmp1"
    is_view_step: false
    design_intent: "将订单、支付、优惠券、退款四类事实表按 user_id 聚合，产出用户级画像指标（首次/最近下单、历史消费、RFM分层、复购、偏好），避免主装配阶段聚合导致粒度发散"
    load_mode: "truncate_table"

    field_targets:
      - first_order_time
      - last_order_time
      - history_order_cnt
      - history_pay_amount
      - history_discount_amount
      - avg_order_amount
      - rfm_segment
      - is_repeat_user
      - fav_pay_method
      - user_coupon_used_cnt
      - user_fav_activity_type
      - user_refund_cnt

    field_logics:
      first_order_time: "从 dwd_order_f 按 user_id 分组，取 MIN(create_time) 作为首次下单时间"
      last_order_time: "从 dwd_order_f 按 user_id 分组，取 MAX(create_time) 作为最近下单时间"
      history_order_cnt: "从 dwd_order_f 按 user_id 分组，COUNT(*) 统计历史订单总数"
      history_pay_amount: "从 dwd_order_f 按 user_id 分组，SUM(pay_amount) 汇总历史实付金额"
      history_discount_amount: "从 dwd_order_f 按 user_id 分组，SUM(discount_amount) 汇总历史优惠金额"
      avg_order_amount: "历史消费金额 / 历史订单数，计算平均客单价"
      rfm_segment: "根据最近下单时间计算R值(1-5分)、历史订单数计算F值(1-5分)、历史消费金额计算M值(1-5分)，三分量组合输出RFM分层标签"
      is_repeat_user: "历史订单数 >= 2 则为复购用户(Y)，否则非复购(N)"
      fav_pay_method: "从 dwd_payment_f 按 user_id 分组，取 COUNT 最多的 pay_method 作为用户常用支付方式"
      user_coupon_used_cnt: "从 dwd_coupon_use_f 按 user_id 分组，COUNT(DISTINCT coupon_id) 统计用户使用优惠券次数"
      user_fav_activity_type: "从 dwd_order_f 按 user_id 关联活动维表，取参与订单数最多的活动类型作为偏好活动类型"
      user_refund_cnt: "从 dwd_refund_f 按 user_id 分组，COUNT(*) 统计历史退款成功次数"

    source_aliases:
      - dof
      - dpf
      - dcu
      - drf17

    ctes:
      - name: "cte_order_stats"
        purpose: "从 dwd_order_f 按 user_id 聚合订单统计（首次/最近下单时间、订单数、消费/优惠金额汇总）"
        source_tables: ["dwd_order_f"]
      - name: "cte_pay_pref"
        purpose: "从 dwd_payment_f 按 user_id 聚合，取使用最多的 pay_method"
        source_tables: ["dwd_payment_f"]
      - name: "cte_coupon_stats"
        purpose: "从 dwd_coupon_use_f 按 user_id 聚合优惠券使用次数"
        source_tables: ["dwd_coupon_use_f"]
      - name: "cte_refund_stats"
        purpose: "从 dwd_refund_f 按 user_id 聚合退款次数"
        source_tables: ["dwd_refund_f"]

    grain:
      input: "一行=一条订单/支付/优惠券/退款记录"
      output: "一行=一个用户"
      change: "多行聚合"

    joins:
      - alias: "dof"
        type: "main"
        condition: ""
        filter: "order_status NOT IN ('CANCELLED', 'DELETED')"
      - alias: "dpf"
        type: "LEFT JOIN"
        condition: "dof.user_id = dpf.user_id"
        filter: "pay_status='SUCCESS'"
      - alias: "dcu"
        type: "LEFT JOIN"
        condition: "dof.user_id = dcu.user_id"
        filter: "use_status='USED'"
      - alias: "drf17"
        type: "LEFT JOIN"
        condition: "dof.user_id = drf17.user_id"
        filter: "refund_status='SUCCESS'"

    join_safety:
      - table: "dwd_order_f"
        join_key_unique: true
        strategy: ""
        reason: "按 user_id GROUP BY 聚合，天然收敛到用户粒度"
      - table: "dwd_payment_f"
        join_key_unique: true
        strategy: ""
        reason: "按 user_id GROUP BY 聚合取众数，收敛到用户粒度"
      - table: "dwd_coupon_use_f"
        join_key_unique: true
        strategy: ""
        reason: "按 user_id GROUP BY COUNT，收敛到用户粒度"
      - table: "dwd_refund_f"
        join_key_unique: true
        strategy: ""
        reason: "按 user_id GROUP BY COUNT，收敛到用户粒度"

  # ------------------------------------------------------------------
  # R0002: 商品画像汇总中间表
  # 粒度变化：订单商品明细 → 商品级（GROUP BY product_id）
  # ------------------------------------------------------------------
  - rule_code: R0002
    rule_name: "商品画像汇总"
    scenario: "default"
    exec_sequence: 2
    target_table: "slord.dwb_order_center_tmp2"
    is_view_step: false
    design_intent: "将订单商品明细按 product_id 聚合，产出商品累计销量和销售额，供主表装配时 LEFT JOIN"
    load_mode: "truncate_table"

    field_targets:
      - product_sales_cnt
      - product_sales_amount

    field_logics:
      product_sales_cnt: "从 dwd_order_detail_f 按 product_id 分组，SUM(qty) 统计商品累计销量"
      product_sales_amount: "从 dwd_order_detail_f 按 product_id 分组，SUM(real_price * qty) 统计商品累计销售额"

    source_aliases:
      - dod

    ctes: []

    grain:
      input: "一行=一条订单商品明细"
      output: "一行=一个商品"
      change: "多行聚合"

    joins:
      - alias: "dod"
        type: "main"
        condition: ""
        filter: "del_flag='N'"

    join_safety:
      - table: "dwd_order_detail_f"
        join_key_unique: true
        strategy: ""
        reason: "按 product_id GROUP BY 聚合，天然收敛到商品粒度"

  # ------------------------------------------------------------------
  # R0003: 订单中心宽表主装配
  # 粒度：一行=一个订单（无变化）
  # 主事实表 LEFT JOIN 所有维表 + 中间表 tmp1/tmp2
  # ------------------------------------------------------------------
  - rule_code: R0003
    rule_name: "订单中心宽表装配"
    scenario: "default"
    exec_sequence: 3
    target_table: "slord.dwb_order_center_f"
    is_view_step: false
    design_intent: "以 dwd_order_f 为驱动表，LEFT JOIN 订单明细/支付/物流/优惠券/退款事实表（各取一条有效记录）+ 全部维表 + tmp1用户画像 + tmp2商品画像，一次性装配宽表全部字段"
    load_mode: "truncate_table"

    field_targets:
      # --- 订单基本信息（dof）---
      - order_id
      - order_no
      - order_status
      - order_status_name
      - order_time
      - total_amount
      - product_amount
      - pay_amount
      - discount_amount
      - freight_amount
      - product_cnt
      - product_qty
      - order_source_name
      - order_type_name
      - order_remark
      - order_date
      - user_id
      # --- 用户维度（duf/dul）---
      - user_name
      - user_phone_masked
      - user_email_masked
      - gender_name
      - user_birthday
      - user_age
      - user_register_time
      - user_level_id
      - user_level_name
      - member_points
      - member_balance
      - user_tag
      - user_source_name
      - user_province_code
      - user_city_code
      - user_days
      # --- 商品维度（dod/dpf7/dpc/dbf）---
      - product_id
      - product_name
      - product_code
      - sku_code
      - category_l1_id
      - category_l1_name
      - category_l2_id
      - category_l2_name
      - category_l3_id
      - category_l3_name
      - brand_id
      - brand_name
      - brand_origin
      - product_attr
      - product_spec
      - product_weight
      - product_volume
      - cost_price
      - sale_price
      - real_price
      - product_tag
      - product_status_name
      - product_profit
      # --- 店铺维度（dsf/drf）---
      - shop_id
      - shop_name
      - shop_type_name
      - shop_level_name
      - shop_score
      - company_name
      - shop_province_code
      - shop_province_name
      - shop_city_code
      - shop_city_name
      - shop_open_time
      - shop_history_order_cnt
      # --- 收货信息（dof/drf）---
      - receiver_name
      - receiver_phone_masked
      - receiver_province_code
      - receiver_province_name
      - receiver_city_code
      - receiver_city_name
      - receiver_district_code
      - receiver_district_name
      - receiver_street
      - receiver_address
      - full_address
      - postal_code
      - address_tag_name
      - longitude
      - latitude
      # --- 支付信息（dpf/dpm）---
      - pay_time
      - pay_id
      - pay_no
      - pay_method_code
      - pay_method_name
      - pay_channel_name
      - pay_status_name
      - bank_card_masked
      - bank_name
      - installment_num
      - pay_service_fee
      - pay_duration_minutes
      # --- 物流信息（dlf/dlc/dwf）---
      - ship_time
      - receive_time
      - delivery_days
      - logistics_id
      - logistics_no
      - logistics_company_code
      - logistics_company_name
      - logistics_type_name
      - warehouse_id
      - warehouse_name
      - warehouse_address
      - logistics_status_name
      - pickup_time
      - sign_receiver_name
      - ship_duration_hours
      # --- 优惠券/活动（dcu/dcf/daf/dof）---
      - coupon_id
      - coupon_name
      - coupon_type_name
      - coupon_amount
      - activity_id
      - activity_name
      - activity_type_name
      - activity_discount_rate
      - full_reduce_amount
      - points_deduct_amount
      - points_used
      - is_marketing_order
      - total_discount_amount
      # --- 退款信息（drf17）---
      - refund_id
      - refund_no
      - refund_type_name
      - refund_reason
      - refund_amount
      - refund_status_name
      - refund_apply_time
      - refund_complete_time
      - is_refund_order
      # --- 审计字段 ---
      - del_flag
      - crt_cycle_id
      - last_upd_cycle_id
      - dw_last_update_date

    field_logics:
      order_status_name: "CASE 映射订单状态码为中文：PAID→已支付、SHIPPED→已发货、RECEIVED→已签收、CANCELLED→已取消，其余→其他"
      order_source_name: "CASE 映射订单来源码为中文：APP→APP端、WEB→网页端、MINIAPP→小程序、H5→H5页面，其余→其他"
      order_type_name: "CASE 映射订单类型码为中文：NORMAL→普通订单、PRESALE→预售订单、GROUPBUY→团购订单、SECKILL→秒杀订单，其余→其他"
      order_date: "DATE_FORMAT 取 create_time 的日期部分（YYYY-MM-DD）"
      user_phone_masked: "手机号脱敏：保留前3位和后4位，中间用****替代"
      user_email_masked: "邮箱脱敏：保留前2位和@后域名，中间用***替代"
      gender_name: "CASE 映射性别码为中文：M→男、F→女，其余→未知"
      user_age: "当前年份 YEAR(CURDATE()) 减去出生年份 YEAR(birthday)"
      user_source_name: "CASE 映射用户来源码为中文：NATURAL→自然流量、AD→广告投放、REFERRAL→推荐注册、ACTIVITY→活动引流，其余→其他"
      user_days: "DATEDIFF 计算当前日期 CURDATE() 与注册时间的天数差"
      category_l2_id: "商品维表 category_id 关联一级类目，再通过 parent_id 关联取二级类目ID"
      category_l2_name: "通过二级类目ID关联 dim_product_category_f 取 category_name"
      category_l3_id: "商品维表经二级类目，再通过 parent_id 关联取三级类目ID"
      category_l3_name: "通过三级类目ID关联 dim_product_category_f 取 category_name"
      product_status_name: "CASE 映射商品状态码为中文：ON_SHELF→上架、OFF_SHELF→下架、SOLD_OUT→售罄，其余→其他"
      product_profit: "商品售价 sale_price 减去成本价 cost_price"
      shop_type_name: "CASE 映射店铺类型码为中文：FLAGSHIP→旗舰店、SPECIALTY→专卖店、FRANCHISE→专营店、OFFICIAL→官方店，其余→其他"
      shop_level_name: "拼接 'Lv.' 前缀和店铺等级数字"
      shop_province_name: "店铺维表 province_code 关联 dim_region_f 取省份名称"
      shop_city_name: "店铺维表 city_code 关联 dim_region_f 取城市名称"
      shop_history_order_cnt: "从 dwd_order_f 按 shop_id 分组 COUNT(*) 统计店铺历史订单数（CTE内联聚合后关联）"
      receiver_phone_masked: "收货人手机号脱敏：保留前3位和后4位，中间用****替代"
      receiver_city_name: "订单 city_code 关联 dim_region_f 取城市名称"
      receiver_district_name: "订单 district_code 关联 dim_region_f 取区县名称"
      full_address: "拼接收货省份名称+城市名称+区县名称+街道+详细地址"
      address_tag_name: "CASE 映射地址标签码为中文：HOME→家、COMPANY→公司、SCHOOL→学校，其余→其他"
      pay_channel_name: "支付方式维表关联支付渠道表取 channel_name（复杂关联链）"
      pay_status_name: "CASE 映射支付状态码为中文：SUCCESS→支付成功、FAILED→支付失败、PENDING→支付中，其余→未知"
      bank_card_masked: "银行卡号脱敏：只保留后4位，前缀用****替代"
      pay_duration_minutes: "支付时间 pay_time 减去下单时间 order_time，换算为分钟"
      logistics_type_name: "物流公司维表关联物流类型维度取 type_name（复杂关联链）"
      warehouse_address: "仓库维表关联地区维表取仓库地址（复杂关联链）"
      logistics_status_name: "CASE 映射物流状态码为中文：PENDING→待发货、SHIPPED→已发货、IN_TRANSIT→运输中、DELIVERED→已签收，其余→其他"
      ship_duration_hours: "发货时间 ship_time 减去支付时间 pay_time，换算为小时"
      coupon_type_name: "CASE 映射优惠券类型码为中文：FULL_REDUCE→满减券、DISCOUNT→折扣券、CASH→现金券、FREIGHT→运费券，其余→其他"
      activity_type_name: "CASE 映射活动类型码为中文：SECKILL→秒杀活动、GROUPBUY→团购活动、PRESALE→预售活动、FULL_GIFT→满赠活动、FULL_REDUCE→满减活动，其余→其他"
      is_marketing_order: "判断是否存在优惠券ID或活动ID，有则为营销订单(Y)，否则非营销(N)"
      total_discount_amount: "优惠券金额 + 满减金额 + 积分抵扣金额汇总"
      refund_type_name: "CASE 映射退款类型码为中文：ONLY_REFUND→仅退款、RETURN_REFUND→退货退款、EXCHANGE→换货，其余→其他"
      refund_status_name: "CASE 映射退款状态码为中文：APPLYING→申请中、APPROVED→已同意、SUCCESS→退款成功、REJECTED→已拒绝，其余→其他"
      is_refund_order: "判断是否存在退款ID，有则为退款订单(Y)，否则非退款(N)"
      delivery_days: "DATEDIFF 签收时间 receive_time 减去发货时间 ship_time"

    source_aliases: []

    ctes:
      - name: "cte_shop_stats"
        purpose: "从 dwd_order_f 按 shop_id 分组 COUNT(*) 统计店铺历史订单数"
        source_tables: ["dwd_order_f"]
      - name: "cte_order_detail_latest"
        purpose: "对 dwd_order_detail_f 按 order_id 分组 ROW_NUMBER 取第一条商品（主商品），保证 JOIN 键唯一"
        source_tables: ["dwd_order_detail_f"]
      - name: "cte_payment_latest"
        purpose: "对 dwd_payment_f 按 order_id 分组 ROW_NUMBER 按 pay_time 降序取最新一条成功支付"
        source_tables: ["dwd_payment_f"]
      - name: "cte_logistics_latest"
        purpose: "对 dwd_logistics_f 按 order_id 分组 ROW_NUMBER 取最新一条物流记录"
        source_tables: ["dwd_logistics_f"]

    grain:
      input: "一行=一个订单"
      output: "一行=一个订单"
      change: "无变化"

    joins:
      - alias: "dof"
        type: "main"
        condition: ""
        filter: "order_status NOT IN ('CANCELLED', 'DELETED')"
      - alias: "dod"
        type: "LEFT JOIN"
        condition: "dof.order_id = dod.order_id"
        filter: "del_flag='N'"
      - alias: "dpf"
        type: "LEFT JOIN"
        condition: "dof.order_id = dpf.order_id"
        filter: "pay_status='SUCCESS'"
      - alias: "dlf"
        type: "LEFT JOIN"
        condition: "dof.order_id = dlf.order_id"
        filter: "del_flag='N'"
      - alias: "dcu"
        type: "LEFT JOIN"
        condition: "dof.order_id = dcu.order_id"
        filter: "use_status='USED'"
      - alias: "drf17"
        type: "LEFT JOIN"
        condition: "dof.order_id = drf17.order_id"
        filter: "refund_status='SUCCESS'"
      - alias: "duf"
        type: "LEFT JOIN"
        condition: "dof.user_id = duf.user_id"
        filter: ""
      - alias: "dul"
        type: "LEFT JOIN"
        condition: "duf.level_id = dul.level_id"
        filter: ""
      - alias: "dpf7"
        type: "LEFT JOIN"
        condition: "dod.product_id = dpf7.product_id"
        filter: ""
      - alias: "dpc"
        type: "LEFT JOIN"
        condition: "dpf7.category_id = dpc.category_id (一级), dpc.parent_id = dpc2.category_id (二级), dpc2.parent_id = dpc3.category_id (三级)"
        filter: ""
      - alias: "dbf"
        type: "LEFT JOIN"
        condition: "dpf7.brand_id = dbf.brand_id"
        filter: ""
      - alias: "dsf"
        type: "LEFT JOIN"
        condition: "dof.shop_id = dsf.shop_id"
        filter: ""
      - alias: "drf"
        type: "LEFT JOIN"
        condition: "多关联：dof.province_code=r1.region_code(省), dof.city_code=r2.region_code(市), dof.district_code=r3.region_code(区); dsf.province_code=r4.region_code(店铺省), dsf.city_code=r5.region_code(店铺市)"
        filter: ""
      - alias: "dwf"
        type: "LEFT JOIN"
        condition: "dlf.warehouse_id = dwf.warehouse_id"
        filter: ""
      - alias: "dpm"
        type: "LEFT JOIN"
        condition: "dpf.pay_method = dpm.method_code"
        filter: ""
      - alias: "dlc"
        type: "LEFT JOIN"
        condition: "dlf.logistics_company = dlc.company_code"
        filter: ""
      - alias: "dcf"
        type: "LEFT JOIN"
        condition: "dcu.coupon_id = dcf.coupon_id"
        filter: ""
      - alias: "daf"
        type: "LEFT JOIN"
        condition: "dof.activity_id = daf.activity_id"
        filter: ""
      - alias: "tmp1"
        type: "LEFT JOIN"
        condition: "dof.user_id = tmp1.user_id"
        filter: ""
      - alias: "tmp2"
        type: "LEFT JOIN"
        condition: "dod.product_id = tmp2.product_id"
        filter: ""

    join_safety:
      - table: "dwd_order_detail_f"
        join_key_unique: false
        strategy: "ROW_NUMBER() OVER(PARTITION BY order_id ORDER BY ... ) 取 rn=1，保证一个订单只取第一条商品"
        reason: "一个订单有多条商品明细，直接 JOIN 会发散粒度"
      - table: "dwd_payment_f"
        join_key_unique: false
        strategy: "ROW_NUMBER() OVER(PARTITION BY order_id ORDER BY pay_time DESC) 取 rn=1，取最新一条成功支付"
        reason: "一个订单可能有多笔支付记录（多次尝试/部分支付），直接 JOIN 会发散"
      - table: "dwd_logistics_f"
        join_key_unique: false
        strategy: "ROW_NUMBER() OVER(PARTITION BY order_id ORDER BY ship_time DESC) 取 rn=1，取最新物流"
        reason: "一个订单可能有多条物流记录（拆包发货），直接 JOIN 会发散"
      - table: "dwd_coupon_use_f"
        join_key_unique: false
        strategy: "ROW_NUMBER() OVER(PARTITION BY order_id ORDER BY ... ) 取 rn=1 或 GROUP BY 收敛"
        reason: "一个订单可能使用多张优惠券，直接 JOIN 会发散"
      - table: "dwd_refund_f"
        join_key_unique: false
        strategy: "ROW_NUMBER() OVER(PARTITION BY order_id ORDER BY complete_time DESC) 取 rn=1 或取最新退款"
        reason: "一个订单可能有多条退款记录，直接 JOIN 会发散"

# === 复杂度分析与分段决策 ===
complexity_analysis:
  join_count: 18
  has_grain_change: true
  grain_change_detail: "用户画像（tmp1）和商品画像（tmp2）在用户/商品粒度聚合后关联回订单粒度；店铺历史订单数在店铺粒度聚合后关联回订单粒度"
  multi_step_fields: 17
  aggregation_after_join: true
  segmentation_decision: "分段"
  segmentation_reason: "JOIN 表数18（超12阈值）、多步骤聚合字段17（超5阈值）、存在跨粒度聚合（用户/商品/店铺三种非订单粒度），需建2张物理中间表收口聚合逻辑，避免主装配阶段反复聚合导致粒度发散和SQL过于复杂"

