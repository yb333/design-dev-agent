# ============================================================================
# design_decisions.yaml - 订单中心宽表 (dwb_order_center_f) 设计决策
# ----------------------------------------------------------------------------
# 高复杂度宽表：18 个源表、150 个目标字段(90直取/56加工/4审计)、16 个多步骤加工字段。
# 按 design-guide §4 强制分段：3 个画像中间表收口聚合 + 最终 F 表关联拼接。
# 字段详情(类型/来源/注释)由 assemble_ts.py 从 rs_input.json 自动搬移。
# ============================================================================

rules:
  # ===================== R0001 用户画像中间表 =====================
  - rule_code: R0001
    rule_name: "用户画像中间表"
    scenario: "default"
    exec_sequence: 1
    target_table: "dwb_order_center_user_tmp1"
    is_view_step: false
    design_intent: "收口所有按 user_id 聚合的用户画像/历史指标(先聚合再关联)，输出用户粒度，避免直接关联订单发散订单粒度。"
    load_mode: "truncate_table"

    field_targets:
      - user_id
      - first_order_time
      - last_order_time
      - history_order_cnt
      - history_pay_amount
      - history_discount_amount
      - avg_order_amount
      - rfm_segment
      - is_repeat_user
      - fav_pay_method
      - user_coupon_used_cnt
      - user_fav_activity_type
      - user_refund_cnt

    field_logics:
      first_order_time: "用户首次下单时间：对 dwd_order_f 按 user_id 分组，取该用户最早的 create_time"
      last_order_time: "用户最近下单时间：对 dwd_order_f 按 user_id 分组，取该用户最新的 create_time"
      history_order_cnt: "用户历史订单总数：对 dwd_order_f 按 user_id 分组统计订单条数"
      history_pay_amount: "用户历史消费总额：对 dwd_order_f 按 user_id 分组，累加各订单 pay_amount"
      history_discount_amount: "用户历史优惠总额：对 dwd_order_f 按 user_id 分组，累加各订单 discount_amount"
      avg_order_amount: "用户平均客单价：历史消费金额 / 历史订单数，订单数为 0 时取 0"
      rfm_segment: "用户 RFM 分层：根据最近下单时间算 R 值(1-5 分)、历史订单数算 F 值、历史消费金额算 M 值，组合成 RFM 分层标签"
      is_repeat_user: "是否复购用户：历史订单数 ≥ 2 标记为 Y，否则 N"
      fav_pay_method: "用户常用支付方式：对 dwd_payment_f 按 user_id 分组取使用次数最多的 pay_method"
      user_coupon_used_cnt: "用户优惠券使用次数：对 dwd_coupon_use_f 按 user_id 分组，统计去重 coupon_id 的个数"
      user_fav_activity_type: "用户偏好活动类型：对 dwd_order_f 按 user_id 关联活动维表，取该用户参与订单数最多的活动类型"
      user_refund_cnt: "用户历史退款次数：对 dwd_refund_f(退款成功) 按 user_id 分组，统计退款笔数"

    source_aliases: ["dof", "dpf", "dcu", "drf17", "daf"]

    grain:
      input: "订单/支付/优惠券/退款/活动明细(多源，每源对同一用户多行)"
      output: "一行=一个用户"
      change: "多行聚合"

    joins:
      - alias: "dof"
        type: "main"
        condition: "按 user_id 分组的聚合基表"
        filter: "order_status NOT IN ('CANCELLED','DELETED')"
      - alias: "dpf"
        type: "LEFT JOIN"
        condition: "dof.user_id = dpf.user_id(聚合 fav_pay_method)"
        filter: ""
      - alias: "dcu"
        type: "LEFT JOIN"
        condition: "dof.user_id = dcu.user_id(聚合 user_coupon_used_cnt)"
        filter: "use_status='USED'"
      - alias: "drf17"
        type: "LEFT JOIN"
        condition: "dof.user_id = drf17.user_id(聚合 user_refund_cnt)"
        filter: "refund_status='SUCCESS'"
      - alias: "daf"
        type: "LEFT JOIN"
        condition: "dof.activity_id = daf.activity_id(取活动类型用于偏好统计)"
        filter: ""

    join_safety:
      - table: "dof"
        join_key_unique: true
        strategy: "GROUP BY user_id 收敛到用户粒度，确保 user_id 唯一"
        reason: "聚合后每用户一行，关联回订单不发散"
      - table: "dpf"
        join_key_unique: false
        strategy: "按 user_id 分组取众数收敛"
        reason: "一用户多笔支付，取使用最多的 pay_method 收敛到用户粒度"
      - table: "dcu"
        join_key_unique: false
        strategy: "按 user_id 分组 COUNT 去重收敛"
        reason: "一用户多用券，聚合后每用户一个计数值"
      - table: "drf17"
        join_key_unique: false
        strategy: "按 user_id 分组 COUNT 收敛"
        reason: "一用户多笔退款，聚合后每用户一个计数值"

  # ===================== R0002 商品画像中间表 =====================
  - rule_code: R0002
    rule_name: "商品画像中间表"
    scenario: "default"
    exec_sequence: 2
    target_table: "dwb_order_center_prod_tmp1"
    is_view_step: false
    design_intent: "收口按 product_id 聚合的商品累计销量/销售额(先聚合再关联)，输出商品粒度，避免发散订单粒度。"
    load_mode: "truncate_table"

    field_targets:
      - product_id
      - product_sales_cnt
      - product_sales_amount

    field_logics:
      product_sales_cnt: "商品累计销量：对 dwd_order_detail_f 按 product_id 分组，累加各明细的 qty"
      product_sales_amount: "商品累计销售额：对 dwd_order_detail_f 按 product_id 分组，累加各明细的 real_price 乘以 qty"

    source_aliases: ["dod"]

    grain:
      input: "订单商品明细(一商品多行)"
      output: "一行=一个商品"
      change: "多行聚合"

    joins:
      - alias: "dod"
        type: "main"
        condition: "按 product_id 分组的聚合基表"
        filter: "del_flag='N'"

    join_safety:
      - table: "dod"
        join_key_unique: true
        strategy: "GROUP BY product_id 收敛到商品粒度，确保 product_id 唯一"
        reason: "聚合后每商品一行，关联回订单的主商品不发散"

  # ===================== R0003 店铺画像中间表 =====================
  - rule_code: R0003
    rule_name: "店铺画像中间表"
    scenario: "default"
    exec_sequence: 3
    target_table: "dwb_order_center_shop_tmp1"
    is_view_step: false
    design_intent: "收口按 shop_id 聚合的店铺历史订单数(先聚合再关联)，输出店铺粒度，避免发散订单粒度。"
    load_mode: "truncate_table"

    field_targets:
      - shop_id
      - shop_history_order_cnt

    field_logics:
      shop_history_order_cnt: "店铺历史订单数：对 dwd_order_f 按 shop_id 分组 COUNT 订单数"

    source_aliases: ["dof"]

    grain:
      input: "订单事实表(一店铺多行)"
      output: "一行=一个店铺"
      change: "多行聚合"

    joins:
      - alias: "dof"
        type: "main"
        condition: "按 shop_id 分组的聚合基表"
        filter: "order_status NOT IN ('CANCELLED','DELETED')"

    join_safety:
      - table: "dof"
        join_key_unique: true
        strategy: "GROUP BY shop_id 收敛到店铺粒度，确保 shop_id 唯一"
        reason: "聚合后每店铺一行，关联回订单不发散"

  # ===================== R0004 订单中心宽表 F 表(最终) =====================
  - rule_code: R0004
    rule_name: "订单中心宽表F表"
    scenario: "default"
    exec_sequence: 4
    target_table: "dwb_order_center_f"
    is_view_step: false
    design_intent: "最终宽表：以订单事实表为主表，LEFT JOIN 三个画像中间表(用户/商品/店铺)及全部维表，做关联拼接与字段映射，产出订单粒度宽表。画像聚合已由 R0001-R0003 收口，本规则只做关联拼接。"
    load_mode: "truncate_table"

    field_targets:
      # --- 订单主信息 (dof) ---
      - order_id
      - order_no
      - order_status
      - order_status_name
      - order_time
      - total_amount
      - product_amount
      - pay_amount
      - discount_amount
      - freight_amount
      - product_cnt
      - product_qty
      - order_source_name
      - order_type_name
      - order_remark
      - order_date
      # --- 收货信息 (dof + drf) ---
      - receiver_name
      - receiver_phone_masked
      - receiver_province_code
      - receiver_province_name
      - receiver_city_code
      - receiver_city_name
      - receiver_district_code
      - receiver_district_name
      - receiver_street
      - receiver_address
      - full_address
      - postal_code
      - address_tag_name
      - longitude
      - latitude
      # --- 营销/优惠 (dof + dcu + dcf + daf) ---
      - activity_id
      - activity_name
      - activity_type_name
      - activity_discount_rate
      - coupon_id
      - coupon_name
      - coupon_type_name
      - coupon_amount
      - full_reduce_amount
      - points_deduct_amount
      - points_used
      - is_marketing_order
      - total_discount_amount
      # --- 用户维 (duf + dul) ---
      - user_name
      - user_phone_masked
      - user_email_masked
      - gender_name
      - user_birthday
      - user_age
      - user_register_time
      - user_level_id
      - user_level_name
      - member_points
      - member_balance
      - user_tag
      - user_source_name
      - user_province_code
      - user_city_code
      - user_days
      # --- 商品维 (dod + dpf7 + dpc + dbf) ---
      - product_name
      - product_code
      - sku_code
      - category_l1_id
      - category_l1_name
      - category_l2_id
      - category_l2_name
      - category_l3_id
      - category_l3_name
      - brand_id
      - brand_name
      - brand_origin
      - product_attr
      - product_spec
      - product_weight
      - product_volume
      - cost_price
      - sale_price
      - real_price
      - product_tag
      - product_status_name
      - product_profit
      # --- 店铺维 (dsf + drf) ---
      - shop_name
      - shop_type_name
      - shop_level_name
      - shop_score
      - company_name
      - shop_province_code
      - shop_province_name
      - shop_city_code
      - shop_city_name
      - shop_open_time
      # --- 支付维 (dpf + dpm) ---
      - pay_time
      - pay_id
      - pay_no
      - pay_method_code
      - pay_method_name
      - pay_channel_name
      - pay_status_name
      - bank_card_masked
      - bank_name
      - installment_num
      - pay_service_fee
      - pay_duration_minutes
      # --- 物流维 (dlf + dlc + dwf) ---
      - ship_time
      - receive_time
      - delivery_days
      - logistics_id
      - logistics_no
      - logistics_company_code
      - logistics_company_name
      - logistics_type_name
      - warehouse_id
      - warehouse_name
      - warehouse_address
      - logistics_status_name
      - pickup_time
      - sign_receiver_name
      - ship_duration_hours
      # --- 退款 (drf17) ---
      - refund_id
      - refund_no
      - refund_type_name
      - refund_reason
      - refund_amount
      - refund_status_name
      - refund_apply_time
      - refund_complete_time
      - is_refund_order
      # --- 审计字段 ---
      - del_flag
      - crt_cycle_id
      - last_upd_cycle_id
      - dw_last_update_date

    field_logics:
      # 订单主信息映射
      order_status_name: "订单状态名称：按 order_status 映射中文，PAID→已支付、SHIPPED→已发货、RECEIVED→已签收、CANCELLED→已取消，其余→其他"
      order_source_name: "订单来源：按 order_source 映射，APP→APP端、WEB→网页端、MINIAPP→小程序、H5→H5页面，其余→其他"
      order_type_name: "订单类型：按 order_type 映射，NORMAL→普通订单、PRESALE→预售订单、GROUPBUY→团购订单、SECKILL→秒杀订单，其余→其他"
      order_date: "下单日期：取 create_time 的日期部分"
      # 收货信息
      receiver_phone_masked: "收货人手机脱敏：保留前 3 位和后 4 位，中间用 **** 替换"
      receiver_city_name: "收货城市名称：通过订单 city_code 关联地区维表(dim_region_f)取城市名称"
      receiver_district_name: "收货区县名称：通过订单 district_code 关联地区维表取区县名称"
      full_address: "完整收货地址：依次拼接省名称、城市名称、区县名称、街道、详细地址"
      address_tag_name: "地址标签：按 address_tag 映射，HOME→家、COMPANY→公司、SCHOOL→学校，其余→其他"
      # 营销/优惠
      activity_type_name: "活动类型：按 activity_type 映射，SECKILL→秒杀活动、GROUPBUY→团购活动、PRESALE→预售活动、FULL_GIFT→满赠活动、FULL_REDUCE→满减活动，其余→其他"
      coupon_type_name: "优惠券类型：按 coupon_type 映射，FULL_REDUCE→满减券、DISCOUNT→折扣券、CASH→现金券、FREIGHT→运费券，其余→其他"
      is_marketing_order: "是否营销订单：存在优惠券 ID 或活动 ID 标记为 Y，否则 N"
      total_discount_amount: "总优惠金额：优惠券金额 + 满减金额 + 积分抵扣金额"
      # 用户维
      user_phone_masked: "用户手机脱敏：保留前 3 位和后 4 位，中间用 **** 替换"
      user_email_masked: "用户邮箱脱敏：保留前 2 位和 @ 后域名，中间用 *** 替换"
      gender_name: "用户性别：按 gender 映射，M→男、F→女，其余→未知"
      user_age: "用户年龄：当前年份减去生日年份"
      user_source_name: "用户来源：按 user_source 映射，NATURAL→自然流量、AD→广告投放、REFERRAL→推荐注册、ACTIVITY→活动引流，其余→其他"
      user_days: "用户注册天数：当前日期减去注册时间的天数差"
      # 商品维
      category_l2_id: "二级类目 ID：通过商品维表 category_id 关联分类维表，按 parent_id 上溯取二级类目 ID"
      category_l2_name: "二级类目名称：按二级类目 ID 关联分类维表取 category_name"
      category_l3_id: "三级类目 ID：通过商品维表 category_id 关联分类维表，按 parent_id 两次上溯取三级类目 ID"
      category_l3_name: "三级类目名称：按三级类目 ID 关联分类维表取 category_name"
      product_status_name: "商品状态：按 product_status 映射，ON_SHELF→上架、OFF_SHELF→下架、SOLD_OUT→售罄，其余→其他"
      product_profit: "单品毛利：商品售价减去成本价"
      # 店铺维
      shop_type_name: "店铺类型：按 shop_type 映射，FLAGSHIP→旗舰店、SPECIALTY→专卖店、FRANCHISE→专营店、OFFICIAL→官方店，其余→其他"
      shop_level_name: "店铺等级：拼接 Lv. 前缀和店铺等级数字"
      shop_province_name: "店铺省份名称：通过店铺维表 province_code 关联地区维表取省名称"
      shop_city_name: "店铺城市名称：通过店铺维表 city_code 关联地区维表取城市名称"
      # 支付维
      pay_channel_name: "支付渠道名称：通过支付方式维表关联取支付渠道名称"
      pay_status_name: "支付状态：按 pay_status 映射，SUCCESS→支付成功、FAILED→支付失败、PENDING→支付中，其余→未知"
      bank_card_masked: "银行卡号脱敏：仅保留后 4 位，前面用 **** 替换"
      pay_duration_minutes: "下单到支付时长(分钟)：支付时间减去下单时间，换算为分钟"
      # 物流维
      delivery_days: "物流时长(天)：签收时间减去发货时间的整数天数差"
      logistics_type_name: "物流类型：通过物流公司维表关联取物流类型名称"
      warehouse_address: "发货仓库地址：通过仓库维表关联地区维表取仓库所在地址"
      logistics_status_name: "物流状态：按 logistics_status 映射，PENDING→待发货、SHIPPED→已发货、IN_TRANSIT→运输中、DELIVERED→已签收，其余→其他"
      ship_duration_hours: "支付到发货时长(小时)：发货时间减去支付时间，换算为小时"
      # 退款
      refund_type_name: "退款类型：按 refund_type 映射，ONLY_REFUND→仅退款、RETURN_REFUND→退货退款、EXCHANGE→换货，其余→其他"
      refund_status_name: "退款状态：按 refund_status 映射，APPLYING→申请中、APPROVED→已同意、SUCCESS→退款成功、REJECTED→已拒绝，其余→其他"
      is_refund_order: "是否退款订单：存在退款 ID 标记为 Y，否则 N"

    source_aliases: []
    # 留空 → 脚本默认用 rs_input 全部 18 个源表(本规则关联全部维表/事实表)

    ctes:
      - name: "main_product"
        purpose: "取每个订单的第一条商品明细作为主商品，收敛一对多(一订单多商品)到订单粒度"
        source_tables: ["dod"]
      - name: "latest_payment"
        purpose: "取每个订单支付成功的最新一条支付记录，收敛一对多(一订单多次支付)到订单粒度"
        source_tables: ["dpf"]
      - name: "latest_logistics"
        purpose: "取每个订单最新一条物流记录，收敛一对多(一订单多条物流)到订单粒度"
        source_tables: ["dlf"]
      - name: "latest_coupon"
        purpose: "取每个订单使用状态为 USED 的一张优惠券，收敛一对多(一订单多券)到订单粒度"
        source_tables: ["dcu"]
      - name: "latest_refund"
        purpose: "取每个订单退款成功的一笔退款记录，收敛一对多(一订单多次退款)到订单粒度"
        source_tables: ["drf17"]

    grain:
      input: "订单事实表为主(一行=一个订单)，关联维表及画像中间表"
      output: "一行=一个订单"
      change: "无变化(一对多关联已通过 CTE 收敛到订单粒度)"

    joins:
      - alias: "dof"
        type: "main"
        condition: "订单主事实表"
        filter: "order_status NOT IN ('CANCELLED','DELETED')"
      - alias: "main_product(CTE)"
        type: "LEFT JOIN"
        condition: "dof.order_id = main_product.order_id"
        filter: ""
      - alias: "latest_payment(CTE)"
        type: "LEFT JOIN"
        condition: "dof.order_id = latest_payment.order_id"
        filter: ""
      - alias: "latest_logistics(CTE)"
        type: "LEFT JOIN"
        condition: "dof.order_id = latest_logistics.order_id"
        filter: ""
      - alias: "latest_coupon(CTE)"
        type: "LEFT JOIN"
        condition: "dof.order_id = latest_coupon.order_id"
        filter: ""
      - alias: "latest_refund(CTE)"
        type: "LEFT JOIN"
        condition: "dof.order_id = latest_refund.order_id"
        filter: ""
      - alias: "dwb_order_center_user_tmp1"
        type: "LEFT JOIN"
        condition: "dof.user_id = dwb_order_center_user_tmp1.user_id"
        filter: ""
      - alias: "dwb_order_center_prod_tmp1"
        type: "LEFT JOIN"
        condition: "main_product.product_id = dwb_order_center_prod_tmp1.product_id"
        filter: ""
      - alias: "dwb_order_center_shop_tmp1"
        type: "LEFT JOIN"
        condition: "dof.shop_id = dwb_order_center_shop_tmp1.shop_id"
        filter: ""
      - alias: "duf"
        type: "LEFT JOIN"
        condition: "dof.user_id = duf.user_id"
        filter: ""
      - alias: "dul"
        type: "LEFT JOIN"
        condition: "duf.level_id = dul.level_id"
        filter: ""
      - alias: "dpf7"
        type: "LEFT JOIN"
        condition: "main_product.product_id = dpf7.product_id"
        filter: ""
      - alias: "dpc"
        type: "LEFT JOIN"
        condition: "dpf7.category_id = dpc.category_id(一级类目)；再按 parent_id 两次自关联取二/三级类目"
        filter: ""
      - alias: "dbf"
        type: "LEFT JOIN"
        condition: "dpf7.brand_id = dbf.brand_id"
        filter: ""
      - alias: "dsf"
        type: "LEFT JOIN"
        condition: "dof.shop_id = dsf.shop_id"
        filter: ""
      - alias: "drf(收货省)"
        type: "LEFT JOIN"
        condition: "dof.province_code = drf1.region_code"
        filter: ""
      - alias: "drf(收货市)"
        type: "LEFT JOIN"
        condition: "dof.city_code = drf2.region_code"
        filter: ""
      - alias: "drf(收货区)"
        type: "LEFT JOIN"
        condition: "dof.district_code = drf3.region_code"
        filter: ""
      - alias: "drf(店铺省)"
        type: "LEFT JOIN"
        condition: "dsf.province_code = drf4.region_code"
        filter: ""
      - alias: "drf(店铺市)"
        type: "LEFT JOIN"
        condition: "dsf.city_code = drf5.region_code"
        filter: ""
      - alias: "dpm"
        type: "LEFT JOIN"
        condition: "latest_payment.pay_method = dpm.method_code"
        filter: ""
      - alias: "dlc"
        type: "LEFT JOIN"
        condition: "latest_logistics.logistics_company = dlc.company_code"
        filter: ""
      - alias: "dwf"
        type: "LEFT JOIN"
        condition: "latest_logistics.warehouse_id = dwf.warehouse_id"
        filter: ""
      - alias: "dcf"
        type: "LEFT JOIN"
        condition: "latest_coupon.coupon_id = dcf.coupon_id"
        filter: ""
      - alias: "daf"
        type: "LEFT JOIN"
        condition: "dof.activity_id = daf.activity_id"
        filter: ""

    join_safety:
      - table: "dod(main_product CTE)"
        join_key_unique: false
        strategy: "ROW_NUMBER 按 order_id 分区取第一条商品收敛"
        reason: "一订单多商品，取主商品收敛到订单粒度避免发散"
      - table: "dpf(latest_payment CTE)"
        join_key_unique: false
        strategy: "取支付成功中最新一条收敛"
        reason: "一订单多次支付，取最新成功记录收敛到订单粒度"
      - table: "dlf(latest_logistics CTE)"
        join_key_unique: false
        strategy: "取最新一条物流记录收敛"
        reason: "一订单多条物流，取最新收敛到订单粒度"
      - table: "dcu(latest_coupon CTE)"
        join_key_unique: false
        strategy: "取使用状态为 USED 的一张收敛"
        reason: "一订单多张优惠券，取一张收敛到订单粒度"
      - table: "drf17(latest_refund CTE)"
        join_key_unique: false
        strategy: "取退款成功的一笔收敛"
        reason: "一订单多次退款，取一笔收敛到订单粒度"
      - table: "dwb_order_center_user_tmp1"
        join_key_unique: true
        strategy: "无需额外收敛"
        reason: "已按 user_id GROUP BY 收敛，每用户一行，多订单→一用户安全"
      - table: "dwb_order_center_prod_tmp1"
        join_key_unique: true
        strategy: "无需额外收敛"
        reason: "已按 product_id GROUP BY 收敛，每商品一行"
      - table: "dwb_order_center_shop_tmp1"
        join_key_unique: true
        strategy: "无需额外收敛"
        reason: "已按 shop_id GROUP BY 收敛，每店铺一行"
      - table: "duf"
        join_key_unique: true
        strategy: "取当前有效用户"
        reason: "用户维表 user_id 唯一"
      - table: "dpf7"
        join_key_unique: true
        strategy: "取当前有效商品"
        reason: "商品维表 product_id 唯一"
      - table: "dsf"
        join_key_unique: true
        strategy: "取当前有效店铺"
        reason: "店铺维表 shop_id 唯一"
      - table: "drf(地区维表多别名)"
        join_key_unique: true
        strategy: "按各自 region_code 关联，同一地区维表通过不同别名分别关联省/市/区"
        reason: "region_code 唯一，需 5 次别名关联(收货省市区 + 店铺省市)"

# === 复杂度分析与分段决策 ===
complexity_analysis:
  join_count: 18
  has_grain_change: true
  grain_change_detail: "三类画像聚合(用户/商品/店铺)将订单粒度收敛为各自粒度后关联回订单；五张一对多事实表(明细/支付/物流/优惠券/退款)需收敛到订单粒度"
  multi_step_fields: 16
  aggregation_after_join: true
  segmentation_decision: "分段"
  segmentation_reason: "JOIN 表数量 18(有效关联操作约 24，dim_region_f 需 5 次别名关联、dim_product_category_f 需 3 次自关联)远超阈值 12；16 个多步骤加工字段需先聚合再关联；存在用户/商品/店铺三类粒度变化及五处一对多收敛。拆为 3 个画像中间表收口聚合，最终 F 表只做关联拼接，降低单条 INSERT 复杂度并使画像可独立校验。"

# === 分布键 ===
# order_id 为订单粒度主键，基数最高，是所有事实表的主关联键，多表 JOIN 分布对齐最优。
distribution_key: ["order_id"]

# === 业务主键 ===
business_key: ["order_id"]

business_key_design:
  input_key: ["order_id"]
  adjusted: false
  reason: "RS 标注主键为 order_id；产出表粒度为每行一个订单，order_id 在该粒度下唯一，无需调整。"

