# ============================================================================
# design_decisions.yaml - 设计决策（designer agent 产出）
# 目标表: slusr.dwb_user_profile_f（用户画像宽表）
# ----------------------------------------------------------------------------
# 这个文件只含"设计判断"，不含字段类型/来源等确定性数据。
# 字段详情（类型/注释/来源字段）由 assemble_ts.py 从 rs_input.json 自动搬移。
#
# 设计要点：
# - 单场景（所有 field_mapping 的 scene_group 均为 default），单规则产出目标 F 表
# - 4 表关联（1 主表 + 3 LEFT JOIN 维度表），无粒度变化、无聚合 → 不分段、无中间表/CTE
# - 主表别名按 rs_input source_tables 的 source_alias 取定：oub/dul/drd/dus
#   （rs_input 的 join_condition 文本里写的 u/l/r/s 仅为示意，统一以 source_aliases 为准）
# ============================================================================

# === 规则拆分（核心判断）===
rules:
  - rule_code: R0001
    rule_name: "用户画像宽表全量装载"
    scenario: "default"                       # 单场景，所有字段 scene_group=default
    exec_sequence: 1
    target_table: "dwb_user_profile_f"        # 产出目标 F 表
    is_view_step: false
    design_intent: >
      以 ods.ods_user_basic_f 为主表（一行=一个用户），LEFT JOIN 等级/地区/来源三张维度表
      补齐画像属性，行内完成脱敏/翻译/日期拆解/VIP 判定等轻加工，全量覆盖目标宽表所有字段。
      关联表数量少、无粒度变化、无聚合，单条 INSERT 即可，无需分段或建中间表。

    # 该规则产出所有目标字段（脚本据此从 rs_input 搬字段详情）
    # 来源分布：oub 用户基础信息 / dul 用户等级维度 / drd 地区维度 / dus 用户来源维度 / 4 个审计字段
    field_targets:
      # --- 来自 ods.ods_user_basic_f (oub) ---
      - user_id
      - user_name
      - user_phone_processed
      - user_phone_masked
      - email
      - gender_processed
      - birthday
      - age_processed
      - id_card
      - id_card_masked_processed
      - real_name
      - nick_name
      - avatar_url
      - user_status
      - user_status_name_processed
      - register_time
      - register_date_processed
      - register_hour_processed
      - register_weekday_processed
      - last_login_time
      - last_login_date_processed
      - login_count
      - province_code
      - province_name
      - city_code
      - city_name
      - district_code
      - district_name
      - address
      - zip_code
      - source_id
      - source_name
      - source_type
      - device_type
      - os_type
      - app_version
      - ip_address
      - longitude
      - latitude
      - language
      - timezone
      - currency
      - vip_level
      - vip_expire_time
      - is_vip_processed
      - member_points
      - balance
      - credit_score
      - risk_level
      - verify_status
      # --- 来自 dim.dim_user_level_d (dul) ---
      - level_id
      - level_name
      - level_code
      - level_rank
      - min_points
      - max_points
      - level_icon
      - level_color
      - upgrade_points
      - current_level_points
      - next_level_points
      - progress_percentage
      - privilege_list
      - discount_rate
      - points_rate
      - free_shipping
      - exclusive_products
      - priority_support
      - birthday_bonus
      - monthly_coupon
      - annual_gift
      - vip_service
      - invite_quota
      - max_orders_per_day
      - max_return_days
      - level_benefits
      - upgrade_time
      - downgrade_time
      - maintain_days
      - level_status
      - create_time
      - update_time
      - valid_from
      - valid_to
      - is_active
      - level_tier
      - level_group
      - level_category
      - points_required
      - orders_required
      - amount_required
      - days_required
      - growth_value
      - experience_value
      - contribution_value
      - activity_value
      - loyalty_score
      - engagement_score
      - satisfaction_score
      - retention_score
      # --- 来自 dim.dim_region_d (drd) ---
      - region_id
      - region_code
      - region_name
      - parent_id
      - region_level
      - region_path
      - province_id
      - province_abbr
      - city_id
      - city_abbr
      - district_id
      - district_abbr
      - street_id
      - street_code
      - street_name
      - center_longitude
      - center_latitude
      - area_size
