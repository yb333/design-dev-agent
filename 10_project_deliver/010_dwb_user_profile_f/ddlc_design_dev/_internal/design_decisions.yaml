      - dw_last_update_date

    # ★ 仅加工类字段（数据加工）写 design_logic（自然语言口径，不含 SQL）。
    # 直取字段（transform_rule=直接复制）不写，脚本自动填。
    # 赋值类审计字段不写，脚本按 transform_detail 自动取值。
    field_logics:
      user_phone_processed: "手机号脱敏：保留前 3 位与后 4 位，中间用 **** 占位"
      gender_processed: "性别代码翻译为中文：M 取男、F 取女，其余取未知"
      age_processed: "由出生日期推算年龄：取当前日期的年份减去出生日期的年份"
      id_card_masked_processed: "身份证号脱敏：保留前 6 位与后 4 位，中间用 ******** 占位"
      user_status_name_processed: "用户状态代码翻译为中文：ACTIVE 取正常、INACTIVE 取未激活、BANNED 取封禁，其余取未知"
      register_date_processed: "取注册时间的日期部分（年月日）"
      register_hour_processed: "取注册时间的小时部分（0~23）"
      register_weekday_processed: "取注册时间是星期几（按当日星期序号）"
      last_login_date_processed: "取最后登录时间的日期部分（年月日）"
      is_vip_processed: "判断是否为有效 VIP：当 VIP 到期时间晚于当前时间取 1，否则取 0"
      progress_percentage: "升级进度百分比：当前等级积分除以升级所需积分，再乘 100"

    # 该规则关联的源表（与 rs_input source_tables 对应的别名）
    source_aliases:
      - oub
      - dul
      - drd
      - dus

    # CTE（无需，单条 INSERT + 4 表平铺 LEFT JOIN 直接搞定）
    ctes: []

    # 粒度变化（输入→输出）
    grain:
      input: "一行 = ods.ods_user_basic_f 中的一个用户"
      output: "一行 = 用户画像宽表中的一个用户"
      change: "无变化"

    # 关联策略（别名按 rs_input source_tables 的 source_alias 取定，
    # rs_input 中 join_condition 文本里的 u/l/r/s 与 oub/dul/drd/dus 一一对应）
    joins:
      - alias: "oub"
        type: "main"
        condition: "ods.ods_user_basic_f 为主表"
        filter: ""
      - alias: "dul"
        type: "LEFT JOIN"
        condition: "oub.level_id = dul.level_id"
        filter: "限定 dul 取当前有效等级行（见 join_safety）"
      - alias: "drd"
        type: "LEFT JOIN"
        condition: "oub.province_code = drd.region_code"
        filter: "限定 drd 取省份层级行（见 join_safety）"
      - alias: "dus"
        type: "LEFT JOIN"
        condition: "oub.source_id = dus.source_id"
        filter: ""

    # 关联安全分析（JOIN 键唯一性 → 对齐策略）
    join_safety:
      - table: "dim.dim_user_level_d"
        join_key_unique: false
        strategy: "取当前有效等级行：限定 is_active=1 且 valid_from<=当前时间<valid_to（或取 update_time 最新的一行），保证每个 level_id 唯一"
        reason: "该维度含 valid_from/valid_to/is_active/update_time 等 SCD2 风格字段，同一 level_id 可能存在多版本/历史行，不收敛会导致主表行被放大"
      - table: "dim.dim_region_d"
        join_key_unique: false
        strategy: "按地区层级收敛：限定 region_level 取省份层级（与 oub.province_code 对齐的层级），保证 region_code 唯一"
        reason: "该维度含 region_level 表示多层级（省/市/区县等），同一 region_code 在不同层级下可能多次出现，需限定层级避免行膨胀"
      - table: "dim.dim_user_source_d"
        join_key_unique: true
        strategy: ""
        reason: "用户来源维度按 source_id 唯一定义，LEFT JOIN 不会放大主表行"

# === 复杂度分析与分段决策 ===
complexity_analysis:
  join_count: 4                            # 主表 + 3 维度表
  has_grain_change: false                  # 输入输出粒度一致（一行一用户）
  grain_change_detail: "输入粒度=用户（ods_user_basic_f 一行一用户），输出粒度=用户，无聚合/无展开"
  multi_step_fields: 0                     # 所有加工字段均为单级行内转换（脱敏/翻译/日期拆解/比较），无需先聚合再关联
  aggregation_after_join: false            # JOIN 后无 GROUP BY/聚合
  segmentation_decision: "不分段"
  segmentation_reason: >
    仅 4 表关联（远低于 12 表阈值），无粒度变化，无聚合后关联，无复杂关联链；
    所有数据加工字段均为单级行内转换，可在同一条 INSERT 内一次性完成。
    无需建物理中间表，亦无需 CTE 收口。

# === 分布键（designer 判断，参考 design-guide.md §2.1）===
# user_id：业务主键、粒度定义字段、高基数，且为下游消费该宽表最常用的 JOIN/过滤字段
distribution_key:
  - user_id

# === 业务主键（业务唯一字段组合，供 UT 主键唯一检查）===
business_key:
  - user_id

# === 调度细化（RS 给大框架 → designer 细化）===
schedule:
  task_name: "dwb_user_profile_f"
  cron: "0 30 3 * * ?"                      # T+1 每天 3:30 执行（对应 SLA 3:30）
  task_group: "dwb_user_profile"
  project: "dwb"
  # 设计未新增中间表，故无新增上游依赖；rs_input 已有上游脚本自动带
  upstream_added: []

# === 数据流（规则间关系）===
data_flow:
  # 单规则，无规则间依赖
  dependencies: []
  # 执行顺序/并行（单场景单规则）
  schedule_groups:
    - sequence: 1
      rules: ["R0001"]

# === DQ（可选，本表暂不强制；如需可由 coder 补充）===
# 建议关注点（仅供参考，不强制生成 DQ SQL）：
# - user_id 唯一性（业务主键）
# - level_id/region_code/source_id 在 LEFT JOIN 后的命中率（关联缺失告警）
# - 必填字段非空（user_id/user_name 等）
dq_rules: []
