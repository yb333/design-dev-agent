# ============================================================================
# design_decisions.yaml - 店铺中心宽表 (dwb_shop_center_f)
# ----------------------------------------------------------------------------
# 设计要点：
#   - dim_shop_f 为主表，LEFT JOIN dim_region_f 取省份名称（维度表，1:1 关联）
#   - dwd_order_f / dwd_review_f 是事实表（1店多单/多评），直接 JOIN 会 fan-out
#     导致 COUNT/SUM 放大。通过 CTE 预聚合到店铺粒度后再关联，保证正确性。
#   - JOIN 数(4)远低于分段阈值(12)，多步骤字段(4)低于阈值(5)，CTE 内联即可，
#     无需物理中间表 → 不分段。
# ============================================================================

# === 参数声明 ===
# P_CYCLE_ID(批次号) 由脚本自动注入，无业务参数
params: []

# === 规则拆分 ===
rules:
  - rule_code: R0001
    rule_name: 店铺中心宽表组装
    scenario: default
    exec_sequence: 1
    target_table: slshp.dwb_shop_center_f
    is_view_step: false
    design_intent: >
      以店铺维度表为主表，LEFT JOIN 地区维度表获取省份名称；
      通过 CTE 预聚合订单/评价事实表到店铺粒度，避免多表直接 JOIN 的 fan-out；
      标量加工字段（类型/状态映射、营业天数）在主表行内计算。
    load_mode: truncate_table

    # 该规则管所有 20 个目标字段（全量宽表一次组装）
    field_targets:
      - shop_id
      - shop_name
      - shop_type_name
      - shop_status_name
      - company_name
      - open_time
      - open_days
      - province_code
      - province_name
      - shop_score
      - service_score
      - logistics_score
      - total_order_cnt
      - total_sales_amount
      - total_buyer_cnt
      - review_cnt
      - del_flag
      - crt_cycle_id
      - last_upd_cycle_id
      - dw_last_update_date

    # 仅加工类字段写 design_logic（直取字段脚本自动填，审计字段脚本自动处理）
    field_logics:
      shop_type_name: "店铺类型中文映射：FLAGSHIP→旗舰店，SPECIALTY→专卖店，FRANCHISE→专营店，其余→其他"
      shop_status_name: "店铺状态中文映射：OPEN→营业中，CLOSED→已关闭，FROZEN→冻结，其余→其他"
      open_days: "营业天数 = 当前日期减开店时间的天数差（DATEDIFF）"
      total_order_cnt: "累计订单数：CTE order_stat 预聚合 dwd_order_f 按 shop_id 统计 COUNT(*)"
      total_sales_amount: "累计销售额：CTE order_stat 预聚合 dwd_order_f 按 shop_id 汇总 SUM(pay_amount)"
      total_buyer_cnt: "累计购买人数：CTE order_stat 预聚合 dwd_order_f 按 shop_id 统计 COUNT(DISTINCT user_id)"
      review_cnt: "评价数：CTE review_stat 预聚合 dwd_review_f 按 shop_id 统计 COUNT(*)"

    # 留空 = 默认使用 rs_input 所有源表
    source_aliases: []

    # CTE：事实表预聚合，收敛到店铺粒度后再关联（避免 fan-out）
    ctes:
      - name: order_stat
        purpose: "订单统计预聚合：从 dwd_order_f 按 shop_id 聚合订单数/销售额/去重购买人数，收敛到店铺粒度"
        source_tables: [dwd_order_f]
      - name: review_stat
        purpose: "评价统计预聚合：从 dwd_review_f 按 shop_id 聚合评价数，收敛到店铺粒度"
        source_tables: [dwd_review_f]

    # 粒度变化
    grain:
      input: "多源混合：店铺维(1店1行) + 地区维(1区1行) + 订单事实(1店多单) + 评价事实(1店多评)"
      output: "一行=一个店铺"
      change: "多行聚合"

    # 关联策略
    joins:
      - alias: dsf
        type: main
        condition: ""
        filter: ""
      - alias: drf
        type: LEFT JOIN
        condition: "dsf.province_code = drf.region_code"
        filter: ""
      - alias: order_stat
        type: LEFT JOIN
        condition: "dsf.shop_id = order_stat.shop_id"
        filter: ""
      - alias: review_stat
        type: LEFT JOIN
        condition: "dsf.shop_id = review_stat.shop_id"
        filter: ""

    # 关联安全分析
    join_safety:
      - table: dim_shop_f
        join_key_unique: true
        strategy: ""
        reason: "店铺维度表，shop_id 为业务主键应唯一；若为拉链表需取最新有效记录"
      - table: dim_region_f
        join_key_unique: true
        strategy: ""
        reason: "地区维度表，region_code 应唯一；若为拉链表需取最新有效记录"
      - table: dwd_order_f
        join_key_unique: true
        strategy: "CTE 预聚合 GROUP BY shop_id 收敛到店铺粒度"
        reason: "事实表一对多，通过 CTE 预聚合保证 JOIN 键唯一，避免 fan-out"
      - table: dwd_review_f
        join_key_unique: true
        strategy: "CTE 预聚合 GROUP BY shop_id 收敛到店铺粒度"
        reason: "事实表一对多，通过 CTE 预聚合保证 JOIN 键唯一，避免 fan-out"

# === 复杂度分析与分段决策 ===
complexity_analysis:
  join_count: 4
  has_grain_change: true
  grain_change_detail: "订单事实表(订单粒度)和评价事实表(评价粒度)需聚合到店铺粒度后关联"
  multi_step_fields: 4
  aggregation_after_join: true
  segmentation_decision: "不分段"
  segmentation_reason: >
    JOIN表数(4)远低于阈值(12)，多步骤字段(4)低于阈值(5)；
    订单/评价聚合逻辑简单(COUNT/SUM)，通过 CTE 内联处理即可，
    单条 INSERT 可清晰表达，无需物理中间表。

# === 表物理属性 ===
tables:
  dwb_shop_center_f:
    distribution_key: [shop_id]
    distribute_type: HASH

# === 业务主键 ===
business_key: [shop_id]

business_key_design:
  input_key: [shop_id]
  adjusted: false
  reason: ""

# === 调度细化 ===
schedule:
  task_name: slshp_dwb_shop_center_f
  cron: "0 0 3 * * ?"
  lts_params:
    - lts_var: V_CYCLE_ID
      etl_param: P_CYCLE_ID
      desc: "批次号"
    - lts_var: V_GROUP_CODE
      etl_param: ""
      desc: "规则组编码"
  upstream_added: []
  # I 视图为 F 表镜像（SELECT * FROM ..._f），无需独立调度任务
  view:
    task_name: ""
    cron: ""

# === 数据流 ===
data_flow:
  dependencies: []
  schedule_groups:
    - sequence: 1
      rules: [R0001]

# === DQ（RS 无 DQ 要求）===
dq_rules: []
