# ============================================================================
# design_decisions.yaml - 设计决策（designer agent 产出）
# 资产：slusr.dwb_user_profile_f 用户画像宽表
# ----------------------------------------------------------------------------
# 单规则全量调度宽表：主表 oub LEFT JOIN 3 张维表，粒度无变化（用户行→用户行）。
# 字段详情（类型/注释/来源字段）由 assemble_ts.py 从 rs_input.json 自动搬移。
# ============================================================================

# === 参数声明（资产级统一声明）===
# P_CYCLE_ID(批次号) 由脚本自动注入，无需在此声明。
# 本资产为全量调度，无增量起止时间等业务参数。
params: []

# === 规则拆分（核心判断）===
rules:
  - rule_code: R0001
    rule_name: "用户画像宽表全量加工"
    scenario: "default"
    exec_sequence: 1
    target_table: "slusr.dwb_user_profile_f"
    is_view_step: false
    design_intent: "用户画像宽表全量重写：以 oub 用户基础表为主表，LEFT JOIN 等级/地区/来源三张维表补齐画像属性，并对敏感字段脱敏、枚举字段转中文、派生时间维度字段。无粒度变化、无聚合，单条 INSERT 即可完成。"
    load_mode: "truncate_table"

    # 该规则产出全部 187 个目标字段（50 oub + 50 dul + 40 drd + 43 dus + 4 审计）
    field_targets:
      # --- oub: ods.ods_user_basic_f（主表） ---
      - user_id
      - user_name
      - user_phone_processed
      - user_phone_masked
      - email
      - gender_processed
      - birthday
      - age_processed
      - id_card
      - id_card_masked_processed
      - real_name
      - nick_name
      - avatar_url
      - user_status
      - user_status_name_processed
      - register_time
      - register_date_processed
      - register_hour_processed
      - register_weekday_processed
      - last_login_time
      - last_login_date_processed
      - login_count
      - province_code
      - province_name
      - city_code
      - city_name
      - district_code
      - district_name
      - address
      - zip_code
      - source_id
      - source_name
      - source_type
      - device_type
      - os_type
      - app_version
      - ip_address
      - longitude
      - latitude
      - language
      - timezone
      - currency
      - vip_level
      - vip_expire_time
      - is_vip_processed
      - member_points
      - balance
      - credit_score
      - risk_level
      - verify_status
      # --- dul: dim.dim_user_level_d（用户等级维表） ---
      - level_id
      - level_name
      - level_code
      - level_rank
      - min_points
      - max_points
      - level_icon
      - level_color
      - upgrade_points
      - current_level_points
      - next_level_points
      - progress_percentage
      - privilege_list
      - discount_rate
      - points_rate
      - free_shipping
      - exclusive_products
      - priority_support
      - birthday_bonus
      - monthly_coupon
      - annual_gift
      - vip_service
      - invite_quota
      - max_orders_per_day
      - max_return_days
      - level_benefits
      - upgrade_time
      - downgrade_time
      - maintain_days
      - level_status
      - create_time
      - update_time
      - valid_from
      - valid_to
      - is_active
      - level_tier
      - level_group
      - level_category
      - points_required
      - orders_required
      - amount_required
      - days_required
      - growth_value
      - experience_value
      - contribution_value
      - activity_value
      - loyalty_score
      - engagement_score
      - satisfaction_score
      - retention_score
      # --- drd: dim.dim_region_d（地区维表） ---
      - region_id
      - region_code
      - region_name
      - parent_id
      - region_level
      - region_path
      - province_id
      - province_abbr
      - city_id
      - city_abbr
      - district_id
      - district_abbr
      - street_id
      - street_code
      - street_name
      - center_longitude
      - center_latitude
      - area_size
      - population
      - gdp
      - gdp_per_capita
      - climate_type
      - economy_level
      - development_level
      - urban_rate
      - region_type
      - is_coastal
      - is_border
      - is_capital
      - is_special
      - postal_code_prefix
      - phone_area_code
      - car_plate_prefix
      - airport_code
      - railway_station_code
      - port_code
      - weather_station_code
      - customs_code
      - statistical_code
      - iso_code
      # --- dus: dim.dim_user_source_d（用户来源维表） ---
      - source_code
      - source_category
      - channel_id
      - channel_code
      - channel_name
      - channel_type
      - channel_category
      - campaign_id
      - campaign_code
      - campaign_name
      - campaign_type
      - medium_id
      - medium_code
      - medium_name
      - medium_type
      - term_id
      - term_keyword
      - content_id
      - content_name
      - referral_url
      - landing_page
      - utm_source
      - utm_medium
      - utm_campaign
      - utm_term
      - utm_content
      - cost_per_acquisition
      - conversion_rate
      - quality_score
      - retention_rate_7d
      - retention_rate_30d
      - lifetime_value
      - first_order_amount
      - first_order_days
      - register_device
      - register_os
      - register_browser
      - register_network
      - register_location
      - attribution_model
      - lookback_days
      - priority
      - is_paid
      # --- 审计字段（赋值，assemble 自动处理） ---
      - del_flag
      - crt_cycle_id
      - last_upd_cycle_id
      - dw_last_update_date

    # ★ 仅数据加工类字段写 design_logic（自然语言口径，不含 SQL）。
    # 直取字段不写，脚本自动填；审计字段不写，脚本自动填标准值。
    field_logics:
      user_phone_processed: "手机号脱敏：保留前3位和后4位，中间用4个星号屏蔽"
      gender_processed: "性别代码转中文：M转男、F转女，其余值转未知"
      age_processed: "由出生日期计算年龄：当前年份减去出生年份"
      id_card_masked_processed: "身份证号脱敏：保留前6位和后4位，中间用8个星号屏蔽"
      user_status_name_processed: "用户状态代码转中文名称：ACTIVE转正常、INACTIVE转未激活、BANNED转封禁，其余值转未知"
      register_date_processed: "从注册时间戳提取日期部分"
      register_hour_processed: "从注册时间戳提取小时（24小时制）"
      register_weekday_processed: "从注册时间戳提取星期几"
      last_login_date_processed: "从最后登录时间戳提取日期部分"
      is_vip_processed: "判断是否VIP：VIP到期时间大于当前时间则为1，否则为0"
      progress_percentage: "升级进度百分比：当前等级积分除以升级所需积分再乘以100"

    # 留空，脚本默认用 rs_input 里所有 source_tables
    source_aliases: []

    # CTE（本规则无中间表，不使用 CTE）
    ctes: []

    # 粒度变化（输入→输出）
    grain:
      input: "一行=一个用户（ods_user_basic_f）"
      output: "一行=一个用户画像记录"
      change: "无变化"

    # 关联策略（JOIN 条件已归一化为主表别名 oub 与各维表别名）
    joins:
      - alias: "oub"
        type: "main"
        condition: ""
        filter: ""
      - alias: "dul"
        type: "LEFT JOIN"
        condition: "oub.level_id = dul.level_id"
        filter: ""
      - alias: "drd"
        type: "LEFT JOIN"
        condition: "oub.province_code = drd.region_code"
        filter: ""
      - alias: "dus"
        type: "LEFT JOIN"
        condition: "oub.source_id = dus.source_id"
        filter: ""

    # 关联安全分析：3 张维表 JOIN 键均按主键唯一
    join_safety:
      - table: "dul"
        join_key_unique: true
        strategy: ""
        reason: "dim_user_level_d 按 level_id 唯一（维表主键）"
      - table: "drd"
        join_key_unique: true
        strategy: ""
        reason: "dim_region_d 按 region_code 唯一（维表主键），关联键 province_code 对应 region_code"
      - table: "dus"
        join_key_unique: true
        strategy: ""
        reason: "dim_user_source_d 按 source_id 唯一（维表主键）"

# === 复杂度分析与分段决策 ===
complexity_analysis:
  join_count: 3                         # JOIN 表数量（不含主表）
  has_grain_change: false               # 是否有粒度变化
  grain_change_detail: "输入用户行，输出用户行，粒度无变化"
  multi_step_fields: 11                 # 多步骤加工字段数（均为单字段加工，无聚合）
  aggregation_after_join: false         # JOIN 后是否聚合
  segmentation_decision: "不分段"        # 单规则一条 INSERT 完成
  segmentation_reason: "JOIN 表数量 3（远低于阈值 12），无粒度变化，加工字段均为单字段变换无聚合后关联，复杂度低，单条 INSERT 即可完成全量重写"

# === 表物理属性（per-table）===
tables:
  # 目标F表：分布键取业务主键 user_id（高基数、JOIN 关联字段）
  dwb_user_profile_f:
    distribution_key: [user_id]
    distribute_type: HASH

# === 业务主键（业务唯一字段组合）===
business_key: [user_id]

# 主键设计说明
business_key_design:
  input_key: [user_id]                   # mapping/RS 标注的主键（备注列"主键"）
  adjusted: false                        # 粒度无变化，主键保持不变
  reason: ""

# === 调度细化（RS给大框架 → designer细化）===
schedule:
  task_name: "dwb_user_profile_f"        # F表调度任务名
  cron: "0 30 3 * * ?"                   # T+1 日级，SLA 3:30 细化为 Quartz cron

  # LTS 调度参数（运行时生成值，赋值给术加 ETL 参数）
  lts_params:
    - lts_var: "V_CYCLE_ID"
      etl_param: "P_CYCLE_ID"
      desc: "批次号"

  # 设计新增的上游依赖（本规则无中间表，无新增上游）
  upstream_added: []

  # I 视图调度（直封视图，独立调度任务，晚于 F 表）
  view:
    task_name: "dwb_user_profile_i"      # 视图调度任务名
    cron: "0 35 3 * * ?"                 # 比 F 表晚 5 分钟，等 F 表完成

# === 数据流（规则间关系）===
data_flow:
  dependencies: []                       # 单规则，无规则间依赖
  schedule_groups:
    - sequence: 1
      rules: ["R0001"]

# === DQ（rs_input 的 dq_requirements 为空，留空）===
dq_rules: []
