# ============================================================================
# design_decisions.yaml - 用户画像宽表 (slusr.dwb_user_profile_f) 设计决策
# ----------------------------------------------------------------------------
# 单场景(default)、不分段：1主表 + 3维度表 LEFT JOIN，按用户粒度全量写入。
# I视图(dwb_user_profile_i)为F表镜像，由 meta.i_view + coder 约定生成，不单列规则。
# 187 个目标字段确定性提取自 rs_input.json；11 个加工字段写 design_logic。
# ============================================================================

rules:
- rule_code: R0001
  rule_name: 用户画像宽表写入
  scenario: default
  exec_sequence: 1
  target_table: slusr.dwb_user_profile_f
  is_view_step: false
  design_intent: 以用户基础信息表(oub)为主表（粒度锚点：一个用户），LEFT JOIN 用户等级维度(dul)、地区维度(drd)、用户来源维度(dus)三张维度表补充画像属性，按用户粒度一次性全量写入画像宽表；字段以直取为主，少量字段做脱敏/代码翻译/时间提取加工。单场景、不分段。
  load_mode: truncate_table
