  field_logics:
    user_phone_processed: 手机号脱敏：保留前3位和后4位，中间以 **** 屏蔽
    gender_processed: 性别代码翻译：M→男、F→女、其余→未知
    age_processed: 年龄：以当前年份减去出生日期所在年份计算
    id_card_masked_processed: 身份证号脱敏：保留前6位和后4位，中间以 ******** 屏蔽
    user_status_name_processed: 用户状态翻译：ACTIVE→正常、INACTIVE→未激活、BANNED→封禁、其余→未知
    register_date_processed: 注册日期：取注册时间的日期部分
    register_hour_processed: 注册小时：取注册时间的小时部分（0-23）
    register_weekday_processed: 注册星期：取注册时间为星期几
    last_login_date_processed: 最后登录日期：取最后登录时间的日期部分
    is_vip_processed: 是否VIP：VIP到期时间晚于当前时间判为1，否则为0
    progress_percentage: 升级进度百分比：当前等级积分除以升级所需积分再乘以100
  source_aliases:
  - oub
  - dul
  - drd
  - dus
  ctes: []
  grain:
    input: 一行=一个用户（ods.ods_user_basic_f）
    output: 一行=一个用户画像记录
    change: 无变化
  joins:
  - alias: oub
    type: main
    condition: 主表（粒度锚点：用户）
    filter: ''
  - alias: dul
    type: LEFT JOIN
    condition: oub.level_id = dul.level_id
    filter: ''
  - alias: drd
    type: LEFT JOIN
    condition: oub.province_code = drd.region_code
    filter: ''
  - alias: dus
    type: LEFT JOIN
    condition: oub.source_id = dus.source_id
    filter: ''
  join_safety:
  - table: dim.dim_user_level_d
    join_key_unique: true
    strategy: 直接关联
    reason: 用户等级维度按 level_id 唯一，与主表等级键一对一，LEFT JOIN 不发散
  - table: dim.dim_region_d
    join_key_unique: true
    strategy: 直接关联
    reason: 地区维度按 region_code 唯一，主表按 province_code 关联，一对一不发散
  - table: dim.dim_user_source_d
    join_key_unique: true
    strategy: 直接关联
    reason: 用户来源维度按 source_id 唯一，与主表来源键一对一，LEFT JOIN 不发散
complexity_analysis:
  join_count: 3
  has_grain_change: false
  grain_change_detail: ''
  multi_step_fields: 0
  aggregation_after_join: false
  segmentation_decision: 不分段
  segmentation_reason: 仅3张维度表关联（远低于12表阈值），无粒度变化、无聚合、无聚合后关联，字段加工均为单步直接加工（脱敏/翻译/时间提取），单条INSERT即可完成，无需中间表或CTE
distribution_key:
- user_id
business_key:
