# ============================================================================
# design_decisions.yaml - 交易宽表 dwb_trade_wide_f 设计决策
# ----------------------------------------------------------------------------
# 极简单源表场景：仅 1 张源表 ods_trade_order_di(主表 o)，无 JOIN、无粒度变化、
# 无加工字段(全部直接复制或固定赋值)。单规则单条 INSERT 直产目标 F 表。
# 字段类型/来源/注释由 assemble_ts.py 从 rs_input.json 自动搬移。
# ============================================================================

# === 规则拆分（核心判断）===
rules:
  - rule_code: R0001
    rule_name: "交易宽表全量装配"
    scenario: "default"
    exec_sequence: 1
    target_table: "dwb_trade_wide_f"
    is_view_step: false
    design_intent: "单源表无JOIN，字段全部直接复制或固定赋值，无粒度变化，单条INSERT直产目标F表"
    load_mode: "truncate_table"          # 全量调度，全量覆盖

    # 该规则管所有 8 个目标字段(4 直取 + 4 审计)
    field_targets:
      # --- 直取(直接复制)字段，脚本自动填 design_logic ---
      - order_id
      - cust_id
      - product_id
      - order_amt
      # --- 审计字段(赋值)，脚本自动处理，不写 field_logics ---
      - del_flag
      - crt_cycle_id
      - last_upd_cycle_id
      - dw_last_update_date

    # ★ 本规则无加工类业务字段，field_logics 留空。
    # 直取字段(直接复制)脚本自动填 "直取 o.{column}"；
    # 审计字段(赋值)脚本自动从 rs_input 的 transform_detail 搬入
    # ('N' / '${P_CYCLE_ID}' / CURRENT_TIMESTAMP)。
    field_logics: {}

    # 关联的源表别名(脚本据此从 rs_input 补 schema/table)
    source_aliases:
      - o

    # CTE：单源表无聚合/无维表取最新行，无需 CTE
    ctes: []

    # 粒度变化(输入→输出)
    grain:
      input: "一行=一个订单(源 ods_trade_order_di)"
      output: "一行=一个订单(dwb_trade_wide_f)"
      change: "无变化"

    # 关联策略：仅主表 o，无其他关联
    joins:
      - alias: "o"
        type: "main"
        condition: ""
        filter: ""

    # 关联安全分析(JOIN键唯一性 → 对齐策略)
    join_safety:
      - table: "o"
        join_key_unique: true
        strategy: ""
        reason: "主表，order_id 为业务主键，唯一"

# === 复杂度分析与分段决策 ===
complexity_analysis:
  join_count: 0                          # 单源表，无 JOIN
  has_grain_change: false                # 输入输出均一行=一个订单
  grain_change_detail: "输入输出粒度一致，均一行=一个订单"
  multi_step_fields: 0                   # 无多步骤加工字段
  aggregation_after_join: false          # 无聚合
  segmentation_decision: "不分段"
  segmentation_reason: "单源表无JOIN、无粒度变化、无多步骤加工字段、无聚合，复杂度远低于分段阈值，单条INSERT搞定，无需中间表/CTE"

# === 分布键(designer 判断，参考 design-guide.md §2.1)===
# order_id 为业务主键、高基数 → 单表直产也按主键分布，与下游宽表惯例对齐
distribution_key:
  - order_id

# === 业务主键(业务唯一字段组合，供 UT 主键唯一检查)===
business_key:
  - order_id

# 主键设计说明
# rs_input 备注列标注 order_id 为"主键"；产出粒度一行=一个订单，
# order_id 在产出表下唯一，无需补充字段调整主键。
business_key_design:
  input_key:
    - order_id
  adjusted: false
  reason: ""

# === 调度细化(RS给大框架 → designer细化)===
schedule:
  task_name: "dws_dwb_trade_wide_f_d"
  cron: "0 30 3 * * ?"                    # T+1 日级，SLA 3:30 → 分 时 日 月 周 ?
  task_group: "dwb_trade"
  project: "dws"
  # 设计未新增中间表，无新增上游依赖(rs_input 已有的上游脚本自动带)
  upstream_added: []

# === 数据流(规则间关系)===
data_flow:
  dependencies: []                       # 单规则，无规则间依赖
  schedule_groups:
    - sequence: 1
      rules: ["R0001"]

# === DQ(可选，本表暂无设计级 DQ 要求)===
dq_rules: []
