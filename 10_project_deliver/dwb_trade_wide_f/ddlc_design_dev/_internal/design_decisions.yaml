# ============================================================================
# design_decisions.yaml - 设计决策（designer agent 产出）
# 资产：dws.dwb_trade_wide_f（交易宽表）
# ----------------------------------------------------------------------------
# 单源主表直加载：无关联、无加工、无粒度变化。
# 全部字段为直接复制或审计赋值， assembler 自动填充 design_logic。
# ============================================================================

# === 参数声明（资产级统一声明）===
# P_CYCLE_ID(批次号) 由脚本自动注入，无需在此声明。
# 本资产无业务参数（全量调度，无增量起止时间/会计期等场景参数）。
params: []

# === 规则拆分（核心判断）===
# 单规则：单源主表直加载，无分段。
rules:
  - rule_code: R0001
    rule_name: "交易宽表主表加载"
    scenario: "default"
    exec_sequence: 1
    target_table: "dws.dwb_trade_wide_f"
    is_view_step: false
    design_intent: "单源主表直加载，无关联无加工，全量覆盖写入目标F表。"
    load_mode: "truncate_table"

    # 覆盖 rs_input 全部 8 个 target_column
    field_targets:
      - order_id
      - cust_id
      - product_id
      - order_amt
      - del_flag
      - crt_cycle_id
      - last_upd_cycle_id
      - dw_last_update_date

    # 不写 field_logics：4 个字段为直接复制（assembler 自动填"直取 o.<col>"），
    # 4 个为审计赋值字段（assembler 自动从 rs_input.transform_detail 取值）。
    field_logics: {}

    # 关联源表别名（主表）
    source_aliases:
      - "o"

    # CTE：无
    ctes: []

    # 粒度变化：输入输出均为"一行=一个订单"，无变化
    grain:
      input: "一行=一个订单"
      output: "一行=一个订单"
      change: "无变化"

    # 关联策略：仅主表，无 JOIN
    joins:
      - alias: "o"
        type: "main"
        condition: ""
        filter: ""

    # 关联安全分析：单主表无 JOIN，无发散风险
    join_safety: []

# === 复杂度分析与分段决策 ===
complexity_analysis:
  join_count: 0
  has_grain_change: false
  grain_change_detail: ""
  multi_step_fields: 0
  aggregation_after_join: false
  segmentation_decision: "不分段"
  segmentation_reason: "单源主表无关联（join_count=0），无粒度变化，所有字段为直接复制或审计赋值，单条 INSERT 即可完成，无需中间表/分段。"

# === 表物理属性（per-table）===
tables:
  # 目标F表：分布键取业务主键 order_id（高基数，避免倾斜）
  dwb_trade_wide_f:
    distribution_key:
      - order_id
    distribute_type: HASH

# === 业务主键（业务唯一字段组合，供 UT 主键唯一检查）===
# order_id 在"每行一个订单"粒度下唯一，无需调整。
business_key:
  - order_id

business_key_design:
  input_key:
    - order_id
  adjusted: false
  reason: ""

# === 调度细化 ===
schedule:
  # F表任务名
  task_name: "DWS_DWB_TRADE_WIDE_F"
  # SLA 3:30，T+1 一天一调，cron 细化为每日 03:00 执行（SLA 前完成）
  cron: "0 0 3 * * ?"

  # LTS 调度参数（运行时生成值，赋值给术加 ETL 参数）
  lts_params:
    - lts_var: "V_CYCLE_ID"
      etl_param: "P_CYCLE_ID"
      desc: "批次号"
    - lts_var: "V_GROUP_CODE"
      etl_param: ""
      desc: "规则组编码"

  # 设计新增的上游依赖：无（单源主表，rs_input.upstream 已为空）
  upstream_added: []

  # I 视图调度：标准 F 镜像视图，无需独立直封调度任务
  view:
    task_name: ""
    cron: ""

# === 数据流（规则间关系）===
data_flow:
  # 依赖：单规则，无规则间数据流
  dependencies: []
  # 执行顺序：单一顺序组
  schedule_groups:
    - sequence: 1
      rules:
        - R0001

# === DQ（可选）===
# rs_input 未声明 DQ 需求
dq_rules: []
