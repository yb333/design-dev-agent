# ============================================================================
# design_decisions.yaml - 售后服务中心宽表 (dwb_after_sale_center_f)
# ----------------------------------------------------------------------------
# 单场景、单规则：退款事实表为主表，左关联订单/用户/商品/工单四表拼装宽表。
# 复杂度低（4 JOIN、无粒度变化、加工字段为内联表达式），不分段。
# ============================================================================

# === 参数声明 ===
# P_CYCLE_ID 由脚本自动注入，无业务参数。
params: []

# === 规则拆分 ===
rules:
  - rule_code: R0001
    rule_name: 售后服务中心宽表装配
    scenario: default
    exec_sequence: 1
    target_table: dwb_after_sale_center_f
    is_view_step: false
    design_intent: 以退款事实表为主表，左关联订单/用户/商品/工单四表，一次性拼装售后服务中心宽表全量字段；单场景全量覆盖，无分段
    load_mode: truncate_table

    # 该规则产出全部 24 个目标字段（15直取 + 5加工 + 4审计）
    field_targets:
      # --- 退款主表直取 ---
      - refund_id
      - refund_no
      - apply_time
      - complete_time
      - refund_amount
      - refund_reason
      - order_id
      - user_id
      - product_id
      # --- 订单表直取 ---
      - order_no
      - order_pay_amount
      # --- 用户维表直取 ---
      - user_name
      # --- 商品维表直取 ---
      - product_name
      # --- 工单表直取 ---
      - ticket_id
      - handler_name
      # --- 加工字段 ---
      - refund_type_name
      - refund_status_name
      - ticket_status_name
      - process_days
      - refund_rate
      # --- 审计字段 ---
      - del_flag
      - crt_cycle_id
      - last_upd_cycle_id
      - dw_last_update_date

    # 仅加工类字段写 design_logic（自然语言口径，不含 SQL）
    # 直取字段不写——脚本自动填；审计字段不写——脚本自动处理
    field_logics:
      refund_type_name: "退款类型码值转换：ONLY_REFUND→仅退款，RETURN_REFUND→退货退款，EXCHANGE→换货，其余→其他"
      refund_status_name: "退款状态码值转换：APPLYING→申请中，APPROVED→已同意，SUCCESS→退款成功，REJECTED→已拒绝，其余→其他"
      ticket_status_name: "工单状态码值转换：PENDING→待处理，PROCESSING→处理中，RESOLVED→已解决，CLOSED→已关闭，其余→其他"
      process_days: "处理天数=完成时间与申请时间相差天数；完成时间为空时按当天计算（COALESCE 兜底当前日期）"
      refund_rate: "退款比例(%)=退款金额 / 订单实付金额 × 100；订单实付金额为空或为0时需防除零"

    # 关联全部 5 张源表（留空则脚本默认取 rs_input 全部，显式声明更清晰）
    source_aliases:
      - drf
      - dof
      - duf
      - dpf
      - dst

    ctes: []

    grain:
      input: "一行=一条退款记录（退款事实表粒度）"
      output: "一行=一条售后服务记录（退款粒度）"
      change: "无变化"

    joins:
      - alias: drf
        type: main
        condition: ""
        filter: ""
      - alias: dof
        type: LEFT JOIN
        condition: "drf.order_id = dof.order_id"
        filter: ""
      - alias: duf
        type: LEFT JOIN
        condition: "drf.user_id = duf.user_id"
        filter: ""
      - alias: dpf
        type: LEFT JOIN
        condition: "drf.product_id = dpf.product_id"
        filter: ""
      - alias: dst
        type: LEFT JOIN
        condition: "drf.refund_id = dst.refund_id"
        filter: ""

    # 关联安全分析：维表主键唯一安全；两张事实表存在 JOIN 键发散风险
    join_safety:
      - table: dim_user_f
        join_key_unique: true
        strategy: ""
        reason: "维度表，user_id 为主键唯一"
      - table: dim_product_f
        join_key_unique: true
        strategy: ""
        reason: "维度表，product_id 为主键唯一"
      - table: dwd_order_f
        join_key_unique: false
        strategy: "若 order_id 在订单明细表不唯一（多商品行），需先按 order_id 聚合到订单粒度（取订单号、汇总实付金额）再关联，避免退款行发散"
        reason: "源表名为'订单明细事实表'，order_id 可能在行级不唯一；mapping 按订单粒度直取 order_no/pay_amount，隐含 1:1 假设，需数据探查确认"
      - table: dwd_service_ticket_f
        join_key_unique: false
        strategy: "若一个退款存在多张工单，取最新一条有效工单（按工单创建时间倒序取首条），保证每个退款 1:1 关联"
        reason: "工单表按 refund_id 关联，一笔退款可能产生多张工单；mapping 直取 ticket_id/handler_name 隐含 1:1 假设，需数据探查确认"

# === 复杂度分析与分段决策 ===
complexity_analysis:
  join_count: 4
  has_grain_change: false
  grain_change_detail: ""
  multi_step_fields: 2
  aggregation_after_join: false
  segmentation_decision: "不分段"
  segmentation_reason: "4 个 JOIN 远低于 12 阈值；无粒度变化（退款粒度进→退款粒度出）；2 个加工字段（process_days/refund_rate）为内联单步表达式（码值映射/简单运算），无需先聚合再关联；单条 INSERT 可一次写对，不建中间表"

# === 表物理属性 ===
tables:
  dwb_after_sale_center_f:
    distribution_key: [refund_id]
    distribute_type: HASH

# === 业务主键 ===
business_key: [refund_id]

business_key_design:
  input_key: [refund_id]
  adjusted: false
  reason: ""

# === 调度细化 ===
schedule:
  task_name: "dw_slas_dwb_after_sale_center_f"
  cron: "0 30 3 * * ?"

  lts_params:
    - lts_var: "V_CYCLE_ID"
      etl_param: "P_CYCLE_ID"
      desc: "批次号"
    - lts_var: "V_GROUP_CODE"
      etl_param: ""
      desc: "规则组编码"

  upstream_added: []

  view:
    task_name: "dw_slas_dwb_after_sale_center_i"
    cron: "0 35 3 * * ?"

# === 数据流 ===
data_flow:
  dependencies: []
  schedule_groups:
    - sequence: 1
      rules: ["R0001"]

# === DQ ===
dq_rules: []
