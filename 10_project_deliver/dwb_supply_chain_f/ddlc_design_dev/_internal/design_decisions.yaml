# ============================================================================
# design_decisions.yaml - 供应链中心宽表 设计决策
# ----------------------------------------------------------------------------
# 目标表: slscc.dwb_supply_chain_center_f / _i
# 设计要点:
#   - 单规则（R0001），不分段（6张JOIN、1个多步骤字段，均低于分段阈值）
#   - stock_days 需 dsales 预聚合 → CTE 内联（仅本规则用一次，无需物理中间表）
#   - 主表 dwd_purchase_f 为粒度锚点，其余表 LEFT JOIN 补充维度/库存/销售指标
# ============================================================================

# === 参数声明（资产级统一声明）===
# P_CYCLE_ID 由脚本自动注入，无需在此声明。
# 本表全量调度，无业务参数。
params: []

# === 规则拆分 ===
rules:
  - rule_code: R0001
    rule_name: "供应链中心宽表写入"
    scenario: "default"
    exec_sequence: 1
    target_table: "slscc.dwb_supply_chain_center_f"
    is_view_step: false
    design_intent: "以采购事实表(dp)为主表锚定粒度，LEFT JOIN 供应商/商品/仓库维度表补充属性，LEFT JOIN 库存事实表取当前库存与锁定库存，通过CTE预聚合销售表按product_id统计近30天销量后关联，计算库存周转天数，写入供应链中心宽表"
    load_mode: "truncate_table"

    # 该规则产出全部23个目标字段（19业务 + 4审计）
    field_targets:
      # --- 采购主表字段 ---
      - purchase_id
      - purchase_no
      - purchase_status_name
      - create_time
      - supplier_id
      - product_id
      - purchase_qty
      - purchase_price
      - purchase_amount
      - warehouse_id
      # --- 供应商维度 ---
      - supplier_name
      - supplier_level_name
      - cooperation_years
      # --- 商品维度 ---
      - product_name
      # --- 仓库维度 ---
      - warehouse_name
      - warehouse_type_name
      # --- 库存事实 ---
      - current_stock_qty
      - locked_qty
      # --- 销售指标（CTE产出） ---
      - stock_days
      # --- 审计字段 ---
      - del_flag
      - crt_cycle_id
      - last_upd_cycle_id
      - dw_last_update_date

    # ★ 仅加工类字段写 design_logic（直取字段脚本自动填，审计字段脚本自动处理）
    field_logics:
      purchase_status_name: "采购状态码转中文映射：DRAFT→草稿，SUBMITTED→已提交，APPROVED→已审批，RECEIVED→已入库，CLOSED→已关闭，其余→其他"
      supplier_level_name: "供应商等级码转中文映射：A→A级供应商，B→B级供应商，C→C级供应商，其余→其他"
      purchase_amount: "采购金额 = 采购数量(purchase_qty) × 采购单价(purchase_price)"
      warehouse_type_name: "仓库类型码转中文映射：SELF→自营仓，THIRD_PARTY→第三方仓，其余→其他"
      stock_days: "库存周转天数 = (当前库存 - 锁定库存) / 近30天日均销量。近30天销量通过CTE(sales_agg)对销售表按product_id聚合SUM得到，除零保护用NULLIF(sales_qty_30d, 0)，结果为NULL或零时库存周转天数取NULL"

    # 关联全部6张源表（留空则脚本默认用 rs_input 全部 source_tables）
    source_aliases: []

    # CTE：销售表预聚合（避免JOIN发散）
    ctes:
      - name: "sales_agg"
        purpose: "对销售事实表(dwd_sales_f)按product_id聚合SUM统计近30天销量(sales_qty_30d)，产出商品粒度的销量汇总，避免销售明细JOIN到采购主表时发散"
        source_tables: ["sdinv.dwd_sales_f"]

    # 粒度变化
    grain:
      input: "采购事实表每行=一个采购单(dp为主表)；销售事实表每行=一笔销售明细(dsales需聚合)"
      output: "每行=一个采购单（供应链记录）"
      change: "主表粒度不变；dsales从销售明细聚合到商品粒度后关联"

    # 关联策略
    joins:
      - alias: "dpf"
        type: "main"
        condition: "采购事实表（粒度锚点：采购单）"
        filter: ""
      - alias: "dsf"
        type: "LEFT JOIN"
        condition: "dpf.supplier_id = dsf.supplier_id"
        filter: ""
      - alias: "dpf2"
        type: "LEFT JOIN"
        condition: "dpf.product_id = dpf2.product_id"
        filter: ""
      - alias: "dwf"
        type: "LEFT JOIN"
        condition: "dpf.warehouse_id = dwf.warehouse_id"
        filter: ""
      - alias: "dif"
        type: "LEFT JOIN"
        condition: "dpf.product_id = dif.product_id AND dpf.warehouse_id = dif.warehouse_id"
        filter: ""
      - alias: "sales_agg"
        type: "LEFT JOIN"
        condition: "dpf.product_id = sales_agg.product_id"
        filter: "CTE预聚合结果，已按product_id收敛唯一"

    # 关联安全分析
    join_safety:
      - table: "dim_supplier_f"
        join_key_unique: true
        strategy: "直接关联"
        reason: "供应商维度表按supplier_id唯一"
      - table: "dim_product_f"
        join_key_unique: true
        strategy: "直接关联"
        reason: "商品维度表按product_id唯一"
      - table: "dim_warehouse_f"
        join_key_unique: true
        strategy: "直接关联"
        reason: "仓库维度表按warehouse_id唯一"
      - table: "dwd_inventory_f"
        join_key_unique: true
        strategy: "直接关联"
        reason: "库存事实表按product_id+warehouse_id粒度取当前库存快照（stock_qty/locked_qty为当前状态值），假设唯一；若存在批次级库存需改为GROUP BY收敛"
      - table: "dwd_sales_f"
        join_key_unique: false
        strategy: "CTE预聚合收敛"
        reason: "销售事实表按product_id不唯一（每笔销售一行），需通过CTE(sales_agg)先按product_id聚合SUM后再关联"

# === 复杂度分析与分段决策 ===
complexity_analysis:
  join_count: 6                           # 1主表 + 5 LEFT JOIN
  has_grain_change: true                  # dsales 需预聚合（粒度变化）
  grain_change_detail: "销售事实表(dwd_sales_f)从销售明细粒度聚合到商品粒度(sales_agg CTE)后关联主表"
  multi_step_fields: 1                    # stock_days（先聚合再计算）
  aggregation_after_join: false           # 聚合在JOIN前（CTE内先聚合再关联）
  segmentation_decision: "不分段"
  segmentation_reason: "JOIN≤12（6张）、多步骤加工字段<5（1个：stock_days）、无复杂关联链；dsales聚合满足CTE内联条件（仅本规则内用一次、无需独立校验），不建物理中间表"

# === 表物理属性 ===
tables:
  dwb_supply_chain_center_f:
    distribution_key: [purchase_id]       # 高基数主键，主表JOIN锚点字段
    distribute_type: HASH

# === 业务主键 ===
business_key: [purchase_id]

business_key_design:
  input_key: [purchase_id]                # rs_input 备注标注"主键"
  adjusted: false
  reason: ""

# === 调度细化 ===
schedule:
  task_name: "task_dwb_supply_chain_center_f"
  cron: "0 30 3 * * ?"                     # SLA 3:30，T+1日级调度

  lts_params:
    - lts_var: "V_CYCLE_ID"
      etl_param: "P_CYCLE_ID"
      desc: "批次号"
    - lts_var: "V_GROUP_CODE"
      etl_param: ""
      desc: "规则组编码"

  upstream_added: []

  # I 视图调度（F表镜像，晚5分钟确保F表完成）
  view:
    task_name: "task_dwb_supply_chain_center_i"
    cron: "0 35 3 * * ?"

# === 数据流 ===
data_flow:
  dependencies: []                         # 单规则，无规则间依赖
  schedule_groups:
    - sequence: 1
      rules: ["R0001"]

# === DQ ===
dq_rules: []
