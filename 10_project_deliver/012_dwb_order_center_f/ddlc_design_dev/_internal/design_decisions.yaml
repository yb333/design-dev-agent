# ============================================================================
# design_decisions.yaml - 订单中心宽表 设计决策
# ----------------------------------------------------------------------------
# 目标表: slord.dwb_order_center_f (订单中心宽表)
# 粒度: 每行一个订单 | 全量调度 T+1 | SLA 3:30
# 字段详情（类型/注释/来源字段）由 assemble_ts.py 从 rs_input.json 自动搬移。
# ============================================================================

rules:
  # ===== R0001 用户画像中间表 =====
  - rule_code: R0001
    rule_name: 用户画像聚合
    scenario: default
    exec_sequence: 1
    target_table: dwb_order_center_user_tmp1
    is_view_step: false
    design_intent: >
      收口所有按 user_id 聚合的用户级指标（历史订单统计、消费金额、RFM 分层、
      常用支付方式、优惠券使用、退款次数、偏好活动类型等），避免在主 INSERT 中
      混入聚合后关联逻辑。中间表粒度=一个用户一行，以 user_id 为关联键供主规则 JOIN。

    field_targets:
      - first_order_time
      - last_order_time
      - history_order_cnt
      - history_pay_amount
      - history_discount_amount
      - avg_order_amount
      - rfm_segment
      - is_repeat_user
      - fav_pay_method
      - user_coupon_used_cnt
      - user_refund_cnt
      - user_fav_activity_type

    field_logics:
      first_order_time: "以 user_id 分组汇总 dwd_order_f 全部历史订单，取最早的下单时间作为首次下单时间"
      last_order_time: "以 user_id 分组汇总 dwd_order_f 全部历史订单，取最近的下单时间作为最近下单时间"
      history_order_cnt: "以 user_id 分组统计 dwd_order_f 历史订单总数"
      history_pay_amount: "以 user_id 分组对 dwd_order_f 实付金额求和，得到历史消费总额"
      history_discount_amount: "以 user_id 分组对 dwd_order_f 优惠金额求和，得到历史优惠总额"
      avg_order_amount: "历史消费金额除以历史订单数，得到平均客单价"
      rfm_segment: "根据最近下单时间计算 R 值(1-5 分)、历史订单数计算 F 值(1-5 分)、历史消费金额计算 M 值(1-5 分)，三者组合得到用户 RFM 分层标签"
      is_repeat_user: "历史订单数大于等于 2 则标记为复购用户(Y)，否则为非复购用户(N)"
      fav_pay_method: "以 user_id 分组汇总 dwd_payment_f 历史成功支付记录，取使用频次最高的支付方式作为常用支付方式"
      user_coupon_used_cnt: "以 user_id 分组对 dwd_coupon_use_f 已使用的优惠券去重计数，得到用户历史优惠券使用次数"
      user_refund_cnt: "以 user_id 分组统计 dwd_refund_f 历史成功退款次数"
      user_fav_activity_type: "以 user_id 分组汇总 dwd_order_f 参与的活动，取参与订单数最多的活动类型作为用户偏好活动类型"

    source_aliases: [dof, dpf, dcu, drf17]

    grain:
      input: "多源事实表(dwd_order_f/dwd_payment_f/dwd_coupon_use_f/dwd_refund_f)每个用户的多行"
      output: "一行=一个用户(user_id)"
      change: "多行聚合"

    joins:
      - alias: dof
        type: "聚合源"
        condition: "GROUP BY user_id"
        filter: "order_status NOT IN ('CANCELLED','DELETED')"
      - alias: dpf
        type: "聚合源"
        condition: "GROUP BY user_id"
        filter: "pay_status='SUCCESS'"
      - alias: dcu
        type: "聚合源"
        condition: "GROUP BY user_id"
        filter: "use_status='USED'"
      - alias: drf17
        type: "聚合源"
        condition: "GROUP BY user_id"
        filter: "refund_status='SUCCESS'"

    join_safety:
      - table: dwd_order_f
        join_key_unique: true
        strategy: "GROUP BY user_id 收敛为每用户一行"
        reason: "聚合后天然唯一"
      - table: dwd_payment_f
        join_key_unique: true
        strategy: "GROUP BY user_id 收敛"
        reason: "聚合后天然唯一"
      - table: dwd_coupon_use_f
        join_key_unique: true
        strategy: "GROUP BY user_id 收敛"
        reason: "聚合后天然唯一"
      - table: dwd_refund_f
        join_key_unique: true
        strategy: "GROUP BY user_id 收敛"
        reason: "聚合后天然唯一"

  # ===== R0002 商品画像中间表 =====
  - rule_code: R0002
    rule_name: 商品画像聚合
    scenario: default
    exec_sequence: 1
    target_table: dwb_order_center_prod_tmp2
    is_view_step: false
    design_intent: >
      收口按 product_id 聚合的商品级累计销量与销售额指标。中间表粒度=一个商品一行，
      以 product_id 为关联键供主规则 JOIN。

    field_targets:
      - product_sales_cnt
      - product_sales_amount

    field_logics:
      product_sales_cnt: "以 product_id 分组汇总 dwd_order_detail_f，对购买数量求和得到商品累计销量"
      product_sales_amount: "以 product_id 分组汇总 dwd_order_detail_f，对实付单价乘以数量求和得到商品累计销售额"

    source_aliases: [dod]

    grain:
      input: "dwd_order_detail_f 同一商品的多行明细"
      output: "一行=一个商品(product_id)"
      change: "多行聚合"

    joins:
      - alias: dod
        type: "聚合源"
        condition: "GROUP BY product_id"
        filter: "del_flag='N'"

    join_safety:
      - table: dwd_order_detail_f
        join_key_unique: true
        strategy: "GROUP BY product_id 收敛为每商品一行"
        reason: "聚合后天然唯一"

  # ===== R0003 店铺画像中间表 =====
  - rule_code: R0003
    rule_name: 店铺画像聚合
    scenario: default
    exec_sequence: 1
    target_table: dwb_order_center_shop_tmp3
    is_view_step: false
    design_intent: >
      收口按 shop_id 聚合的店铺历史订单数指标。中间表粒度=一个店铺一行，
      以 shop_id 为关联键供主规则 JOIN。

    field_targets:
      - shop_history_order_cnt

    field_logics:
      shop_history_order_cnt: "以 shop_id 分组统计 dwd_order_f 历史订单总数"

    source_aliases: [dof]

    grain:
      input: "dwd_order_f 同一店铺的多行订单"
      output: "一行=一个店铺(shop_id)"
      change: "多行聚合"

    joins:
      - alias: dof
        type: "聚合源"
        condition: "GROUP BY shop_id"
        filter: "order_status NOT IN ('CANCELLED','DELETED')"

    join_safety:
      - table: dwd_order_f
        join_key_unique: true
        strategy: "GROUP BY shop_id 收敛为每店铺一行"
        reason: "聚合后天然唯一"

  # ===== R0004 主宽表组装 =====
  - rule_code: R0004
    rule_name: 订单中心宽表主组装
    scenario: default
    exec_sequence: 2
    target_table: dwb_order_center_f
    is_view_step: false
    design_intent: >
      以 dwd_order_f(订单主事实，order_id 粒度)为骨架，LEFT JOIN 订单明细(取第一条主商品)、
      支付(取最新成功)、物流(取最新)、优惠券(取一条)、退款(取最新成功退款)及全部维度表，
      并关联 R0001/R0002/R0003 三张画像中间表，一次性组装出订单中心宽表全部字段。
      所有直取维度字段、码值翻译、脱敏、地址拼接、时长计算、订单级标识均在此规则产出。

    field_targets:
      # 订单基本信息
      - order_id
      - order_no
      - order_status
      - order_status_name
      - order_time
      - order_date
      - order_source_name
      - order_type_name
      - order_remark
      - total_amount
      - product_amount
      - pay_amount
      - discount_amount
      - freight_amount
      - product_cnt
      - product_qty
      # 物流时效
      - ship_time
      - receive_time
      - delivery_days
      # 用户维度
      - user_id
      - user_name
      - user_phone_masked
      - user_email_masked
      - gender_name
      - user_birthday
      - user_age
      - user_register_time
      - user_level_id
      - user_level_name
      - member_points
      - member_balance
      - user_tag
      - user_source_name
      - user_province_code
      - user_city_code
      - user_days
      # 商品维度
      - product_id
      - product_name
      - product_code
      - sku_code
      - category_l1_id
      - category_l1_name
      - category_l2_id
      - category_l2_name
      - category_l3_id
      - category_l3_name
      - brand_id
      - brand_name
      - brand_origin
      - product_attr
      - product_spec
      - product_weight
      - product_volume
      - cost_price
      - sale_price
      - real_price
      - product_tag
      - product_status_name
      - product_profit
      # 店铺维度
      - shop_id
      - shop_name
      - shop_type_name
      - shop_level_name
      - shop_score
      - company_name
      - shop_province_code
      - shop_province_name
      - shop_city_code
      - shop_city_name
      - shop_open_time
      # 收货地址
      - receiver_name
      - receiver_phone_masked
      - receiver_province_code
      - receiver_province_name
      - receiver_city_code
      - receiver_city_name
      - receiver_district_code
      - receiver_district_name
      - receiver_street
      - receiver_address
      - full_address
      - postal_code
      - address_tag_name
      - longitude
      - latitude
      # 支付信息
      - pay_time
      - pay_id
      - pay_no
      - pay_method_code
      - pay_method_name
      - pay_channel_name
      - pay_status_name
      - bank_card_masked
      - bank_name
      - installment_num
      - pay_service_fee
      - pay_duration_minutes
      # 物流信息
      - logistics_id
      - logistics_no
      - logistics_company_code
      - logistics_company_name
      - logistics_type_name
      - warehouse_id
      - warehouse_name
      - warehouse_address
      - logistics_status_name
      - pickup_time
      - sign_receiver_name
      - ship_duration_hours
      # 优惠券/营销
      - coupon_id
      - coupon_name
      - coupon_type_name
      - coupon_amount
      - activity_id
      - activity_name
      - activity_type_name
      - activity_discount_rate
      - full_reduce_amount
      - points_deduct_amount
      - points_used
      - is_marketing_order
      - total_discount_amount
      # 退款信息
      - refund_id
      - refund_no
      - refund_type_name
      - refund_reason
      - refund_amount
      - refund_status_name
      - refund_apply_time
      - refund_complete_time
      - is_refund_order
      # 审计字段
      - del_flag
      - crt_cycle_id
      - last_upd_cycle_id
      - dw_last_update_date

    field_logics:
      order_status_name: "订单状态码翻译为中文：PAID-已支付/SHIPPED-已发货/RECEIVED-已签收/CANCELLED-已取消/其他"
      delivery_days: "签收时间减去发货时间，得到物流在途天数"
      order_source_name: "订单来源码翻译为中文：APP-APP端/WEB-网页端/MINIAPP-小程序/H5-H5页面/其他"
      order_type_name: "订单类型码翻译为中文：NORMAL-普通订单/PRESALE-预售订单/GROUPBUY-团购订单/SECKILL-秒杀订单/其他"
      order_date: "下单时间截取到日期"
      user_phone_masked: "用户手机号脱敏，保留前3位和后4位，中间用****替代"
      user_email_masked: "用户邮箱脱敏，保留前2位和@后域名，中间用***替代"
      gender_name: "性别码翻译：M-男/F-女/其他-未知"
      user_age: "当前年份减去用户出生年份，得到用户年龄"
      user_source_name: "用户来源码翻译：NATURAL-自然流量/AD-广告投放/REFERRAL-推荐注册/ACTIVITY-活动引流/其他"
      user_days: "当前日期减去注册时间，得到用户注册天数"
      category_l2_id: "经商品维表关联到分类维表，按 parent_id 上溯得到二级类目ID"
      category_l2_name: "按二级类目ID关联分类维表取二级类目名称"
      category_l3_id: "经商品维表关联到分类维表，按 parent_id 两次上溯得到三级类目ID"
      category_l3_name: "按三级类目ID关联分类维表取三级类目名称"
      product_status_name: "商品状态码翻译：ON_SHELF-上架/OFF_SHELF-下架/SOLD_OUT-售罄/其他"
      product_profit: "商品售价减去成本价，得到单品毛利"
      shop_type_name: "店铺类型码翻译：FLAGSHIP-旗舰店/SPECIALTY-专卖店/FRANCHISE-专营店/OFFICIAL-官方店/其他"
      shop_level_name: "店铺等级数值前拼接 'Lv.' 前缀"
      shop_province_name: "经店铺维表关联地区维表，按省份编码取省份名称"
      shop_city_name: "经店铺维表关联地区维表，按城市编码取城市名称"
      receiver_phone_masked: "收货人手机号脱敏，保留前3位和后4位，中间用****替代"
      receiver_city_name: "经订单关联地区维表，按城市编码取城市名称"
      receiver_district_name: "经订单关联地区维表，按区县编码取区县名称"
      full_address: "收货省份、城市、区县、街道、详细地址顺序拼接为完整收货地址"
      address_tag_name: "地址标签码翻译：HOME-家/COMPANY-公司/SCHOOL-学校/其他"
      pay_channel_name: "经支付方式维表关联支付渠道表取支付渠道名称"
      pay_status_name: "支付状态码翻译：SUCCESS-支付成功/FAILED-支付失败/PENDING-支付中/未知"
      bank_card_masked: "银行卡号脱敏，仅保留后4位，前用****替代"
      pay_duration_minutes: "支付时间减去下单时间，换算为分钟，得到下单到支付时长"
      logistics_type_name: "经物流公司维表关联物流类型维度取物流类型名称"
      warehouse_address: "经仓库维表关联地区维表取发货仓库地址"
      logistics_status_name: "物流状态码翻译：PENDING-待发货/SHIPPED-已发货/IN_TRANSIT-运输中/DELIVERED-已签收/其他"
      ship_duration_hours: "发货时间减去支付时间，换算为小时，得到支付到发货时长"
      coupon_type_name: "优惠券类型码翻译：FULL_REDUCE-满减券/DISCOUNT-折扣券/CASH-现金券/FREIGHT-运费券/其他"
      activity_type_name: "活动类型码翻译：SECKILL-秒杀活动/GROUPBUY-团购活动/PRESALE-预售活动/FULL_GIFT-满赠活动/FULL_REDUCE-满减活动/其他"
      is_marketing_order: "判断订单是否存在优惠券ID或活动ID，存在则标记为营销订单(Y)，否则为非营销订单(N)"
      total_discount_amount: "优惠券金额、满减金额、积分抵扣金额三者求和，得到总优惠金额"
      refund_type_name: "退款类型码翻译：ONLY_REFUND-仅退款/RETURN_REFUND-退货退款/EXCHANGE-换货/其他"
      refund_status_name: "退款状态码翻译：APPLYING-申请中/APPROVED-已同意/SUCCESS-退款成功/REJECTED-已拒绝/其他"
      is_refund_order: "判断订单是否存在退款ID，存在则标记为退款订单(Y)，否则为非退款订单(N)"

    source_aliases: []  # 默认使用 rs_input 全部 source_tables + 画像中间表

    grain:
      input: "一行=一个订单(主事实 dwd_order_f)关联多维度"
      output: "一行=一个订单"
      change: "无变化"

    joins:
      - alias: dof
        type: "main"
        condition: "主事实骨架"
        filter: "order_status NOT IN ('CANCELLED','DELETED')"
      - alias: dod
        type: "LEFT JOIN"
        condition: "t.order_id=od.order_id"
        filter: "od.del_flag='N'"
      - alias: dpf
        type: "LEFT JOIN"
        condition: "t.order_id=pay.order_id"
        filter: "pay.pay_status='SUCCESS'"
      - alias: dlf
        type: "LEFT JOIN"
        condition: "t.order_id=log.order_id"
        filter: "log.del_flag='N'"
      - alias: dcu
        type: "LEFT JOIN"
        condition: "t.order_id=cu.order_id"
        filter: "cu.use_status='USED'"
      - alias: drf17
        type: "LEFT JOIN"
        condition: "t.order_id=rf.order_id"
        filter: "rf.refund_status='SUCCESS'"
      - alias: duf
        type: "LEFT JOIN"
        condition: "t.user_id=u.user_id"
        filter: ""
      - alias: dul
        type: "LEFT JOIN"
        condition: "u.level_id=ul.level_id"
        filter: ""
      - alias: dpf7
        type: "LEFT JOIN"
        condition: "od.product_id=p.product_id"
        filter: ""
      - alias: dpc
        type: "LEFT JOIN"
        condition: "p.category_id=pc.category_id(一级) → pc.parent_id=pc2.category_id(二级) → pc2.parent_id=pc3.category_id(三级)"
        filter: ""
      - alias: dbf
        type: "LEFT JOIN"
        condition: "p.brand_id=b.brand_id"
        filter: ""
      - alias: dsf
        type: "LEFT JOIN"
        condition: "t.shop_id=s.shop_id"
        filter: ""
      - alias: drf
        type: "LEFT JOIN"
        condition: "t.province_code=r1.region_code(省) / t.city_code=r2.region_code(市) / t.district_code=r3.region_code(县) / s.province_code / s.city_code"
        filter: ""
      - alias: dwf
        type: "LEFT JOIN"
        condition: "log.warehouse_id=wh.warehouse_id"
        filter: ""
      - alias: dpm
        type: "LEFT JOIN"
        condition: "pay.pay_method=pm.method_code"
        filter: ""
      - alias: dlc
        type: "LEFT JOIN"
        condition: "log.logistics_company=lc.company_code"
        filter: ""
      - alias: dcf
        type: "LEFT JOIN"
        condition: "cu.coupon_id=c.coupon_id"
        filter: ""
      - alias: daf
        type: "LEFT JOIN"
        condition: "t.activity_id=act.activity_id"
        filter: ""
      - alias: dwb_order_center_user_tmp1
        type: "LEFT JOIN"
        condition: "t.user_id=tmp1.user_id"
        filter: ""
      - alias: dwb_order_center_prod_tmp2
        type: "LEFT JOIN"
        condition: "od.product_id=tmp2.product_id"
        filter: ""
      - alias: dwb_order_center_shop_tmp3
        type: "LEFT JOIN"
        condition: "t.shop_id=tmp3.shop_id"
        filter: ""

    join_safety:
      - table: dwd_order_f
        join_key_unique: true
        strategy: ""
        reason: "主事实，order_id 为业务主键，限定非取消/删除状态后唯一"
      - table: dwd_order_detail_f
        join_key_unique: false
        strategy: "ROW_NUMBER() OVER(PARTITION BY order_id ORDER BY ...) 取第一条商品作为主商品"
        reason: "一个订单含多条商品明细，order_id 不唯一"
      - table: dwd_payment_f
        join_key_unique: false
        strategy: "ROW_NUMBER 取最新一条成功支付记录(pay_time 倒序)"
        reason: "一个订单可能多次支付，order_id 不唯一"
      - table: dwd_logistics_f
        join_key_unique: false
        strategy: "ROW_NUMBER 取最新一条物流信息"
        reason: "一个订单可能多条物流记录，order_id 不唯一"
      - table: dwd_coupon_use_f
        join_key_unique: false
        strategy: "ROW_NUMBER 取第一条已使用优惠券记录"
        reason: "一个订单可能使用多张优惠券，order_id 不唯一"
      - table: dwd_refund_f
        join_key_unique: false
        strategy: "ROW_NUMBER 取最新一条成功退款记录"
        reason: "一个订单可能多次退款，order_id 不唯一"
      - table: dim_user_f
        join_key_unique: true
        strategy: ""
        reason: "维度表按 user_id 主键关联"
      - table: dim_user_level_f
        join_key_unique: true
        strategy: ""
        reason: "维度表按 level_id 主键关联"
      - table: dim_product_f
        join_key_unique: true
        strategy: ""
        reason: "维度表按 product_id 主键关联"
      - table: dim_product_category_f
        join_key_unique: true
        strategy: ""
        reason: "分类维表按 category_id 主键多次自关联取一/二/三级类目"
      - table: dim_brand_f
