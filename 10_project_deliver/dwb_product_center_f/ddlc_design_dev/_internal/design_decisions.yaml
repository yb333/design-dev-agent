# ============================================================================
# design_decisions.yaml - 商品中心宽表 (dwb_product_center_f) 设计决策
# ----------------------------------------------------------------------------
# 39 个目标字段，7 张源表，7 个多步骤聚合字段（≥5 阈值）→ 分段
# 拆 3 个规则：R0001 订单聚合中间表 / R0002 评价聚合中间表 / R0003 主宽表关联
# ============================================================================

# === 规则拆分 ===
rules:
  # ---- R0001: 订单销售聚合中间表 ----
  - rule_code: R0001
    rule_name: 订单销售汇总
    scenario: default
    exec_sequence: 1
    target_table: dwb_product_center_tmp1
    is_view_step: false
    design_intent: >-
      从订单商品明细表按商品ID聚合销售指标，产出中间表供主规则关联。
      订单明细粒度（一行=一条明细）细于商品粒度，直接JOIN会导致行数发散，
      需先聚合收敛为商品粒度。
    load_mode: truncate_table

    field_targets:
      - total_sales_qty
      - total_sales_amount
      - buyer_cnt
      - sales_qty_30d

    field_logics:
      total_sales_qty: "从订单明细表按商品ID汇总累计销售数量，SUM(qty)"
      total_sales_amount: "从订单明细表按商品ID汇总累计销售额，SUM(real_price * qty)"
      buyer_cnt: "从订单明细表按商品ID统计去重购买用户数，COUNT(DISTINCT user_id)"
      sales_qty_30d: "从订单明细表按商品ID统计近30天销售数量，限定订单时间在当前日期前30天内，SUM(qty)"

    source_aliases:
      - dod

    grain:
      input: "一行=一条订单商品明细"
      output: "一行=一个商品的销售汇总"
      change: "多行聚合"

    joins:
      - alias: dod
        type: main
        condition: "从 dwd_order_detail_f 读取全部订单明细数据"
        filter: ""

    join_safety:
      - table: dwd_order_detail_f
        join_key_unique: false
        strategy: "GROUP BY product_id 收敛"
        reason: "订单明细表每个商品有多行明细记录，按 product_id 聚合收敛为一行"

  # ---- R0002: 评价聚合中间表 ----
  - rule_code: R0002
    rule_name: 评价汇总
    scenario: default
    exec_sequence: 1
    target_table: dwb_product_center_tmp2
    is_view_step: false
    design_intent: >-
      从评价事实表按商品ID聚合评价指标，产出中间表供主规则关联。
      评价粒度（一行=一条评价）细于商品粒度，直接JOIN会导致行数发散，
      需先聚合收敛为商品粒度。
    load_mode: truncate_table

    field_targets:
      - review_cnt
      - avg_rating
      - good_review_rate

    field_logics:
      review_cnt: "从评价表按商品ID统计评价总数，COUNT(*)"
      avg_rating: "从评价表按商品ID计算平均评分，AVG(rating)"
      good_review_rate: "从评价表按商品ID计算好评率，好评数（rating >= 4 的行数）/ 总评价数 * 100"

    source_aliases:
      - drf

    grain:
      input: "一行=一条评价"
      output: "一行=一个商品的评价汇总"
      change: "多行聚合"

    joins:
      - alias: drf
        type: main
        condition: "从 dwd_review_f 读取全部评价数据"
        filter: ""

    join_safety:
      - table: dwd_review_f
        join_key_unique: false
        strategy: "GROUP BY product_id 收敛"
        reason: "评价表每个商品有多条评价，按 product_id 聚合收敛为一行"

  # ---- R0003: 商品中心F表（主宽表关联）----
  - rule_code: R0003
    rule_name: 商品中心宽表加工
    scenario: default
    exec_sequence: 2
    target_table: dwb_product_center_f
    is_view_step: false
    design_intent: >-
      以商品维度表为主表，LEFT JOIN 分类/品牌/店铺维度表补全属性，
      LEFT JOIN 库存表取库存指标，LEFT JOIN 订单销售聚合中间表(R0001)和
      评价聚合中间表(R0002)取汇总指标，计算价格/库存衍生字段，
      产出商品中心宽表（每行一个商品）。
    load_mode: truncate_table

    field_targets:
      # --- 商品基础信息（直取 dim_product_f）---
      - product_id
      - product_name
      - product_code
      - product_status_name
      - create_time
      - on_shelf_time
      - cost_price
      - sale_price
      - market_price
      # --- 价格衍生计算 ---
      - discount_rate
      - gross_profit
      - gross_profit_rate
      # --- 分类信息 ---
      - category_id
      - category_name
      - category_path
      # --- 品牌信息 ---
      - brand_id
      - brand_name
      - brand_origin
      # --- 店铺信息 ---
      - shop_id
      - shop_name
      # --- 库存信息 ---
      - stock_qty
      - locked_qty
      - available_qty
      - warning_qty
      - stock_status
      # --- 物理属性 ---
      - weight
      - volume
      - product_tag
      # --- 审计字段 ---
      - del_flag
      - crt_cycle_id
      - last_upd_cycle_id
      - dw_last_update_date

    field_logics:
      product_status_name: "商品状态编码翻译为中文：ON_SHELF→上架、OFF_SHELF→下架、SOLD_OUT→售罄、其他值→其他"
      discount_rate: "折扣率=(市场价-销售价)/市场价*100"
      gross_profit: "单品毛利=销售价-成本价"
      gross_profit_rate: "毛利率=(销售价-成本价)/销售价*100"
      available_qty: "可售数量=库存数量-锁定数量"
      stock_status: "库存状态判定：可售数量<=0→缺货，可售数量<=库存预警值→低库存，否则→正常"

    source_aliases:
      - dpf
      - dpc
      - dbf
      - dsf
      - dif

    grain:
      input: "一行=一个商品（主表 dim_product_f 粒度）"
      output: "一行=一个商品"
      change: "无变化"

    joins:
      - alias: dpf
        type: main
        condition: "dim_product_f 为主表，粒度锚点：商品"
        filter: ""
      - alias: dpc
        type: LEFT JOIN
        condition: "dpf.category_id = dpc.category_id"
        filter: ""
      - alias: dbf
        type: LEFT JOIN
        condition: "dpf.brand_id = dbf.brand_id"
        filter: ""
      - alias: dsf
        type: LEFT JOIN
        condition: "dpf.shop_id = dsf.shop_id"
        filter: ""
      - alias: dif
        type: LEFT JOIN
        condition: "dpf.product_id = dif.product_id"
        filter: ""
      - alias: dwb_product_center_tmp1
        type: LEFT JOIN
        condition: "dpf.product_id = tmp1.product_id"
        filter: "R0001 产出的订单销售聚合中间表"
      - alias: dwb_product_center_tmp2
        type: LEFT JOIN
        condition: "dpf.product_id = tmp2.product_id"
        filter: "R0002 产出的评价聚合中间表"

    join_safety:
      - table: dim_product_f
        join_key_unique: true
        strategy: "直接关联"
        reason: "商品维度表主表，product_id 唯一"
      - table: dim_product_category_f
        join_key_unique: true
        strategy: "直接关联"
        reason: "分类维度表按 category_id 唯一"
      - table: dim_brand_f
        join_key_unique: true
        strategy: "直接关联"
        reason: "品牌维度表按 brand_id 唯一"
      - table: dim_shop_f
        join_key_unique: true
        strategy: "直接关联"
        reason: "店铺维度表按 shop_id 唯一"
      - table: dwd_inventory_f
        join_key_unique: true
        strategy: "直接关联"
        reason: "库存事实表按 product_id 一行一商品（假设无多仓拆行）；若实际多仓需改为 GROUP BY 收敛"
      - table: dwb_product_center_tmp1
        join_key_unique: true
        strategy: "直接关联"
        reason: "中间表已按 product_id GROUP BY 收敛，唯一"
      - table: dwb_product_center_tmp2
        join_key_unique: true
        strategy: "直接关联"
        reason: "中间表已按 product_id GROUP BY 收敛，唯一"

# === 复杂度分析与分段决策 ===
complexity_analysis:
  join_count: 6                         # R0003 主规则的 LEFT JOIN 数（不含主表）
  has_grain_change: true                # R0001/R0002 有粒度变化（聚合）
  grain_change_detail: "订单明细表/评价表粒度细于商品粒度，在中间表 R0001/R0002 中按 product_id GROUP BY 收敛；R0003 主规则本身无粒度变化"
  multi_step_fields: 7                  # total_sales_qty/amount, buyer_cnt, sales_qty_30d, review_cnt, avg_rating, good_review_rate
  aggregation_after_join: true          # 先 GROUP BY 聚合（中间表）再 JOIN（主规则）
  segmentation_decision: "分段"
  segmentation_reason: >-
    多步骤加工字段=7（≥5阈值），且订单明细/评价表粒度细于商品粒度需先聚合后关联。
    拆为3个规则：R0001订单销售聚合中间表、R0002评价聚合中间表（可并行），
    R0003主宽表关联（依赖R0001/R0002）。聚合逻辑独立于关联逻辑，中间表可独立校验。

# === 分布键 ===
distribution_key:
  - product_id

# === 业务主键 ===
business_key:
  - product_id

business_key_design:
  input_key:
    - product_id                        # rs_input 备注"主键"
  adjusted: false
  reason: "商品粒度下 product_id 唯一，无需调整"

# === 调度细化 ===
schedule:
  task_name: "task_dwb_product_center_f"
  cron: "0 30 3 * * ?"                   # 每日 03:30（T+1，SLA 3:30）
  task_group: ""
  project: ""
  upstream_added: []

# === 数据流 ===
data_flow:
  dependencies:
    - from: R0001
      to: R0003
      type: data_flow
      intermediate_table: dwb_product_center_tmp1
    - from: R0002
      to: R0003
      type: data_flow
      intermediate_table: dwb_product_center_tmp2
  schedule_groups:
    - sequence: 1
      rules: ["R0001", "R0002"]          # 两中间表无依赖，可并行
    - sequence: 2
      rules: ["R0003"]                   # 主规则依赖 R0001+R0002

# === DQ（本表无 DQ 要求）===
dq_rules: []
