# ============================================================================
# design_decisions.yaml - 商品中心宽表 (dwb_product_center_f)
# ----------------------------------------------------------------------------
# 资产: slprd.dwb_product_center_f / dwb_product_center_i
# 粒度: 每行一个商品记录
# 策略: 全量调度（T+1 日级）
#
# 分段决策:
#   多步骤加工字段 7 个（≥5 阈值），其中 4 个来自订单明细、3 个来自评价表，
#   均需先 GROUP BY product_id 聚合再关联。拆 2 张中间表收口：
#     R0001 tmp1 订单销售汇总、R0002 tmp2 评价汇总（并行）
#   R0003 主规则关联 5 张源表 + 2 张中间表，产出 F 表。
# ============================================================================

# === 参数声明 ===
# P_CYCLE_ID(批次号) 由脚本自动注入，无需声明。
# 全量调度，无增量参数。
params: []

# === 规则拆分 ===
rules:
  # ----------------------------------------------------------------------
  # R0001: 订单销售汇总中间表
  # 从 dwd_order_detail_f 按 product_id 聚合，产出销量/销售额/购买人数/近30天销量
  # ----------------------------------------------------------------------
  - rule_code: R0001
    rule_name: "订单销售汇总"
    scenario: "default"
    exec_sequence: 1
    target_table: "dwb_product_center_tmp1"
    is_view_step: false
    design_intent: "将订单明细按商品粒度聚合，收口为每商品一行的销售指标，解耦主规则的聚合复杂度"
    load_mode: "truncate_table"

    field_targets:
      - total_sales_qty
      - total_sales_amount
      - buyer_cnt
      - sales_qty_30d

    field_logics:
      total_sales_qty: "从订单明细表按 product_id 汇总 SUM(qty)，统计累计总销量"
      total_sales_amount: "从订单明细表按 product_id 汇总 SUM(real_price * qty)，统计累计销售额"
      buyer_cnt: "从订单明细表按 product_id 统计 COUNT(DISTINCT user_id)，去重计数购买人数"
      sales_qty_30d: "从订单明细表按 product_id 汇总近30天 SUM(qty)，需用订单日期过滤近30天范围"

    source_aliases:
      - dod

    ctes: []

    grain:
      input: "一行=一条订单商品明细"
      output: "一行=一个商品"
      change: "多行聚合"

    joins:
      - alias: "dod"
        type: "main"
        condition: ""
        filter: ""

    join_safety:
      - table: "dwd_order_detail_f"
        join_key_unique: true
        strategy: ""
        reason: "聚合后按 product_id 收口，产出粒度为商品级，JOIN键天然唯一"

  # ----------------------------------------------------------------------
  # R0002: 评价汇总中间表
  # 从 dwd_review_f 按 product_id 聚合，产出评价数/平均评分/好评率
  # ----------------------------------------------------------------------
  - rule_code: R0002
    rule_name: "评价汇总"
    scenario: "default"
    exec_sequence: 1
    target_table: "dwb_product_center_tmp2"
    is_view_step: false
    design_intent: "将评价明细按商品粒度聚合，收口为每商品一行的评价指标，与订单汇总并行执行"
    load_mode: "truncate_table"

    field_targets:
      - review_cnt
      - avg_rating
      - good_review_rate

    field_logics:
      review_cnt: "从评价表按 product_id 统计 COUNT(*)，统计评价总数"
      avg_rating: "从评价表按 product_id 计算 AVG(rating)，保留1位小数"
      good_review_rate: "从评价表按 product_id 统计好评数(rating>=4)占评价总数的百分比，结果保留2位小数"

    source_aliases:
      - drf

    ctes: []

    grain:
      input: "一行=一条评价"
      output: "一行=一个商品"
      change: "多行聚合"

    joins:
      - alias: "drf"
        type: "main"
        condition: ""
        filter: ""

    join_safety:
      - table: "dwd_review_f"
        join_key_unique: true
        strategy: ""
        reason: "聚合后按 product_id 收口，产出粒度为商品级，JOIN键天然唯一"

  # ----------------------------------------------------------------------
  # R0003: 商品中心宽表 F 表（主规则）
  # 以 dim_product_f 为主表，LEFT JOIN 分类/品牌/店铺/库存维度表 +
  # tmp1(订单汇总)/tmp2(评价汇总)，一次性产出宽表
  # ----------------------------------------------------------------------
  - rule_code: R0003
    rule_name: "商品中心宽表组装"
    scenario: "default"
    exec_sequence: 2
    target_table: "dwb_product_center_f"
    is_view_step: false
    design_intent: "以商品维度表为主表，LEFT JOIN 分类/品牌/店铺/库存 + 中间表汇总指标，组装商品中心宽表"
    load_mode: "truncate_table"

    field_targets:
      # --- 商品基础属性（dpf） ---
      - product_id
      - product_name
      - product_code
      - product_status_name
      - create_time
      - on_shelf_time
      - cost_price
      - sale_price
      - market_price
      - discount_rate
      - gross_profit
      - gross_profit_rate
      - category_id
      - brand_id
      - shop_id
      - weight
      - volume
      - product_tag
      # --- 分类维度（dpc） ---
      - category_name
      - category_path
      # --- 品牌维度（dbf） ---
      - brand_name
      - brand_origin
      # --- 店铺维度（dsf） ---
      - shop_name
      # --- 库存指标（dif + 加工） ---
      - stock_qty
      - locked_qty
      - available_qty
      - warning_qty
      - stock_status
      # --- 审计字段 ---
      - del_flag
      - crt_cycle_id
      - last_upd_cycle_id
      - dw_last_update_date

    field_logics:
      product_status_name: "商品状态翻译：ON_SHELF→上架，OFF_SHELF→下架，SOLD_OUT→售罄，其余→其他"
      discount_rate: "(市场价 - 销售价) / 市场价 * 100，计算折扣率百分比"
      gross_profit: "销售价 - 成本价，计算单品毛利"
      gross_profit_rate: "(销售价 - 成本价) / 销售价 * 100，计算毛利率百分比"
      available_qty: "库存数量 - 锁定数量，计算可售数量"
      stock_status: "根据可售数量判断库存状态：可售数量<=0 为缺货，<=库存预警值 为低库存，否则为正常"

    source_aliases:
      - dpf
      - dpc
      - dbf
      - dsf
      - dif

    ctes: []

    grain:
      input: "一行=一个商品（主表 dim_product_f）"
      output: "一行=一个商品"
      change: "无变化"

    joins:
      - alias: "dpf"
        type: "main"
        condition: ""
        filter: ""
      - alias: "dpc"
        type: "LEFT JOIN"
        condition: "dpf.category_id = dpc.category_id"
        filter: ""
      - alias: "dbf"
        type: "LEFT JOIN"
        condition: "dpf.brand_id = dbf.brand_id"
        filter: ""
      - alias: "dsf"
        type: "LEFT JOIN"
        condition: "dpf.shop_id = dsf.shop_id"
        filter: ""
      - alias: "dif"
        type: "LEFT JOIN"
        condition: "dpf.product_id = dif.product_id"
        filter: ""
      - alias: "t1"
        type: "LEFT JOIN"
        condition: "dpf.product_id = t1.product_id"
        filter: "t1 为中间表 dwb_product_center_tmp1"
      - alias: "t2"
        type: "LEFT JOIN"
        condition: "dpf.product_id = t2.product_id"
        filter: "t2 为中间表 dwb_product_center_tmp2"

    join_safety:
      - table: "dim_product_f"
        join_key_unique: true
        strategy: ""
        reason: "主表，product_id 为业务主键，天然唯一"
      - table: "dim_product_category_f"
        join_key_unique: true
        strategy: ""
        reason: "分类维度表，category_id 唯一"
      - table: "dim_brand_f"
        join_key_unique: true
        strategy: ""
        reason: "品牌维度表，brand_id 唯一"
      - table: "dim_shop_f"
        join_key_unique: true
        strategy: ""
        reason: "店铺维度表，shop_id 唯一"
      - table: "dwd_inventory_f"
        join_key_unique: true
        strategy: ""
        reason: "DWD 库存事实表应已在商品粒度收口（product_id 唯一）；若实际存在多仓记录导致 product_id 不唯一，需在此前增加 GROUP BY product_id 聚合库存数量"
      - table: "dwb_product_center_tmp1"
        join_key_unique: true
        strategy: ""
        reason: "中间表已按 product_id 聚合收口，JOIN键唯一"
      - table: "dwb_product_center_tmp2"
        join_key_unique: true
        strategy: ""
        reason: "中间表已按 product_id 聚合收口，JOIN键唯一"

# === 复杂度分析与分段决策 ===
complexity_analysis:
  join_count: 7                         # dpf + dpc + dbf + dsf + dif + tmp1 + tmp2
  has_grain_change: true
  grain_change_detail: "订单明细(多条/商品)和评价(多条/商品)需聚合到商品粒度；主规则本身粒度不变"
  multi_step_fields: 7                  # total_sales_qty/amount/buyer_cnt/sales_qty_30d + review_cnt/avg_rating/good_review_rate
  aggregation_after_join: false         # 聚合在中间表完成，主规则无聚合后关联
  segmentation_decision: "分段"
  segmentation_reason: "多步骤加工字段 7 个（≥5 阈值），且来自 2 个不同事实表需独立 GROUP BY 聚合。拆 2 张中间表（订单汇总+评价汇总）并行执行，降低主规则 SQL 复杂度，支持中间结果独立校验"

# === 表物理属性 ===
tables:
  dwb_product_center_f:
    distribution_key: [product_id]
    distribute_type: HASH
  dwb_product_center_tmp1:
    distribution_key: [product_id]
    distribute_type: HASH
  dwb_product_center_tmp2:
    distribution_key: [product_id]
    distribute_type: HASH

# === 业务主键 ===
business_key: [product_id]

business_key_design:
  input_key: [product_id]
  adjusted: false
  reason: ""

# === 调度细化 ===
schedule:
  task_name: "TASK_DWB_PRODUCT_CENTER_F"
  cron: "0 30 3 * * ?"

  lts_params:
    - lts_var: "V_CYCLE_ID"
      etl_param: "P_CYCLE_ID"
      desc: "批次号"
    - lts_var: "V_GROUP_CODE"
      etl_param: ""
      desc: "规则组编码"

  upstream_added: []

  view:
    task_name: "TASK_DWB_PRODUCT_CENTER_I"
    cron: "0 35 3 * * ?"

# === 数据流 ===
data_flow:
  dependencies:
    - from: "R0001"
      to: "R0003"
      type: "data_flow"
      intermediate_table: "dwb_product_center_tmp1"
    - from: "R0002"
      to: "R0003"
      type: "data_flow"
      intermediate_table: "dwb_product_center_tmp2"
  schedule_groups:
    - sequence: 1
      rules: ["R0001", "R0002"]
    - sequence: 2
      rules: ["R0003"]

# === DQ ===
dq_rules: []
