# ============================================================================
# design_decisions.yaml - dwb_trade_order_d 订单汇总表
# ----------------------------------------------------------------------------
# 单源表(ods_trade_order_di 订单明细接入表) → 订单汇总表
# 加工实质: 按订单+客户维度对 amount 求和，从明细行收敛到订单行
# ============================================================================

# === 规则拆分 ===
# 单源表、无 JOIN、单次 GROUP BY 聚合 → 不分段，一条规则直达目标 F 表
rules:
  - rule_code: R0001
    rule_name: "订单汇总"
    scenario: "default"
    exec_sequence: 1
    target_table: "dwb_trade_order_d"
    is_view_step: false
    design_intent: "从订单明细接入表按订单+客户维度聚合 amount，收敛到订单粒度产出目标 F 表"
    load_mode: "truncate_table"

    # 该规则管全部 7 个目标字段（3 业务 + 4 审计）
    field_targets:
      - order_id
      - cust_id
      - total_amount
      - del_flag
      - crt_cycle_id
      - last_upd_cycle_id
      - dw_last_update_date

    # 仅加工类业务字段写 design_logic；直取字段(order_id/cust_id)和审计字段脚本自动处理
    field_logics:
      total_amount: "按订单ID(order_id)和客户ID(cust_id)分组，对源表 amount 字段求和汇总，得到订单总额"

    source_aliases: ["a"]

    ctes: []

    grain:
      input: "一行=一条订单明细"
      output: "一行=一个订单"
      change: "多行聚合"

    joins:
      - alias: "a"
        type: "main"
        condition: ""
        filter: ""

    join_safety: []

# === 复杂度分析与分段决策 ===
complexity_analysis:
  join_count: 0
  has_grain_change: true
  grain_change_detail: "订单明细行(ods_trade_order_di) → 订单汇总行(GROUP BY order_id, cust_id 聚合收敛)"
  multi_step_fields: 0
  aggregation_after_join: false
  segmentation_decision: "不分段"
  segmentation_reason: "单源表无 JOIN 关联，仅一次 GROUP BY 聚合收敛，单条 INSERT 即可完成全部加工"

# === 分布键（事实表选业务主键 order_id，高基数，避免倾斜）===
distribution_key: ["order_id"]

# === 业务主键 ===
# RS 标注 order_id 为"主键"，目标粒度"每行一个订单"，聚合后 order_id 唯一
business_key: ["order_id"]

business_key_design:
  input_key: ["order_id"]
  adjusted: false
  reason: ""

# === 调度细化（RS: T+1 一天一调, SLA 3:30）===
schedule:
  task_name: "dws_dwb_trade_order_d"
  cron: "0 30 3 * * ?"
  task_group: "dws_dwb"
  project: "trade"
  upstream_added: []

# === 数据流 ===
data_flow:
  dependencies: []
  schedule_groups:
    - sequence: 1
      rules: ["R0001"]

# === DQ ===
dq_rules: []
