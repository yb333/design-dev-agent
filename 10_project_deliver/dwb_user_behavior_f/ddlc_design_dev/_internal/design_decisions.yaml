# ============================================================================
# design_decisions.yaml - 用户行为宽表 dwb_user_behavior_f 设计决策
# ----------------------------------------------------------------------------
# 资产: slord.dwb_user_behavior_f (F表) + slord.dwb_user_behavior_i (I视图)
# 粒度: 每行一个用户行为记录
# 加工模式: 3 场景(电商交易/内容互动/社交关系)并行加工 -> 场景中间表 -> UNION ALL 到 F 表
# 字段总数: 184 (180 业务 + 4 审计)
# 规则数: 4 (3 场景中间表 + 1 F 表合并)
# ============================================================================

# === 规则拆分 ===
# 设计思路: 3 个场景的业务实质不同(订单/互动/关系), 来自不同 ods 主表, 各自需要关联
# 不同的维度表(商品/内容/用户画像), 但共享相同的 user_* 维度和 behavior_* 时间派生字段.
# 按"规则=一个产出表"原则, 3 场景各自产出独立中间表(并行加工), 再 UNION ALL 合并到 F 表.
# 共用字段(behavior_*/user_*/审计)归到 F 表合并规则, 因为它们是 UNION 后才完整呈现的字段.
# I 视图是 F 表镜像(CREATE OR REPLACE VIEW ... AS SELECT * FROM ..._f), 无独立字段产出,
# 由 coder 按 F+I 成对约定生成, 不单独建规则(避免与 F 表规则字段冲突).
rules:
  # --------------------------------------------------------------------------
  # R0001 电商交易场景中间表
  # --------------------------------------------------------------------------
  - rule_code: R0001
    rule_name: "电商交易场景加工"
    scenario: "电商交易"
    exec_sequence: 1
    target_table: "dwb_user_behavior_tmp1"
    is_view_step: false
    design_intent: "从订单主表 ods_order_main_f 出发, LEFT JOIN 商品维度 dim_product_d 取商品属性, 加工电商交易场景的行为明细(订单+商品共50字段), 产出到场景中间表 tmp1 供 F 表 UNION 合并"
    load_mode: "truncate_table"

    field_targets:
      # --- 订单信息 (30 字段, 来自 oom) ---
      - order_order_id
      - order_order_no
      - order_order_status
      - order_order_status_name
      - order_order_amount
      - order_discount_amount
      - order_actual_amount
      - order_payment_method
      - order_payment_time
      - order_shipping_fee
      - order_product_count
      - order_sku_count
      - order_is_first_order
      - order_coupon_id
      - order_coupon_name
      - order_points_used
      - order_points_earned
      - order_complete_time
      - order_cancel_time
      - order_cancel_reason
      - order_merchant_id
      - order_merchant_name
      - order_delivery_type
      - order_delivery_time
      - order_receive_time
      - order_receive_status
      - order_order_source
      - order_remark
      - order_invoice_type
      - order_invoice_title
      # --- 商品信息 (20 字段, 来自 dpd) ---
      - prod_product_id
      - prod_product_name
      - prod_product_code
      - prod_sku_id
      - prod_sku_name
      - prod_brand_id
      - prod_brand_name
      - prod_category_id
      - prod_category_name
      - prod_category_level1
      - prod_category_level2
      - prod_category_level3
      - prod_price
      - prod_cost_price
      - prod_profit_rate
      - prod_stock_status
      - prod_sale_status
      - prod_product_type
      - prod_is_virtual
      - prod_supplier_id

    field_logics:
      order_order_status_name: "订单状态码翻译为中文: PENDING→待支付, PAID→已支付, SHIPPED→已发货, COMPLETED→已完成, CANCELLED→已取消, 其他码→未知"
      prod_profit_rate: "商品利润率(%)=(商品价格-成本价)/商品价格×100; 价格≤0 时取 0 防止除零"

    source_aliases: ["oom", "dpd"]

    ctes: []

    grain:
      input: "一行=一个订单行为(来自 ods_order_main_f)"
      output: "一行=一个电商交易行为(含订单+商品维度)"
      change: "无变化"

    joins:
      - alias: "oom"
        type: "main"
        condition: "主表, ods_order_main_f 全量扫描"
        filter: "无"
      - alias: "dpd"
        type: "LEFT JOIN"
        condition: "oom.product_id = dpd.product_id"
        filter: "无"
      - alias: "dub"
        type: "LEFT JOIN"
        condition: "oom.user_id = dub.user_id"
        filter: "无(用户维度字段归 F 表合并规则, 但 JOIN 在本场景完成以备 tmp1 后续 UNION 时对齐)"

    join_safety:
      - table: "dim_product_d"
        join_key_unique: true
        strategy: ""
        reason: "维度表 dim_product_d 按 product_id 唯一(每日全量快照, 一个商品一行)"
      - table: "dim_user_base_d"
        join_key_unique: true
        strategy: ""
        reason: "用户基础维度表按 user_id 唯一(每日全量快照, 一个用户一行)"

  # --------------------------------------------------------------------------
  # R0002 内容互动场景中间表
  # --------------------------------------------------------------------------
  - rule_code: R0002
    rule_name: "内容互动场景加工"
    scenario: "内容互动"
    exec_sequence: 1
    target_table: "dwb_user_behavior_tmp2"
    is_view_step: false
    design_intent: "从内容互动表 ods_content_interaction_f 出发, LEFT JOIN 内容维度 dim_content_d 取内容属性, 加工内容互动场景的行为明细(互动+内容共50字段), 产出到场景中间表 tmp2 供 F 表 UNION 合并"
    load_mode: "truncate_table"

    field_targets:
      # --- 互动行为 (30 字段, 来自 oci) ---
      - content_interaction_id
      - content_content_id
      - content_interaction_type
      - content_interaction_type_name
      - content_duration_seconds
      - content_duration_minutes
      - content_comment_content
      - content_comment_word_count
      - content_share_platform
      - content_share_count
      - content_like_count
      - content_comment_count
      - content_collect_count
      - content_forward_count
      - content_is_original
      - content_source_type
      - content_browse_depth
      - content_scroll_percentage
      - content_click_count
      - content_stay_time
      - content_bounce_flag
      - content_exit_page
      - content_session_id
      - content_page_view_count
      - content_unique_visitor
      - content_referer_url
      - content_utm_source
      - content_utm_medium
      - content_utm_campaign
      - content_interaction_device
      # --- 内容属性 (20 字段, 来自 dcd) ---
      - content_content_title
      - content_content_type
      - content_content_category
      - content_author_id
      - content_author_name
      - content_publish_time
      - content_publish_date
      - content_content_length
      - content_word_count
      - content_read_count
      - content_content_like_count
      - content_content_comment_count
      - content_content_share_count
      - content_content_collect_count
      - content_topic_id
      - content_topic_name
      - content_is_hot
      - content_is_recommend
      - content_content_status
      - content_content_score

    field_logics:
      content_interaction_type_name: "互动类型码翻译为中文: VIEW→浏览, LIKE→点赞, COMMENT→评论, SHARE→分享, COLLECT→收藏, 其他码→其他"
      content_duration_minutes: "浏览时长(分钟)=浏览时长秒数/60"
      content_comment_word_count: "评论字数=评论内容字符串长度(字符数)"
      content_publish_date: "内容发布日期=发布时间的日期部分"

    source_aliases: ["oci", "dcd"]

    ctes: []

    grain:
      input: "一行=一次内容互动行为(来自 ods_content_interaction_f)"
      output: "一行=一个内容互动行为(含互动+内容维度)"
      change: "无变化"

    joins:
      - alias: "oci"
        type: "main"
        condition: "主表, ods_content_interaction_f 全量扫描"
        filter: "无"
      - alias: "dcd"
        type: "LEFT JOIN"
        condition: "oci.content_id = dcd.content_id"
        filter: "无"
      - alias: "dub5"
        type: "LEFT JOIN"
        condition: "oci.user_id = dub5.user_id"
        filter: "无(用户维度字段归 F 表合并规则, 但 JOIN 在本场景完成以备 tmp2 后续 UNION 时对齐)"

    join_safety:
      - table: "dim_content_d"
        join_key_unique: true
        strategy: ""
        reason: "内容维度表按 content_id 唯一(每日全量快照, 一个内容一行)"
      - table: "dim_user_base_d"
        join_key_unique: true
        strategy: ""
        reason: "用户基础维度表按 user_id 唯一"

  # --------------------------------------------------------------------------
  # R0003 社交关系场景中间表
  # --------------------------------------------------------------------------
  - rule_code: R0003
    rule_name: "社交关系场景加工"
    scenario: "社交关系"
    exec_sequence: 1
    target_table: "dwb_user_behavior_tmp3"
    is_view_step: false
    design_intent: "从社交关系表 ods_social_relation_f 出发, LEFT JOIN 用户画像维度 dim_user_profile_d 取画像属性, 加工社交关系场景的行为明细(关系+画像共40字段), 产出到场景中间表 tmp3 供 F 表 UNION 合并"
    load_mode: "truncate_table"

    field_targets:
      # --- 社交关系 (25 字段, 来自 osr) ---
      - social_relation_id
      - social_target_user_id
      - social_relation_type
      - social_relation_type_name
      - social_is_mutual
      - social_interaction_count
      - social_last_interaction_time
      - social_relation_status
      - social_source
      - social_group_id
      - social_group_name
      - social_remark
      - social_intimacy_level
      - social_chat_count
      - social_call_count
      - social_video_call_count
      - social_gift_count
      - social_follow_days
      - social_interaction_frequency
      - social_common_friends
      - social_common_groups
      - social_social_distance
      - social_relationship_strength
      - social_trust_level
      - social_contact_importance
      # --- 用户画像 (15 字段, 来自 dup) ---
      - profile_avatar_url
      - profile_profession
      - profile_education
      - profile_interests
      - profile_active_level
      - profile_influence_score
      - profile_social_value
      - profile_user_tags
      - profile_fans_count
      - profile_follow_count
      - profile_friend_count
      - profile_social_activity_score
      - profile_content_creation_score
      - profile_engagement_score
      - profile_social_influence_rank

    field_logics:
      social_relation_type_name: "关系类型码翻译为中文: FOLLOW→关注, FRIEND→好友, BLOCK→屏蔽, BLACKLIST→黑名单, 其他码→其他"

    source_aliases: ["osr", "dup"]

    ctes: []

    grain:
      input: "一行=一条社交关系行为(来自 ods_social_relation_f)"
      output: "一行=一个社交关系行为(含关系+用户画像维度)"
      change: "无变化"

    joins:
      - alias: "osr"
        type: "main"
        condition: "主表, ods_social_relation_f 全量扫描"
        filter: "无"
      - alias: "dup"
        type: "LEFT JOIN"
        condition: "osr.user_id = dup.user_id"
        filter: "无"
      - alias: "dub8"
        type: "LEFT JOIN"
        condition: "osr.user_id = dub8.user_id"
        filter: "无(用户基础维度字段归 F 表合并规则, 但 JOIN 在本场景完成以备 tmp3 后续 UNION 时对齐)"

    join_safety:
      - table: "dim_user_profile_d"
        join_key_unique: true
        strategy: ""
        reason: "用户画像维度表按 user_id 唯一(每日全量快照, 一个用户一行画像)"
      - table: "dim_user_base_d"
        join_key_unique: true
        strategy: ""
        reason: "用户基础维度表按 user_id 唯一"

  # --------------------------------------------------------------------------
  # R0004 F 表多场景合并 (UNION ALL 3 个场景中间表)
  # --------------------------------------------------------------------------
  - rule_code: R0004
    rule_name: "F表多场景合并"
    scenario: "多场景合并"
    exec_sequence: 2
    target_table: "dwb_user_behavior_f"
    is_view_step: false
    design_intent: "将 3 个场景中间表(tmp1/tmp2/tmp3)UNION ALL 合并写入 F 表 dwb_user_behavior_f; 同时承载 3 场景共用字段(behavior_* 时间派生/is_weekend/time_period/user_* 用户维度/4 审计字段); 时间派生和用户脱敏的 design_logic 在此登记一次, coder 阶段在 3 个场景 SQL 里复用; 配套由 coder 生成 I 视图 dwb_user_behavior_i (SELECT * FROM F 表)"
    load_mode: "truncate_table"

    field_targets:
      # --- 行为公共字段 (10 字段, 3 场景共享) ---
      - behavior_id
      - behavior_time
      - behavior_date
      - behavior_hour
      - behavior_weekday
      - behavior_month
      - behavior_quarter
      - behavior_year
      - is_weekend
      - time_period
      # --- 用户公共字段 (30 字段, 3 场景共享, 来自 dim_user_base_d) ---
      - user_user_id
      - user_user_name
      - user_user_phone
      - user_gender
      - user_age
      - user_birthday
      - user_province_name
      - user_city_name
      - user_user_level
      - user_user_level_name
      - user_vip_status
      - user_register_time
      - user_register_date
      - user_user_status
      - user_user_status_name
      - user_source_channel
      - user_source_type
      - user_first_active_time
      - user_last_active_time
      - user_active_days
      - user_total_score
      - user_credit_score
      - user_risk_level
      - user_device_type
      - user_os_type
      - user_app_version
      - user_ip_address
      - user_network_type
      - user_is_real_name
      - user_verify_status
      # --- 审计字段 (4 字段) ---
      - del_flag
      - crt_cycle_id
      - last_upd_cycle_id
      - dw_last_update_date

    field_logics:
      # 行为时间派生(各场景在自身主表时间字段上计算, design_logic 统一描述)
      behavior_date: "行为日期=行为时间的日期部分(电商用 create_time, 内容用 interaction_time, 社交用 create_time)"
      behavior_hour: "行为小时=行为时间的小时部分(0-23)"
      behavior_weekday: "行为星期=行为时间是周几(DAYOFWEEK, 1-7)"
      behavior_month: "行为月份=行为时间的月份部分(1-12)"
      behavior_quarter: "行为季度=行为时间的季度部分(1-4)"
      behavior_year: "行为年份=行为时间的年份部分(4位年)"
      is_weekend: "是否周末: 行为时间落在周六(7)或周日(1)为 1, 工作日为 0"
      time_period: "时间段按行为小时分段: 0-5→凌晨, 6-11→上午, 12-13→中午, 14-17→下午, 其他→晚上"
      # 用户维度加工(来自 dim_user_base_d, 各场景 JOIN 后统一加工)
      user_user_phone: "手机号脱敏: 保留前 3 位和后 4 位, 中间用 **** 屏蔽(如 138****1234)"
      user_gender: "性别码翻译: M→男, F→女, 其他→未知"
      user_age: "用户年龄=当前日期的年份减去出生日期的年份"
      user_register_date: "注册日期=注册时间的日期部分"
      user_user_status_name: "用户状态码翻译为中文: ACTIVE→正常, INACTIVE→未激活, BANNED→封禁, 其他→未知"

    # source_aliases 留空, 脚本默认用 rs_input 所有源表; 实际数据流是 3 个场景中间表 UNION
    source_aliases: []

    ctes: []

    grain:
      input: "3 个场景中间表 UNION ALL(每行=一个用户行为, 跨场景)"
      output: "一行=一个用户行为记录(全场景汇总)"
      change: "无变化(UNION ALL 不改变粒度, 仅纵向合并)"

    joins: []

    join_safety: []

# === 复杂度分析与分段决策 ===
complexity_analysis:
  join_count: 3                     # 单场景最多 3 表 JOIN(主表+2 维度); F 表合并是 UNION ALL 不算 JOIN
  has_grain_change: false           # 无粒度变化, 每行=一个用户行为, 全程保持
  grain_change_detail: "输入输出粒度一致, 每行=一个用户行为记录; 3 场景各自独立加工保持粒度, UNION ALL 仅纵向合并不改变粒度"
  multi_step_fields: 13             # 加工类业务字段: behavior_date/hour/weekday/month/quarter/year/is_weekend/time_period(8) + user_phone脱敏/gender/age/register_date/user_status_name(5) + 场景内 order_status_name/profit_rate/interaction_type_name/duration_minutes/comment_word_count/publish_date/relation_type_name(7) = 共需写 field_logics 的字段, 这里统计合并规则的 13 个
  aggregation_after_join: false     # 无聚合后关联
  segmentation_decision: "分段"
  segmentation_reason: "3 个业务场景(电商交易/内容互动/社交关系)来自不同 ods 主表, 关联不同维度表, 业务实质不同, 天然需要分场景加工; 每场景独立产出中间表后 UNION ALL 合并到 F 表, 既保持各场景加工逻辑独立可校验, 又能在 schedule 上并行执行缩短 SLA. 不分段无法表达多场景并行的执行语义."

# === 分布键 ===
# 选择 behavior_id: 高基数(行为日志全局序列), 是业务主键, 跨 3 场景天然唯一(假设行为日志系统
# 生成全局唯一 behavior_id), 作为下游 JOIN 键最常用. 避免用 user_id(中基数, 一个用户多行为会倾斜)
# 或 status 类低基数字段.
distribution_key:
  - behavior_id

# === 业务主键 ===
# 审视: mapping/RS 标注的主键是 user_user_id(备注列"主键"), 但产出表粒度是"每行一个用户行为记录",
# 一个用户会有多条行为(下单/浏览/关注等), user_user_id 在产出表里严重发散(1对多), 不满足唯一性.
# 调整为 behavior_id: 每个用户行为记录的唯一标识, 跨 3 场景天然唯一(来自行为日志全局序列).
# 如 behavior_id 跨场景存在重码风险(各 ods 表独立生成), 需补充场景标识字段, 但当前 RS 未提供
# 场景标识, 暂按全局唯一假设; 此风险点列入 design_notes 待需求方确认.
business_key:
  - behavior_id

business_key_design:
  input_key:
    - user_user_id
  adjusted: true
  reason: "mapping/RS 标注的主键 user_user_id 是用户维度字段, 但产出表粒度是'用户行为'(一个用户多条行为), user_user_id 在产出表里发散(1对多). 调整为 behavior_id 作为业务主键: 每个用户行为记录的唯一标识, 一个 behavior_id 对应一行, 满足唯一性. 风险: behavior_id 跨 3 场景(订单/互动/关系)的唯一性依赖上游行为日志系统生成全局唯一 ID, 若各 ods 主表独立生成可能重码, 需求方需确认."

# === 调度细化 ===
# RS 给"全量调度, T+1 一天一调, SLA 3:30"; 细化为每日凌晨 3:00 启动(留 30 分钟余量到 SLA)
schedule:
  task_name: "dwb_user_behavior_f_load"
  cron: "0 0 3 * * ?"               # 每天 03:00 触发
  task_group: "dwb_user_behavior"
  project: "slord"
  upstream_added: []                # 3 场景中间表为本资产内部产出, 不是外部上游; rs_input 已有上游脚本会自动带

# === 数据流 ===
data_flow:
  dependencies:
    - from: "R0001"
      to: "R0004"
      type: "data_flow"
      intermediate_table: "dwb_user_behavior_tmp1"
    - from: "R0002"
      to: "R0004"
      type: "data_flow"
      intermediate_table: "dwb_user_behavior_tmp2"
    - from: "R0003"
      to: "R0004"
      type: "data_flow"
      intermediate_table: "dwb_user_behavior_tmp3"
  schedule_groups:
    # sequence 1: 3 个场景中间表并行加工(无相互依赖, 可同时启动)
    - sequence: 1
      rules: ["R0001", "R0002", "R0003"]
    # sequence 2: F 表合并依赖 3 个中间表全部完成
    - sequence: 2
      rules: ["R0004"]

# === DQ 规则 ===
# 按 SKILL DQ 是可选项; 本宽表为行为日志汇总, 关键质量点是 behavior_id 唯一性(因主键已从 user_user_id
# 调整为 behavior_id, 必须验证 behavior_id 在 F 表全局唯一, 否则业务主键失效).
dq_rules:
  - rule_id: "DQ_001"
    rule_name: "behavior_id 全局唯一性检查"
    check_type: "uniqueness"
    target: "behavior_id"
    threshold: "重复行数 = 0"
    alert_level: "high"
  - rule_id: "DQ_002"
    rule_name: "场景来源完整性检查"
    check_type: "completeness"
    target: "behavior_id"
