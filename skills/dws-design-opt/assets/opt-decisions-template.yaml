# ============================================================================
# 优化模式增量 decisions 模板（designer 产出格式，add_field）
# 只写增量，不写存量——存量重写 = 红线禁止。每个新增字段一条。
# 组装器：assemble_ts_opt.py（ts_baseline + 本文件 → ts_v2 + change 段）
#
# ★命名规约（2026-10-14 彩排实证，写错即被组装器拦）：
#   - target_table / intermediate_tables 用**短表名**（baseline tables 键形态，
#     如 dwb_cust_asset_d / tmp_cust_asset_detail——不带 schema 前缀）
#   - source.alias 以 **baseline SQL 实际别名**为准——见 baseline_view「别名对照」段
#     预计算表（SQL 实际别名=落笔权威；mapping 台账别名可能与 SQL 不同名。
#     禁读档案 etl SQL 原文自行核对——对照已由脚本算好）
#   - 直挂字段穿聚合规则（GROUP BY）须声明聚合口径（如 MAX 组内任取）——
#     design_logic 写明"组内任取"语义，coder 才能合法翻译（GROUP BY 属冻结层不可加键）
#
# ★YAML 语法坑（写错静默变义）：
#   - 布尔词裸写会被解析成 true/false：no/yes/on/off 作**值**要加引号（backfill: "no"）；
#     作**键**直接换名（new_joins 的关联条件键=join_on，裸 on: 键会变布尔 True）
#   - 值以 { [ & * 开头或含 : # 时加引号
#
# ★design_logic 写法规约（引用门禁——违反即被组装器拦，不需读源码）：
#   1. 字段引用一律 `别名.字段` 两段式（如 a.pay_channel）——裸字段名（pay_channel）
#      和三段式（t.a.col）都被硬拦
#   2. 口径说明文字一律放**全角括号（）**内、表达式只用半角——
#      合法：nvl(a.amt, 0)（金额为空按 0 计）；全角段里的内容不参与门禁检查
#   3. 只能引用真实存在的列：源表列（查 schema_cache）/ ts 表结构列；编造列名被拦
#   4. 空值写 NULL 或空串，禁用裸"空"字
# ============================================================================
change_type: add_field

# ---- 存量设计还原（baseline_design，2026-11-04 用户定调；2026-11-11 确认制）----
# 还原"前人的设计"（叙述），与逆向已有的设计结果（结构/规则/血缘）合成完整 ts 文档
# ——组装器拦空。grain/topology 从 baseline_view「设计候选」段抄录确认（脚本从 SQL
# 事实推导——GROUP BY/规则链，确认即采纳勿凭空归纳）；keys 无机器候选（业务语义），
# 用锚点段旁证（MERGE ON 键=强旁证）或归纳+「推测，需业务确认」；禁编造设计动机；
# 人审纠错在闸口①'。首轮起随 advance 进档案 design 段——次轮起档里有值不再归纳。
baseline_design:
  grain: 一行=一个订单明细（订单号+行号为粒度）
  keys: 业务主键=order_id+line_no（订单明细天然唯一，直取）
  topology: R0001 从 ods 订单表关联客户表加工入 tmp，R0002 终态装配写入 F 表
  notes: 客户表按 cust_id 唯一性为推测，需业务确认（notes 可选）

# 回刷意向——照抄 change_request.backfill（预处理已派生 2026-11-04：全量基线自动 no
# =下次调度全量重建覆盖无需回刷；增量/merge/分区基线 pending 到闸口①'人选拿；
# RS 有明确意向填之——照抄即可，勿自行推翻）。**值为 no 时必须带引号**（YAML 裸 no
# =布尔 false——虽然组装器已兼容布尔，写引号保持可读）
backfill: pending

fields:
  # ---- 示例 1：同源直挂（A 形态，源表已在 baseline 源表清单）----
  - field: pay_channel              # 新增字段名（不得与存量重名）
    target_table: dwb_trade_order_d # 落到哪张表（目标表）
    placed_rules: ["R0002"]         # 落位：哪些规则产出/携带该字段（设计判断）
    intermediate_tables: []         # 穿中间表时列出（C 形态），否则 []
    field_type: VARCHAR(64)
    field_comment: 支付渠道
    design_logic: a.pay_channel 直取    # 口径=表达式或人话+全角括号说明（见头部规约）
    transform_type: direct          # direct | aggregate | ...
    source:                         # 血缘（照抄 change_request 的 source——schema/table 分开）
      schema: ods
      table: ods_trade_order_di
      alias: a
      field: pay_channel
    new_joins: []                   # 同源直挂无新 JOIN

  # ---- 示例 2：新 JOIN（B 形态）----
  - field: channel_name
    target_table: dwb_trade_order_d
    placed_rules: ["R0002"]
    intermediate_tables: []
    field_type: VARCHAR(64)
    field_comment: 渠道名称
    design_logic: c.channel_name 直取（渠道维表按订单关联取名称）
    transform_type: direct
    source:
      schema: dws
      table: dim_channel
      alias: c
      field: channel_name
    new_joins:
      - rule: R0002                 # 只能挂 placed_rules 内的规则
        schema: dws
        table: dim_channel
        alias: c
        join_type: LEFT
        join_on: t.order_id = c.order_id   # 键名 join_on 非 on——YAML 裸 on 键会解析成布尔 True
        join_safety:                # ★ 新 JOIN 必须声明关联安全性——先取证后断言（SKILL §二.3）
          join_key_unique: true     # 渠道维表按 order_id 唯一（断言必须有结论）
          strategy: 直接关联
          join_filter: ""
          reason: explore 实测 count=12000 distinct=12000 唯一（依据句必填——实测数字/输入
                  声明；连不上库=标注「未实测」+输入依据；空 reason 组装器拦）

# ---- 场景 B（类型修改 modify_type）：目标字段类型修改 ----
# 变更记录页签「属性级 MODIFY·目标字段类型」的条目（change_request.modify_type_fields）
# 照抄到此处（含 decision 标记——precheck_opt 已人定的方向勿推翻）；无类型修改则整段省略。
modify_types:
  - field: order_id               # baseline 存量字段（类型修改只针对存量；新字段在 fields 段直接写对类型）
    target_table: dwb_trade_order_d
    old_type: VARCHAR(64)         # 照抄 change_request（须与 baseline 归一一致——校验拦）
    new_type: VARCHAR(128)        # 照抄 change_request（mapping 当前态=终态——校验拦）
    decision: "扩容/兼容方向，ALTER 自动转换即可"   # 照抄 precheck_opt 回写的决策标记（有则带）

# ---- 口径修改（modify_logic，属性级 MODIFY·映射表达式）----
# 变更记录「MODIFY | 字段 | 映射表达式 | 旧表达式 | 新表达式」的条目：人话新口径由你
# 翻译成 design_logic 填此处（new_logic——表达式+全角括号说明，写法规约见头部）；
# 落点由脚本自动定位（baseline 桶条目——processed 替换 / direct 迁移为 processed）。
modify_logics:
  - field: amt                   # baseline 存量字段（口径修改只针对存量）
    target_table: dwb_trade_order_d
    new_logic: "nvl(a.amt, 0)（金额为空按 0 计——2026-10 业务口径修订）"
    reason: 含义纠偏：原口径把空值当 NULL 透传，业务确认按 0 计
