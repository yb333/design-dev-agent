# ============================================================================
# design_decisions.yaml - 设计决策（designer agent 产出）
# ----------------------------------------------------------------------------
# 这个文件只含"设计判断"，不含字段类型/来源等确定性数据。
# 字段详情（类型/注释/来源字段）由 assemble_ts.py 从 rs_input.json 自动搬移。
#
# 产出规则：
# 1. rules[].field_targets 只列目标字段名（target_column），必须覆盖 rs_input
#    里所有 target_column，不能漏、不能重复出现在多个规则。
# 2. field_logics 只写【加工类字段】的自然语言口径；直取字段（直接复制）不写，
#    脚本会自动填默认 design_logic。
# 3. 不碰字段类型、来源表别名——这些脚本会从 rs_input 搬。
# ============================================================================

# === 类型风险处置（可选，预检检测到类型风险时引用决策文件）===
# 预检若检测到"直接复制"字段的源→目标类型风险，会生成决策文件并经人决策。
# designer 读决策文件后，对清单内字段在 field_logics 加类型安全处理逻辑。
# 不在清单的字段 = 无风险，绝不加多余处理。
type_risk_handling: null
# decision_file: "_internal/type_risk_decision.yaml"   # 决策文件路径（存在时读它）

# === 参数声明（资产级统一声明）===
# 标准参数（脚本按条件自动注入 + 自带 default_value，不要在此声明）：
#   P_CYCLE_ID   string  批次号（所有资产）→ 审计字段 crt/last_upd_cycle_id 自动用
#   P_FLAG       string  init 控制（inline 模式）：1=增量/2=初始化
#   P_START_DATE date    增量范围起点（增量资产）→ incremental.filter 用
#   P_END_DATE   date    增量范围终点（增量资产）→ incremental.filter 用
# 仅声明业务参数（不在标准清单的），default_value 必填（UT 兜底 + export 制品默认值都需要）。
params: []
#   - name: "ACCT_PERIOD"           # 参数名（大写+下划线，不要跟标准参数重名）
#     value_type: "string"          # string | date | datetime | number
#     desc: "会计期间"
#     default_value: "202608"       # ★ 必填：UT 兜底 + export 默认值（运行时平台会覆盖）

# === 规则拆分（核心判断）===
# 一个规则 = 一条 INSERT = 产出一个表（中间表/目标F表/视图I表）
rules:
  - rule_code: R0001                    # 规则编号，从 R0001 起
    rule_name: ""                       # 规则名（简短中文）
    scenario: ""                        # 场景（单场景名 / 多场景合并标记；场景是规则的属性）
    exec_sequence: 1                    # 执行顺序
    target_table: ""                    # 产出表名（中间表/目标F表/视图I表），带 schema 如 dws.tmp_x1。tmp 命名规范：目标表主体+_tmp+序号
                                        #   （dwb_x_f → dwb_x_tmp1）；不建议 tmp 前置，特殊命名一般不建议（N33 warn）
    design_intent: ""                   # 该规则的设计意图（自然语言，一句话说清为什么这样拆）
    load_mode: "truncate_table"         # ★ 写入方式（增量管道的写入方式，≠ init 的写入方式）:
                                        #   truncate_table(全量覆盖/中间tmp重建) | no_delete(追加) | delete(按条件删除) | truncate_partition(分区清空) | merge_into(upsert)
                                        #   增量目标规则不能用 truncate_table（全删全插 与增量矛盾，N_INIT2 拦）；
                                        #   init 的先删全插由下面的 init 段承担，不占这里的 load_mode。
    # write_condition: 写入条件（对应平台delete_condition）。非全量load_mode时必填：
    #   merge_into/update → ON条件如 "T.id=T1.id"（T=目标表别名，T1=源SELECT别名）
    #   truncate_partition → 分区名如 "P_1001"
    #   delete → 删除WHERE如 "rule_id>0"（目标表别名T）
    #   truncate_table/no_delete → 留空
    # designer 填，脚本只搬运+校验（非空、不含中文）。不推导，统一手填。
    write_condition: ""
    step_type: "full"                   # ★ 步骤类型: full(简单直灌/装配) | aggregate(聚合中间表) | incremental_extract(增量取数到tmp) | merge(合并tmp到目标)。决策树见 design-guide §4.4
    target_role: "target"               # ★ 目标角色: intermediate(中间表) | target(目标F表)
    produces_for: []                    # ★ 中间表规则填：产出供哪些规则消费（rule_code列表），如 ["R0003"]
    reads: []                           # ★ 装配/merge规则填：读哪些中间表（表名带 schema，如 dws.tmp_x）。两种写法：
                                         #   字符串 ["dws.tmp1"]                      → 别名默认=表短名
                                         #   对象 [{table: dws.tmp1, alias: t1}]     → 别名显式声明（规则内唯一，N31 校验冲突）
                                         #   搬运字段默认"直取 {tmp别名}.{字段}"（按 field_targets 血缘归到具体 tmp）；
                                         #   merge 时另 join 真源表补取的字段：joins 声明 + source_aliases 带上该源表别名。
    filter: ""                         # 规则级行过滤（WHERE，如 "ht.del_flag = 'N'"）——"本来就不要"的行排除；
                                         # join 级限定写 joins[].filter；两者都只引用本规则实际读的表（N30 查存在性）

    # 增量设计（step_type=incremental_extract 时填，详见 design-guide §5.2）
    # ★ 增量资产结构铁律（RS 增量驱动表非空时）：至少两个规则——增量取数
    #   （incremental_extract→tmp，加工可并入此步）+ 终态规则增量更新目标表
    #   （merge_into 等）。单规则直灌不被支持；终态 truncate_table 会清空历史（N28/N_INIT2 硬阻断）。
    # incremental:
    #   key: "update_time"              # 增量识别字段（从 RS 增量表读）
    #   filter: "update_time >= '${P_START_DATE}' AND update_time < '${P_END_DATE}'"  # 增量过滤（标准参数，脚本自动注入）
    #   init_filter: "1=1"              # 初始化过滤（全量用 1=1，或限定范围）
    #   init_time_range: "ALL"          # 初始化时间范围（来自 RS L07）
    #   init_strategy: "首次全量加载，后续按 update_time 增量"  # 初始化策略
    #   init_mode: "参数控制"           # ★ 初始化实现方式：参数控制 | 独立规则组（designer 决定）

    # 该规则的 target_table 包含哪些字段（填 target_column 名）
    # 中间表和目标表可以有同名字段（如 user_id 在 tmp1 和目标表各一份），不算重复
    # 目标表规则（target_role=target）的并集必须覆盖 rs_input 所有字段
    field_targets:
      - contract_no
      - contract_name
      - contract_amt

    # ★ 仅加工类字段写 design_logic（自然语言口径，不含 SQL）。
    # 直取字段（transform_rule=直接复制）不写，脚本自动填 "直取 {alias}.{column}"。
    # 加工/赋值/序列类字段必须写。
    field_logics:
      contract_amt: "本币金额，原币×汇率，排除作废合同"
      settle_amt: "结算金额，取已结算状态金额汇总"

    # 该规则关联的源表（填别名或表名，脚本从 rs_input 补 schema/table）
    # 如果留空，脚本默认用 rs_input 里所有 source_tables
    source_aliases: []

    # 粒度变化（输入→输出）
    grain:
      input: ""                         # 如 "一行=一个源合同"
      output: ""                        # 如 "一行=一个合同"
      change: ""                        # "无变化" / "多行聚合" / "展开"

    # 关联策略
    joins:
      - alias: ""
        type: ""                        # main / LEFT JOIN / INNER JOIN ...
        condition: ""
        filter: ""
        cast: ""                        # ★ 关联键类型跨大类且决策=转换时必填：显式转换表达式
                                        # （如 "a.prod_code::numeric"）。来源：紧凑视图 join_type_risk 段
                                        # （precheck 关联键对账检出的跨大类对）。coder 按声明写 SQL，不自己发挥。

    # 关联安全分析（JOIN键唯一性 → 对齐策略）
    join_safety:
      - table: ""
        join_filter: ""                # JOIN 此表时的范围限定（来自 mapping 的"关联&限定条件"，如 is_current = 1）。explore.py 用它验唯一性
        join_key_unique: true           # JOIN键在 join_filter 限定下是否唯一（不确定时调 explore.py 验证）
        strategy: ""                    # 不唯一时的对齐策略（GROUP BY收敛/取最新有效行）
        reason: ""

    # 排重策略（★ 仅累积共建场景填：build_mode=accumulate 的表，多来源有数据重叠需排重时）
    # 三层分工：RS/mapping 给"需去重"→ designer 细化为可落地策略 → coder 翻译成 SQL
    # 仅 accumulate 模式（多规则累积共建同一表，见下方 tables 段 build_mode）需要填；默认单规则产出的表不填。
    dedup_strategy:
      target: ""                       # 对哪张共建表排重
      key: []                          # 用什么键判断重复（如 ["order_id"]）
      priority: ""                     # 来源优先级（如 "R0001 > R0002"，冲突时保留谁）
      reason: ""                       # 策略理由（如"A来源优先，因为A是主数据"）

# === 初始化设计（资产级；增量资产才填）===
# init 和增量是"同一目标表的两个写入管道"：增量管道(rules)日常跑，init 管道首次全量装载。
# 两个管道的 load_mode 必然不同：增量目标用 merge_into/no_delete 等，init 目标恒用 truncate_table(先删全插)。
# 这就是为什么 load_mode 装不下两者——init 单独成段。
#
# 两种 mode（判据：增量管道有没有 delta 机器）：
#   derive（模式一二：增量管道只多一个范围 WHERE，无 delta 机器）
#     → init 从增量管道派生：各 extract 的 WHERE 换成 init_filter（增量规则里已填），终态换 truncate。
#       designer 这里只声明 mode=derive + group_mode，不写 init 规则。
#   explicit（模式三：增量管道有 delta 机器——union 取并集/只重建受影响行等）
#     → init 是独立设计：剥掉 delta 机器、留下核心加工全量跑。designer 在 rules 里写 init 规则。
#       装配器按 7 不变量补全终态(target/load_mode/field_targets/write_condition)，designer 只写判断部分(core_from/joins)。
#
# group_mode（init 怎么组织）：
#   inline（同组 p_flag）：init 规则和增量规则同规则组，运行时 p_flag 选跑哪条。适合 init 简单。
#   separate（独立规则组）：init 独立规则组 + 独立 LTS 任务(一次性)。适合 init 复杂/想彻底分开。
init: null
# 示例（explicit，模式三）：
# init:
#   mode: explicit
#   group_mode: inline                # inline=同组p_flag | separate=独立规则组
#   rules:
#     - rule_code: INIT_R0001
#       core_from: R0002              # 可选：field_logics 抄自哪条增量规则（口径相同时省得重写）
#       joins:                        # ★ 核心结构（剥掉 delta 机器后的 FROM/JOIN）—— designer 判断，唯一必写项
#         - {alias: a, type: main}
#         - {alias: b, type: "LEFT JOIN", condition: "a.id=b.a_id"}
#       field_logics: {}              # 可选：不写则从 core_from 抄；写了覆盖
#       # target_table / load_mode / write_condition / field_targets 不填 → 装配器按不变量补
#       # （init 终态 = 增量终态 F 表 / load_mode=truncate_table / write_condition 空 / field_targets=目标全字段）
#
# 示例（derive，模式一二）：
# init:
#   mode: derive
#   group_mode: inline
#   # rules 留空：init 从增量管道 + 各 extract 的 incremental.init_filter 派生（下游物化时生成）

# === 设计思路（自然语言，含设计考虑的指标 + 整体策略）===
# 写清楚你的设计思路：为什么这样拆分、整体加工策略是什么。
# 自然地引用指标（JOIN数、聚合字段数等），不要只列数字。
complexity_analysis:
  design_approach: ""                    # ★ 设计思路（自然语言，如"本资产按两个维度分别聚合收敛，产出中间表后统一装配..."）
  segmentation_decision: ""             # "不分段" / "分段"
  segmentation_reason: ""               # 分段理由（如果分段了）
  data_volume: ""                       # ★ 数据量档位（尽力而为）：万级/百万级/亿级/未知。
                                         #   来自 RS data_exploration 或 explore.py 估。只影响第2层物化决策（亿级倾向物化），
                                         #   不影响分布键（分布键看主键/关联频率/离散度）。拿不到填"未知"，不阻断。

# === 表物理属性（per-table）===
# ★ target_table 填 F 表名（_f 后缀），不填 _i（I 视图由 assemble_ddl 按 meta.target.i_view 自动生成）。
# 每张表各自定义分布键和分布方式。大部分情况下分布键跟业务主键一致，
# 但中间表可能不同（如按 user_id 聚合的 tmp 表用 user_id 做分布键）。
# distribution_key: 分布键字段列表
# distribute_type: 分布方式 HASH(默认) | ROUNDROBIN | REPLICATION（不填时有键=HASH，无键=ROUNDROBIN）
# build_mode: 产出模式（仅中间表需要关注）
#   transform（默认）：单一规则一次性产出（同表字段不可重复声明，assemble_ts C9 严格校验）
#   accumulate：多规则累积共建（去重累积/union累积，同表字段可重叠，需配 dedup_strategy）
# fields: 中间表自建字段的类型声明（可选，仅中间表 designer 自建字段需要）
#   大部分中间表字段跟目标表同名（类型自动取目标表 target_type，不用声明）。
#   只有 rs_input 里没有的自建字段（如辅助计算中间产物）必须在此声明类型。
# 其余属性不填走默认（列存 / 按 schema 推断逻辑集群）。
# 字段定义由 assemble_ts.py 从 rs_input 自动搬入 tables.{表名}.fields，designer 不碰（除中间表自建字段类型）。
tables:
  # 目标F表:
  # dwb_xxx_f:
  #   distribution_key: [id]
  #   distribute_type: HASH
  # 维表（复制分布）:
  # dwb_xxx_d:
  #   distribution_key: []
  #   distribute_type: REPLICATION
  # 中间表（转换型，默认）:
  # dwb_xxx_tmp1:
  #   distribution_key: [id]
  #   build_mode: transform        # 单一规则产出
  # 中间表（累积共建型）:
  # dwb_xxx_tmp2:
  #   distribution_key: [id]
  #   build_mode: accumulate       # 多规则累积共建（配合规则级 dedup_strategy）
  #   fields:                       # ★ 中间表自建字段类型（rs_input 没有的字段必须声明）
  #     custom_calc: numeric(10,2)

# === 业务主键（业务唯一字段组合，供 UT 主键唯一检查）===
# 注意：≠ 分布键。分布键是数据分布最优选，业务主键是业务唯一性。
# DDL 不定义物理 PRIMARY KEY（DWS 列存限制），UT 用 business_key 查唯一性。
# ★ 审视：mapping/RS 标注的主键（备注列标"主键"的字段）在产出表粒度下是否唯一？
#   如头行整合后头表主键会发散，需补充字段。调整了就在下面说明原因。
business_key: []

# 主键设计说明（如果调整了 mapping/RS 标注的主键，必须说明）
business_key_design:
  input_key: []                          # mapping/RS 标注的主键（从备注列提取）
  adjusted: false                        # 是否调整过
  reason: ""                             # 调整原因（adjusted=true 时必填）

# === 调度设计（designer 只填这三个，其余脚本标准化构建）===
schedule:
  schedule_type: "daily"               # daily(日调度) | hourly(定时调度) | realtime(高频/实时)
  cron: "0 30 3 * * ?"                 # designer 填标准 cron（F/view/dq 共用）

  # F 表上游依赖（rs_input 已有的湖表调度脚本自动带，这里只填设计新增的）
  # dep_type: 宽依赖(默认) | 同周期依赖 | 时间点依赖 | 上周期依赖 | 虚拟依赖
  upstream_added: []
  #   - table: "ods_order_f"
  #     task: "task_ods_order_f"        # RS 湖表调度给的任务名（原样保留，不转 job）
  #     dep_type: "宽依赖"
  #     # 跨项目依赖时填上游归属（同项目可不填，export 时用当前表配置兜底）
  #     project: ""                     # 上游所属项目
  #     group: ""                       # 上游所属任务组
  #     app: ""                         # 上游所属应用

  # 调度任务路径覆盖（★ 可选）：覆盖 schedule_config.json 的默认 project_name/task_group。
  # 键为任务类型：f | view | dq | init。不填就用 schedule_config 的默认值（按 schema 取）。
  # 场景：初始化任务组单独项目、DQ 单独项目组等。
  # task_project_override:
  #   init:
  #     project_name: "SRP_INIT"
  #     task_group: "GROUP_INIT"
  #   dq:
  #     project_name: "SRP_DQ"
  #     task_group: "GROUP_DQ"

  # 注意：task_name/job_name/view/dq 全部由脚本标准化派生，designer 不填
  # lts_params 默认含 V_CYCLE_ID→P_CYCLE_ID + V_GROUP_CODE，需要时才改

# === 数据流（规则间关系）===
data_flow:
  # 规则间数据流向
  dependencies:
    - from: ""                          # 规则编号，如 R0001
      to: ""                            # 如 R0002
      type: "data_flow"
      intermediate_table: ""            # 若经过中间表
  # 执行顺序/并行（场景并行在此体现）
  schedule_groups:
    - sequence: 1
      rules: ["R0001"]

# === DQ（RS 驱动：RS L06 有需求就翻译产，没有就留空）===
# designer 是翻译者（类比 field_logics 写 design_logic），不是搬运工，也不自主决定产不产。
# RS 有 DQ（rs_input_view.dq.requirements 非空）→ 翻译产 dq_rules；RS 无 DQ → dq_rules 留空。
# 无"标准三项系统兜底"（主键/审计/记录数不再无条件产）。
dq_rules: []
# 翻译规则（不是原样搬运 RS）：
#   - scope / check_type / rule_name：跟 RS 保持一致（分类不变）
#   - violation_condition：★ 违规条件的 SQL 表达式（检查对象=目标 F 表，别名自定）——
#     DQ 版 design_logic，coder WHERE 直搬不再翻译；字段引用查目标表（N_DQ5 硬拦拼写错）
#   - rule_desc：口径说明（阈值来历/告警级/方向备注），不是 RS 原文
# 例：RS rule_desc="订单金额不能为空" →
#   - rule_id: "DQ_001"
#     scope: "字段级"                          # 跟 RS 一致
#     check_type: "空值检查"                    # 跟 RS 一致
#     rule_name: "订单金额非空"                 # 跟 RS 一致
#     violation_condition: "t.order_amount IS NULL"   # ★ 违规=探测行的 WHERE（coder 直搬）
#     rule_desc: "违规=order_amount 为空（有空值即告警）"  # 口径说明（别写正向"检查 IS NOT NULL"，方向易译反）

# === 软阻断豁免（可选）===
# 某些校验是"软阻断"（默认拦，但有合法通道可放行）。
# designer 若要偏离标准模式，必须在此显式声明豁免——不偷偷溜过去。
