# ============================================================================
# design_decisions.yaml - 设计决策（designer agent 产出）
# ----------------------------------------------------------------------------
# 这个文件只含"设计判断"，不含字段类型/来源等确定性数据。
# 字段详情（类型/注释/来源字段）由 assemble_ts.py 从 rs_input.json 自动搬移。
#
# 产出规则：
# 1. rules[].field_targets 只列目标字段名（target_column），必须覆盖 rs_input
#    里所有 target_column，不能漏、不能重复出现在多个规则。
# 2. field_logics 只写【加工类字段】的自然语言口径；直取字段（直接复制）不写，
#    脚本会自动填默认 design_logic。
# 3. 不碰字段类型、来源表别名——这些脚本会从 rs_input 搬。
# ============================================================================

# === 参数声明（资产级统一声明）===
# P_CYCLE_ID(批次号) 由脚本自动注入，无需在此声明。
# 仅声明业务参数——特定设计场景才需要（如增量起止时间、会计期）。
params: []
#   - name: "BIZ_DATE"              # 参数名（大写+下划线）
#     value_type: "string"          # string | date | datetime | number
#     desc: "增量起始业务日期"
#   - name: "ACCT_PERIOD"
#     value_type: "string"
#     desc: "会计期间"

# === 规则拆分（核心判断）===
# 一个规则 = 一条 INSERT = 产出一个表（中间表/目标F表/视图I表）
rules:
  - rule_code: R0001                    # 规则编号，从 R0001 起
    rule_name: ""                       # 规则名（简短中文）
    scenario: ""                        # 场景（单场景名 / 多场景合并标记；场景是规则的属性）
    exec_sequence: 1                    # 执行顺序
    target_table: ""                    # 产出表名（中间表/目标F表/视图I表）
    is_view_step: false                 # 是否视图步骤
    design_intent: ""                   # 该规则的设计意图（自然语言，一句话说清为什么这样拆）
    load_mode: "truncate_table"         # 写入方式: truncate_table(全量覆盖) | no_delete(追加) | delete(按条件删除) | truncate_partition(分区清空) | merge_into(upsert)
    # write_condition: 写入条件（对应平台delete_condition）。非全量load_mode时必填：
    #   merge_into/update → ON条件如 "T.id=T1.id"（T=目标表别名，T1=源SELECT别名）
    #   truncate_partition → 分区名如 "P_1001"
    #   delete → 删除WHERE如 "rule_id>0"（目标表别名T）
    #   truncate_table/no_delete → 留空
    # designer 填，脚本只搬运+校验（非空、不含中文）。不推导，统一手填。
    write_condition: ""
    step_type: "full"                   # ★ 步骤类型: full(简单直灌/装配) | aggregate(聚合中间表) | incremental_extract(增量取数到tmp) | merge(合并tmp到目标)。决策树见 design-guide §4.4
    target_role: "target"               # ★ 目标角色: intermediate(中间表) | target(目标F表)
    produces_for: []                    # ★ 中间表规则填：产出供哪些规则消费（rule_code列表），如 ["R0003"]
    reads: []                           # ★ 装配/merge规则填：读哪些中间表（表名列表），如 ["tmp1","tmp2"]

    # 增量设计（step_type=incremental_extract 时填，详见 design-guide §5.2）
    # incremental:
    #   key: "update_time"              # 增量识别字段（从 RS 增量表读）
    #   filter: "update_time >= '${BIZ_DATE_START}' AND update_time < '${BIZ_DATE_END}'"  # 增量过滤
    #   init_filter: "1=1"              # 初始化过滤（全量用 1=1，或限定范围）
    #   init_time_range: "ALL"          # 初始化时间范围（来自 RS L07）
    #   init_strategy: "首次全量加载，后续按 update_time 增量"  # 初始化策略
    #   init_mode: "参数控制"           # ★ 初始化实现方式：参数控制 | 独立规则组（designer 决定）

    # 该规则的 target_table 包含哪些字段（填 target_column 名）
    # 中间表和目标表可以有同名字段（如 user_id 在 tmp1 和目标表各一份），不算重复
    # 目标表规则（target_role=target）的并集必须覆盖 rs_input 所有字段
    field_targets:
      - contract_no
      - contract_name
      - contract_amt

    # ★ 仅加工类字段写 design_logic（自然语言口径，不含 SQL）。
    # 直取字段（transform_rule=直接复制）不写，脚本自动填 "直取 {alias}.{column}"。
    # 加工/赋值/序列类字段必须写。
    field_logics:
      contract_amt: "本币金额，原币×汇率，排除作废合同"
      settle_amt: "结算金额，取已结算状态金额汇总"

    # 该规则关联的源表（填别名或表名，脚本从 rs_input 补 schema/table）
    # 如果留空，脚本默认用 rs_input 里所有 source_tables
    source_aliases: []

    # CTE（内联临时表，可选）
    ctes:
      - name: ""
        purpose: ""
        source_tables: []

    # 粒度变化（输入→输出）
    grain:
      input: ""                         # 如 "一行=一个源合同"
      output: ""                        # 如 "一行=一个合同"
      change: ""                        # "无变化" / "多行聚合" / "展开"

    # 关联策略
    joins:
      - alias: ""
        type: ""                        # main / LEFT JOIN / INNER JOIN ...
        condition: ""
        filter: ""

    # 关联安全分析（JOIN键唯一性 → 对齐策略）
    join_safety:
      - table: ""
        join_filter: ""                # JOIN 此表时的范围限定（来自 mapping 的"关联&限定条件"，如 is_current = 1）。explore.py 用它验唯一性
        join_key_unique: true           # JOIN键在 join_filter 限定下是否唯一（不确定时调 explore.py 验证）
        strategy: ""                    # 不唯一时的对齐策略（GROUP BY收敛/取最新有效行）
        reason: ""

# === 设计思路（自然语言，含设计考虑的指标 + 整体策略）===
# 写清楚你的设计思路：为什么这样拆分、整体加工策略是什么。
# 自然地引用指标（JOIN数、聚合字段数等），不要只列数字。
complexity_analysis:
  design_approach: ""                    # ★ 设计思路（自然语言，如"本资产按两个维度分别聚合收敛，产出中间表后统一装配..."）
  segmentation_decision: ""             # "不分段" / "分段"
  segmentation_reason: ""               # 分段理由（如果分段了）

# === 表物理属性（per-table）===
# 每张表各自定义分布键和分布方式。大部分情况下分布键跟业务主键一致，
# 但中间表可能不同（如按 user_id 聚合的 tmp 表用 user_id 做分布键）。
# distribution_key: 分布键字段列表
# distribute_type: 分布方式 HASH(默认) | ROUNDROBIN | REPLICATION（不填时有键=HASH，无键=ROUNDROBIN）
# 其余属性不填走默认（列存 / 按 schema 推断逻辑集群）。
# 字段定义由 assemble_ts.py 从 rs_input 自动搬入 tables.{表名}.fields，designer 不碰。
tables:
  # 目标F表:
  # dwb_xxx_f:
  #   distribution_key: [id]
  #   distribute_type: HASH
  # 维表（复制分布）:
  # dwb_xxx_d:
  #   distribution_key: []
  #   distribute_type: REPLICATION
  # 中间表:
  # dwb_xxx_tmp1:
  #   distribution_key: [id]

# === 业务主键（业务唯一字段组合，供 UT 主键唯一检查）===
# 注意：≠ 分布键。分布键是数据分布最优选，业务主键是业务唯一性。
# DDL 不定义物理 PRIMARY KEY（DWS 列存限制），UT 用 business_key 查唯一性。
# ★ 审视：mapping/RS 标注的主键（备注列标"主键"的字段）在产出表粒度下是否唯一？
#   如头行整合后头表主键会发散，需补充字段。调整了就在下面说明原因。
business_key: []

# 主键设计说明（如果调整了 mapping/RS 标注的主键，必须说明）
business_key_design:
  input_key: []                          # mapping/RS 标注的主键（从备注列提取）
  adjusted: false                        # 是否调整过
  reason: ""                             # 调整原因（adjusted=true 时必填）

# === 调度设计（designer 只填这三个，其余脚本标准化构建）===
schedule:
  schedule_type: "daily"               # daily(日调度) | hourly(定时调度) | realtime(高频/实时)
  cron: "0 30 3 * * ?"                 # designer 填标准 cron（F/view/dq 共用）

  # F 表上游依赖（rs_input 已有的湖表调度脚本自动带，这里只填设计新增的）
  # dep_type: 宽依赖(默认) | 同周期依赖 | 时间点依赖 | 上周期依赖 | 虚拟依赖
  upstream_added: []
  #   - table: "ods_order_f"
  #     task: "task_ods_order_f"        # RS 湖表调度给的任务名（原样保留，不转 job）
  #     dep_type: "宽依赖"
  #     # 跨项目依赖时填上游归属（同项目可不填，export 时用当前表配置兜底）
  #     project: ""                     # 上游所属项目
  #     group: ""                       # 上游所属任务组
  #     app: ""                         # 上游所属应用

  # 调度任务路径覆盖（★ 可选）：覆盖 schedule_config.json 的默认 project_name/task_group。
  # 键为任务类型：f | view | dq | init。不填就用 schedule_config 的默认值（按 schema 取）。
  # 场景：初始化任务组单独项目、DQ 单独项目组等。
  # task_project_override:
  #   init:
  #     project_name: "SRP_INIT"
  #     task_group: "GROUP_INIT"
  #   dq:
  #     project_name: "SRP_DQ"
  #     task_group: "GROUP_DQ"

  # 注意：task_name/job_name/view/dq 全部由脚本标准化派生，designer 不填
  # lts_params 默认含 V_CYCLE_ID→P_CYCLE_ID + V_GROUP_CODE，需要时才改

# === 数据流（规则间关系）===
data_flow:
  # 规则间数据流向
  dependencies:
    - from: ""                          # 规则编号，如 R0001
      to: ""                            # 如 R0002
      type: "data_flow"
      intermediate_table: ""            # 若经过中间表
  # 执行顺序/并行（场景并行在此体现）
  schedule_groups:
    - sequence: 1
      rules: ["R0001"]

# === DQ（可选，不是每表必须）===
# 只放设计意图，DQ SQL 由 coder 生成
dq_rules: []
# DQ 规则从 RS L06 直接搬入（designer 不改类型，只做设计判断）
# 字段跟 RS L06 表头一致（中文原值）：
#   - scope: 检查范围（字段级 / 表级 / 跨表级）
#   - check_type: 检查类型（空值检查 / 重复数据检查 / 跨表数量一致性检查 / 值域约束检查 / 时间拉链检查 / 维度扩散检查）
#   - rule_name: 规则名称
#   - rule_desc: 规则描述（检查口径/阈值/告警级等）
#   - rule_id: "DQ_001"
#     scope: "字段级"
#     check_type: "空值检查"
#     rule_name: ""
#     rule_desc: ""
