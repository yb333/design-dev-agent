# dws-dq-producer 产出格式模板（格式唯一源——decisions 落盘前必须先读到本模板，读不到禁止凭理解自编）
#
# 输入见 pick_dq_context 切片（dq_requirements/target/closure）。逐条翻译/设计，
# scope/check_type/rule_name 跟 RS 保持一致（分类不变）；条数可增加（一条模糊需求
# 可拆多条）但不应少于 RS。SQL 文件名=规则序号派生（dq_{NN}_{清洗check_type}.sql，
# 与 run_ut.dq_filename 同一规则：非字母/数字/中文/下划线换 `_`），一条一个文件。

rules: []
# 每条形态（两种 mode 二选一）：
#
# ── 断言式（assertion）：RS 人话 → 违规表达式，翻译 ──
# - rule_id: "DQ_001"
#   scope: "字段级"                        # 跟 RS 一致
#   check_type: "空值检查"                  # 跟 RS 一致
#   rule_name: "订单金额非空"               # 跟 RS 一致
#   mode: "assertion"
#   violation_condition: "t.order_amount IS NULL"   # ★ 违规=探测行的 WHERE（SQL 表达式）
#   rule_desc: "违规=order_amount 为空（有空值即告警）"  # 口径说明——方向写"违规="，别写正向"检查 IS NOT NULL"（方向易译反）
#   anchored_fields: ["order_amount"]      # 锚定目标字段（可省——装配器从 violation_condition 自动提取）
#
# ── 对比式（compare）：独立重算比对（目标vs来源行一致 / 字段逻辑复核）──
# - rule_id: "DQ_002"
#   scope: "记录级"
#   check_type: "一致性检查"
#   rule_name: "订单金额口径复核"
#   mode: "compare"
#   violation_condition: "t.amount <> s.pay + s.discount（独立重算值与存量不等即违规）"  # 比对口径的摘要声明（不必可直搬——SQL 本体在文件里）
#   rule_desc: "违规=目标表金额与源表 pay+discount 独立重算值不等（方向：不等即违规）"
#   anchored_fields: ["amount"]            # ★ 必填：锚定的目标字段（opt 影响分析=变更字段∩锚定字段）
#   compare_sources: ["ods.orders"]        # ★ 必填：比对的来源表（资产源表内，schema.table 或短名）
#
# ── 歧义标注（两模式通用；有二义才填，宁标勿猜）──
#   ambiguities:
#     - note: "mapping 的 del_flag 口径二义：'已删除=1' 或 '已删除=Y'"
#       options: ["按 1 删除", "按 Y 删除"]
#
# ── 豁免（闸口②人判"数据真脏但检查保留"后回写，producer 不主动填）──
#   waived: false
#   waive_reason: ""
